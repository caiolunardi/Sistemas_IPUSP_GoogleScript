<!--
  GRADIP UI — Tema compartilhado
  Preferências: system | light | dark
  Storage: localStorage["gradip-theme"]
  Contrato: docs/THEME_IMPLEMENTATION.md
-->
<script>
(function () {
  "use strict";

  var STORAGE_KEY = "gradip-theme";
  var VALID_PREFERENCES = { system: true, light: true, dark: true };
  var media = window.matchMedia
    ? window.matchMedia("(prefers-color-scheme: dark)")
    : null;

  function safeReadPreference() {
    try {
      var stored = window.localStorage.getItem(STORAGE_KEY);
      return VALID_PREFERENCES[stored] ? stored : "system";
    } catch (error) {
      return "system";
    }
  }

  function safeWritePreference(preference) {
    try {
      if (preference === "system") {
        window.localStorage.removeItem(STORAGE_KEY);
      } else {
        window.localStorage.setItem(STORAGE_KEY, preference);
      }
    } catch (error) {
      // Tema continua funcional mesmo sem storage.
    }
  }

  function resolveTheme(preference) {
    if (preference === "light" || preference === "dark") {
      return preference;
    }
    return media && media.matches ? "dark" : "light";
  }

  function applyPreference(preference, persist) {
    var safePreference = VALID_PREFERENCES[preference] ? preference : "system";
    var theme = resolveTheme(safePreference);
    var root = document.documentElement;

    root.setAttribute("data-theme", theme);
    root.setAttribute("data-theme-preference", safePreference);
    root.style.colorScheme = theme;

    if (persist) {
      safeWritePreference(safePreference);
    }

    var detail = {
      preference: safePreference,
      theme: theme
    };

    try {
      document.dispatchEvent(new CustomEvent("gradipthemechange", { detail: detail }));
    } catch (error) {
      // Navegadores antigos continuam com o tema aplicado.
    }

    return detail;
  }

  function getPreference() {
    var current = document.documentElement.getAttribute("data-theme-preference");
    return VALID_PREFERENCES[current] ? current : safeReadPreference();
  }

  function getResolvedTheme() {
    var current = document.documentElement.getAttribute("data-theme");
    return current === "dark" ? "dark" : "light";
  }

  function setPreference(preference) {
    if (!VALID_PREFERENCES[preference]) {
      throw new Error("Preferência de tema inválida: " + preference);
    }
    return applyPreference(preference, true);
  }

  function handleSystemChange() {
    if (getPreference() === "system") {
      applyPreference("system", false);
    }
  }

  applyPreference(safeReadPreference(), false);

  if (media) {
    if (typeof media.addEventListener === "function") {
      media.addEventListener("change", handleSystemChange);
    } else if (typeof media.addListener === "function") {
      media.addListener(handleSystemChange);
    }
  }

  window.GradipTheme = Object.freeze({
    getPreference: getPreference,
    getResolvedTheme: getResolvedTheme,
    setPreference: setPreference
  });
})();
</script>
