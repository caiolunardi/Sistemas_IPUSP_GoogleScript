<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comunidade IPUSP</title>

<!-- GRADIP UI — tema (Light/Dark/Sistema). Incluído o mais cedo
     possível, antes de qualquer <style> que consuma var(--gradip-...),
     e antes do iniciar()/google.script.run: o tema é 100% client-side
     e não depende da lista de pessoas. Isso minimiza o "flash" de tema
     errado ao carregar a página. -->
<?!= include_('GradipTema') ?>

<style>

  /*=====================================================
    COMUNIDADE IPUSP (antiga Busca de Alunos) — estilos da página
    principal.

    GRADIP UI v1.0: todas as cores literais do código original
    (#f5f5f5, #333, #005AA9, #d9d9d9, #eaf2fa, #fff1b8, #a33...) foram
    trocadas pelos tokens semânticos de GradipTema.html — Claro e
    Escuro saem do MESMO CSS, sem regra [data-theme="dark"] específica
    deste app. Tamanhos, espaçamentos e a estrutura dos cards de
    resultado foram preservados; o cabeçalho passou a seguir o padrão
    dos outros sistemas (marca IPUSP + título à esquerda; Aparência,
    Ajuda e marca USP à direita; faixa azul embaixo).
  =====================================================*/

  *{ box-sizing:border-box; }

  body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:var(--gradip-bg);
    color:var(--gradip-text);
  }

  /*---------------- CABEÇALHO (padrão GRADIP) ----------------*/

  .cabecalho{
    background:var(--gradip-header-bg);
    min-height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    border-bottom:1px solid var(--gradip-border);
    gap:12px;
  }

  .logoEsquerda{
    display:flex;
    align-items:center;
    gap:15px;
    min-width:0;
  }

  .logoEsquerda .marcaIpuspSvg{
    height:52px;
    flex:0 0 auto;
  }

  .textoCabecalho{
    min-width:0;
  }

  .cabecalho h1{
    margin:0;
    font-size:17px;
    font-weight:bold;
    color:var(--gradip-text);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .cabecalho p{
    margin:2px 0 0 0;
    font-size:13px;
    color:var(--gradip-text-muted);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .cabecalhoDireita{
    display:flex;
    align-items:center;
    gap:16px;
    flex:0 0 auto;
  }

  .logoUSP{
    height:44px;
    width:auto;
    flex:0 0 auto;
  }

  /* Contêiner só de layout da marca USP — sem role/aria-label próprio:
     cada variante (img clara / svg escura) já tem o nome acessível
     "Universidade de São Paulo" dentro de GradipMarcaUSP.html. Mesmo
     padrão do Painel de Solicitações. */
  .logoUSPWrap{
    display:flex;
    align-items:center;
    flex:0 0 auto;
    padding:4px 6px;
    border-radius:6px;
    background:transparent;
  }

  .botaoAjuda{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    background:var(--gradip-info-bg);
    border:1px solid var(--gradip-info-border);
    color:var(--gradip-link);
    font:inherit;
    font-size:13px;
    font-weight:bold;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    min-width:44px;
    min-height:44px;
  }

  .botaoAjuda:hover{
    background:var(--gradip-surface-2);
    border-color:var(--gradip-link);
  }

  .botaoAjuda:focus-visible{
    outline:2px solid var(--gradip-focus);
    outline-offset:2px;
  }

  .barraAzul{
    height:6px;
    background:var(--gradip-header-accent);
  }

  /*---------------- CONTEÚDO ----------------*/

  .conteudo{
    max-width:720px;
    margin:0 auto;
    padding:26px 20px 60px 20px;
  }

  .cardBusca{
    background:var(--gradip-surface);
    border:1px solid var(--gradip-border);
    border-radius:8px;
    padding:18px 20px;
    box-shadow:var(--gradip-shadow);
    margin-bottom:18px;
  }

  /* Rótulo visível do campo (o original só tinha placeholder, que some
     ao digitar e não serve de nome acessível confiável). */
  .rotuloBusca{
    display:block;
    font-size:13px;
    font-weight:bold;
    color:var(--gradip-text);
    margin-bottom:8px;
  }

  .campoBusca{
    width:100%;
    min-height:44px;
    padding:13px 16px;
    /* --gradip-border-strong: token dos limites de controles (>=3:1
       contra o fundo do campo nos dois temas, ver GradipTema.html). O
       original usava a borda azul de 1.5px como destaque; o azul agora
       aparece no hover/foco. */
    border:1.5px solid var(--gradip-border-strong);
    border-radius:8px;
    font-size:15px;
    font-family:inherit;
    background:var(--gradip-input-bg);
    color:var(--gradip-input-text);
  }

  .campoBusca::placeholder{
    /* Mesmo ajuste do Painel de Solicitações: --gradip-input-placeholder
       fica abaixo de 4.5:1 no Claro; --gradip-text-muted passa nos dois
       temas. */
    color:var(--gradip-text-muted);
  }

  .campoBusca:hover{
    border-color:var(--gradip-link);
  }

  .campoBusca:focus{
    outline:none;
    border-color:var(--gradip-focus);
    box-shadow:0 0 0 3px var(--gradip-info-border);
  }

  .campoBusca:focus-visible{
    outline:2px solid var(--gradip-focus);
    outline-offset:1px;
  }

  .campoBusca:disabled{
    background:var(--gradip-disabled-bg);
    color:var(--gradip-disabled-text);
    cursor:wait;
  }

  .infoBusca{
    margin-top:10px;
    font-size:12.5px;
    color:var(--gradip-text-muted);
  }

  /* Gatilhos de ajuda contextual — abrem a Central direto na seção
     certa (data-gradip-help-open), sem repetir o texto aqui. */
  .ajudaContextualLinha{
    display:flex;
    flex-wrap:wrap;
    gap:4px 18px;
    margin-top:10px;
  }

  .linkAjudaContextual{
    display:inline-block;
    background:none;
    border:none;
    /* Padding + margem negativa iguais: área de toque perto de 44px sem
       mover o texto (mesma técnica do Painel de Solicitações). */
    padding:15px 4px;
    margin:-15px -4px;
    font:inherit;
    font-size:12.5px;
    font-weight:bold;
    text-decoration:underline;
    cursor:pointer;
    color:var(--gradip-link);
  }

  .linkAjudaContextual:hover{
    color:var(--gradip-link-hover);
  }

  .linkAjudaContextual:focus-visible{
    outline:2px solid var(--gradip-focus);
    outline-offset:-10px;
  }

  /* Link interno usado dentro de um texto da Central de Ajuda
     (BuscaAlunosAjuda.html) para pular para outra seção. Fica aqui, e
     não em BuscaAlunosAjudaEstilos.html, para que aquele arquivo
     continue byte-idêntico a shared/ajuda/GradipAjudaEstilos.html. */
  .linkAjudaInterno{
    display:inline;
    background:none;
    border:none;
    padding:0;
    font:inherit;
    color:var(--gradip-link);
    text-decoration:underline;
    cursor:pointer;
  }

  .linkAjudaInterno:hover{
    color:var(--gradip-link-hover);
  }

  .linkAjudaInterno:focus-visible{
    outline:2px solid var(--gradip-focus);
    outline-offset:2px;
  }

  .listaResultados{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  /* v1.3: o card é um contêiner com DOIS botões — a área de dados
     (abre a ficha) e o selo do nº USP (copia o número). Por isso o
     respiro interno saiu do card e foi para o botão da ficha. */
  .cardAluno{
    background:var(--gradip-surface);
    border:1px solid var(--gradip-border);
    border-radius:8px;
    padding:0;
    box-shadow:var(--gradip-shadow);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:4px;
  }

  .cardAluno:hover{
    border-color:var(--gradip-link);
  }

  .dadosAluno{
    min-width:0;
  }

  .nomeAluno{
    font-size:14.5px;
    font-weight:bold;
    color:var(--gradip-text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .detalheAluno{
    font-size:12.5px;
    color:var(--gradip-text-muted);
    margin-top:3px;
    overflow-wrap:anywhere;
  }

  .detalheAluno .separador{
    color:var(--gradip-border-strong);
    margin:0 6px;
  }

  .badgeUsp{
    flex:0 0 auto;
    background:var(--gradip-info-bg);
    border:1px solid var(--gradip-info-border);
    color:var(--gradip-link);
    font-size:12px;
    font-weight:bold;
    padding:5px 10px;
    border-radius:20px;
    white-space:nowrap;
  }

  .vazio{
    text-align:center;
    color:var(--gradip-text-muted);
    padding:40px 20px;
    font-size:13.5px;
    background:var(--gradip-surface);
    border:1px solid var(--gradip-border);
    border-radius:8px;
  }

  /* Erro: fundo + borda + texto semânticos de perigo (nada de pastel
     claro fixo no Escuro). O estado não depende só da cor: a mensagem
     sempre começa com "Não consegui carregar a lista de pessoas". */
  .vazio.erro{
    color:var(--gradip-danger);
    background:var(--gradip-danger-bg);
    border-color:var(--gradip-danger-border);
  }

  .rodape{
    text-align:center;
    color:var(--gradip-text-muted);
    font-size:12px;
    padding:10px 0 30px 0;
  }

  /* Destaque dos trechos que casaram com a busca. Não existe token de
     "marca-texto" no GRADIP; usa-se o par de alerta (fundo + borda),
     que já tem versão própria no Escuro. O sublinhado inferior garante
     que o destaque não dependa só da cor de fundo. */
  mark{
    background:var(--gradip-warning-bg);
    color:inherit;
    border-radius:2px;
    padding:0 1px;
    box-shadow:inset 0 -2px 0 var(--gradip-warning-border);
  }

  /*---------------- v1.1 — FILTROS E EXPORTAÇÃO ----------------*/

  .linhaFiltros{
    display:flex;
    flex-wrap:wrap;
    align-items:flex-end;
    gap:10px 14px;
    margin-top:14px;
  }

  .campoFiltro{
    display:flex;
    flex-direction:column;
    gap:5px;
    font-size:12.5px;
    font-weight:bold;
    color:var(--gradip-text);
  }

  .seletorFiltro{
    min-height:44px;
    min-width:150px;
    padding:0 34px 0 10px;
    border:1px solid var(--gradip-border-strong);
    border-radius:8px;
    background:var(--gradip-input-bg);
    color:var(--gradip-input-text);
    font:inherit;
    font-weight:normal;
    font-size:14px;
    cursor:pointer;
  }

  .seletorFiltro:hover{ border-color:var(--gradip-link); }

  .seletorFiltro:focus-visible{
    outline:2px solid var(--gradip-focus);
    outline-offset:2px;
  }

  .seletorFiltro:disabled{
    background:var(--gradip-disabled-bg);
    color:var(--gradip-disabled-text);
    cursor:not-allowed;
  }

  .acoesExportar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-left:auto;
  }

  .botaoSecundario,
  .botaoPrimario{
    min-height:44px;
    padding:0 16px;
    border-radius:8px;
    font:inherit;
    font-size:13.5px;
    font-weight:bold;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }

  .botaoSecundario{
    background:var(--gradip-surface);
    color:var(--gradip-link);
    border:1px solid var(--gradip-border-strong);
  }

  .botaoSecundario:hover:not(:disabled){
    border-color:var(--gradip-link);
    background:var(--gradip-surface-2);
  }

  .botaoPrimario{
    background:var(--gradip-primary);
    color:var(--gradip-on-primary);
    border:1px solid var(--gradip-primary);
  }

  .botaoPrimario:hover:not(:disabled){
    background:var(--gradip-primary-hover);
    border-color:var(--gradip-primary-hover);
  }

  .botaoSecundario:focus-visible,
  .botaoPrimario:focus-visible{
    outline:2px solid var(--gradip-focus);
    outline-offset:2px;
  }

  .botaoSecundario:disabled,
  .botaoPrimario:disabled{
    background:var(--gradip-disabled-bg);
    color:var(--gradip-disabled-text);
    border-color:var(--gradip-border);
    cursor:not-allowed;
  }

  /* Área de dados do card: <button> de verdade (teclado e leitor de
     tela) que abre a ficha — de qualquer vínculo desde a v1.3. */
  button.abrirFicha{
    flex:1 1 auto;
    min-width:0;
    background:none;
    border:0;
    border-radius:8px;
    padding:12px 16px;
    font:inherit;
    color:inherit;
    text-align:left;
    cursor:pointer;
  }

  button.abrirFicha:focus-visible,
  button.copiarUsp:focus-visible{
    outline:2px solid var(--gradip-focus);
    outline-offset:2px;
  }

  /* v1.3: selo do nº USP clicável — copia o número. O botão tem alvo
     de 44 px; o selo visível continua do mesmo tamanho. */
  button.copiarUsp{
    flex:0 0 auto;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:44px;
    min-height:44px;
    margin-right:10px;
    padding:0 2px;
    background:none;
    border:0;
    border-radius:20px;
    font:inherit;
    cursor:copy;
  }
  button.copiarUsp:hover .badgeUsp{
    border-color:var(--gradip-link);
  }
  .badgeUsp.semUsp{
    margin-right:16px;
    background:var(--gradip-surface);
    border-color:var(--gradip-border);
    color:var(--gradip-text-muted);
  }

  /* Mensagem discreta "Número USP copiado..." (3 s). */
  .avisoCopia[hidden]{ display:none; }
  .avisoCopia{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    z-index:11000;
    max-width:calc(100% - 32px);
    padding:8px 14px;
    font-size:13px;
    color:var(--gradip-text);
    background:var(--gradip-surface-elevated);
    border:1px solid var(--gradip-border-strong);
    border-radius:8px;
    box-shadow:var(--gradip-shadow);
  }

  .cardAluno .dadosAluno{ display:block; min-width:0; }
  .cardAluno .nomeAluno,
  .cardAluno .detalheAluno{ display:block; }

  /*---------------- v1.2 — VÍNCULO no card ----------------
    Selo com o texto do vínculo (Aluno, Docente, Servidor, Setor)
    antes do nome. A cor só reforça: o texto é sempre visível.
    Tokens semânticos de fundo/borda/texto de cada estado — os
    mesmos nos dois temas, sem pastel fixo. */
  .seloVinculo{
    display:inline-block;
    font-size:11.5px;
    font-weight:bold;
    line-height:1.3;
    padding:1px 8px;
    margin-right:8px;
    border-radius:999px;
    border:1px solid var(--gradip-border-strong);
    background:var(--gradip-surface);
    color:var(--gradip-text);
    vertical-align:1px;
  }
  .seloVinculo--aluno{
    background:var(--gradip-info-bg);
    border-color:var(--gradip-info-border);
    color:var(--gradip-link);
  }
  .seloVinculo--docente{
    background:var(--gradip-success-bg);
    border-color:var(--gradip-success-border);
    color:var(--gradip-success);
  }
  .seloVinculo--servidor{
    background:var(--gradip-warning-bg);
    border-color:var(--gradip-warning-border);
    color:var(--gradip-warning);
  }
  .seloVinculo--setor{
    border-style:dashed;
  }

  /* Aviso de cadastro que não pôde ser lido (os outros aparecem). */
  .avisoCadastros[hidden]{ display:none; }
  .avisoCadastros{
    margin-top:10px;
    padding:8px 12px;
    font-size:12.5px;
    color:var(--gradip-text);
    background:var(--gradip-warning-bg);
    border:1px solid var(--gradip-warning-border);
    border-radius:8px;
  }

  .ingressoAluno{
    color:var(--gradip-text-muted);
    font-weight:normal;
    font-size:12px;
    margin-left:6px;
  }

  /*---------------- v1.1 — FICHA DO ALUNO (modal) ----------------*/

  .fichaOverlay[hidden]{ display:none !important; }

  .fichaOverlay{
    position:fixed;
    inset:0;
    z-index:9000; /* abaixo da Central de Ajuda (10000) */
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    background:var(--gradip-overlay);
  }

  .fichaDialogo{
    width:min(640px, calc(100vw - 32px));
    max-height:calc(100vh - 32px);
    max-height:calc(100dvh - 32px);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:var(--gradip-surface-elevated);
    color:var(--gradip-text);
    border:1px solid var(--gradip-border);
    border-radius:12px;
  }

  .fichaCabecalho{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    padding:16px 20px;
    border-bottom:1px solid var(--gradip-border);
  }

  .fichaCabecalho h2{
    margin:2px 0 0;
    font-size:18px;
    overflow-wrap:anywhere;
  }

  .fichaRotuloTopo{
    margin:0;
    font-size:12px;
    font-weight:bold;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--gradip-text-muted);
  }

  .fichaFechar{
    flex:0 0 44px;
    width:44px;
    height:44px;
    border:1px solid var(--gradip-border);
    border-radius:9px;
    background:var(--gradip-surface);
    color:var(--gradip-text);
    font:inherit;
    font-size:24px;
    line-height:1;
    cursor:pointer;
  }

  .fichaFechar:focus-visible{
    outline:2px solid var(--gradip-focus);
    outline-offset:2px;
  }

  .fichaCorpo{
    overflow-y:auto;
    padding:16px 20px;
  }

  .fichaAviso{
    margin:0 0 14px;
    padding:10px 12px;
    border-radius:8px;
    font-size:13px;
    line-height:1.45;
    background:var(--gradip-info-bg);
    border:1px solid var(--gradip-info-border);
    color:var(--gradip-text);
  }

  .fichaAviso.alerta{
    background:var(--gradip-warning-bg);
    border-color:var(--gradip-warning-border);
  }

  .fichaCampo{
    display:block;
    margin-bottom:12px;
  }

  .fichaCampo span{
    display:block;
    font-size:12.5px;
    font-weight:bold;
    margin-bottom:5px;
  }

  .fichaCampo small{
    font-weight:normal;
    color:var(--gradip-text-muted);
  }

  .fichaCampo input{
    width:100%;
    min-height:44px;
    padding:9px 12px;
    border:1px solid var(--gradip-border-strong);
    border-radius:8px;
    background:var(--gradip-input-bg);
    color:var(--gradip-input-text);
    font:inherit;
    font-size:14px;
  }

  .fichaCampo input:focus-visible{
    outline:2px solid var(--gradip-focus);
    outline-offset:1px;
  }

  .fichaCampo input:read-only{
    background:var(--gradip-disabled-bg);
    color:var(--gradip-text);
    border-style:dashed;
  }

  .fichaCampo input.alterado{
    border-color:var(--gradip-warning-border);
    box-shadow:inset 4px 0 0 var(--gradip-warning-border);
  }

  .fichaRodape{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:flex-end;
    gap:8px 10px;
    padding:12px 20px;
    border-top:1px solid var(--gradip-border);
  }

  .fichaStatus{
    flex:1 1 220px;
    margin:0;
    font-size:13px;
    color:var(--gradip-text-muted);
  }

  .fichaStatus.ok{ color:var(--gradip-success); font-weight:bold; }
  .fichaStatus.erro{ color:var(--gradip-danger); font-weight:bold; }

  /*---------------- RESPONSIVO — TELAS ESTREITAS ----------------*/

  @media (max-width:480px){
    /* Mesmo comportamento do header do Painel de Solicitações: duas
       faixas (marca + título; Aparência + Ajuda + USP), título e
       subtítulo quebram linha em vez de truncar. */
    .cabecalho{
      flex-wrap:wrap;
      padding:10px 12px;
      gap:8px;
      row-gap:8px;
    }
    .logoEsquerda{
      gap:8px;
      flex:1 1 100%;
      width:100%;
    }
    .logoEsquerda .marcaIpuspSvg{
      height:38px;
    }
    .logoUSP{
      height:32px;
    }
    .logoUSPWrap{
      padding:2px 3px;
    }
    .cabecalho h1{
      font-size:14px;
      white-space:normal;
      overflow:visible;
      text-overflow:clip;
    }
    .cabecalho p{
      font-size:11px;
      white-space:normal;
      overflow:visible;
      text-overflow:clip;
    }
    .cabecalhoDireita{
      gap:6px;
      flex:1 1 100%;
      width:100%;
    }
    .botaoAjuda .textoAjuda{
      display:none;
    }
    .botaoAjuda{

<!-- Script da busca. Na v1.0 era o script original sem alterações;
     a v1.1 acrescenta filtro por ingresso, exportação e ficha do
     aluno; a v1.2 junta docentes, servidores e setores (ver
     comentário no topo do bloco). O tema não depende dele. -->
<script>

  /*=====================================================
    COMUNIDADE IPUSP — comportamento da página.

    v1.0: este bloco era o script original, byte-idêntico.
    v1.1 (pedido do Serviço de Graduação, 13/10/2026) acrescenta,
    sem mudar a busca por texto:
      - filtro por ANO e SEMESTRE de ingresso (coluna Ingresso,
        AAAA/S), combinável com o texto digitado; o combobox de
        anos é montado a partir dos anos que existem na lista;
      - EXPORTAÇÃO do resultado atual (todos os alunos filtrados,
        não só os 60 da tela) em CSV (gerado aqui) ou PDF (gerado
        no servidor por gerarPdfListaAlunos);
      - FICHA DO ALUNO: clicar num resultado abre um modal com
        todas as colunas da planilha (obterFichaAluno), editável
        para quem é editor da planilha (salvarFichaAluno).
    v1.2 — COMUNIDADE IPUSP (14/10/2026): a mesma caixa de busca
    procura também em docentes, servidores e setores. Cada card
    ganha o selo do vínculo. O filtro de ingresso, por definição,
    só traz alunos.
    v1.3 (14/10/2026): a ficha abre para todos os vínculos
    (obterFicha/salvarFicha, com o cadastro de cada um); pessoas
    mostram o nº USP, que é copiado ao clicar no selo; o título da
    ficha do docente leva Prof./Profª. calculado pelo servidor.
    A lista continua chegando numa única chamada (agora
    listarComunidadeParaBusca) e a filtragem continua no navegador.
  =====================================================*/

  // Todas as pessoas carregadas (alunos, docentes, servidores e
  // setores). O nome da variável vem da v1.1.
  let TODOS_ALUNOS = [];
  let CARREGOU = false;

  const MAX_RESULTADOS = 60;

  const campoBusca = document.getElementById("campoBusca");
  const listaResultados = document.getElementById("listaResultados");
  const infoBusca = document.getElementById("infoBusca");
  const filtroAno = document.getElementById("filtroAno");
  const filtroSemestre = document.getElementById("filtroSemestre");
  const botaoCsv = document.getElementById("botaoCsv");
  const botaoPdf = document.getElementById("botaoPdf");
  const avisoCadastros = document.getElementById("avisoCadastros");

  // v1.2: texto do selo de cada vínculo (também vai na exportação).
  const VINCULOS = { aluno: "Aluno", docente: "Docente", servidor: "Servidor", setor: "Setor" };

  // v1.3: cadastro (planilha) de cada vínculo — servidor e setor estão
  // na mesma planilha. Usado ao abrir e salvar a ficha.
  const CADASTRO_DO_TIPO = { aluno: "alunos", docente: "docentes", servidor: "servidores", setor: "servidores" };
  const ROTULO_FICHA = { aluno: "Ficha do aluno", docente: "Ficha do docente", servidor: "Ficha do servidor", setor: "Ficha do setor" };

  // Identifica o card na lista (a linha sozinha repete entre planilhas).
  function chavePessoa_(p) {
    return CADASTRO_DO_TIPO[p.tipo] + ":" + p.linha;
  }

  // Setor sem NOME aparece pelo nome do setor.
  function nomeExibido_(p) {
    return p.nome || p.setor || "(sem nome cadastrado)";
  }

  /*-----------------------------------------------------
    v1.3 — COPIAR Nº USP: clique no selo copia o número e mostra
    "Número USP copiado para área de transferência" por 3 s. Usa a
    API de área de transferência e, se o navegador (ou o iframe do
    Apps Script) recusar, o método antigo com um campo temporário.
  ------------------------------------------------------*/
  const avisoCopia = document.getElementById("avisoCopia");
  let temporizadorCopia = null;

  function mostrarAvisoCopia_(texto) {
    clearTimeout(temporizadorCopia);
    avisoCopia.textContent = texto;
    avisoCopia.hidden = false;
    temporizadorCopia = setTimeout(() => { avisoCopia.hidden = true; avisoCopia.textContent = ""; }, 3000);
  }

  function copiarPorCampoTemporario_(texto) {
    const campo = document.createElement("textarea");
    campo.value = texto;
    campo.setAttribute("readonly", "");
    campo.style.position = "fixed";
    campo.style.opacity = "0";
    campo.style.left = "-9999px";
    document.body.appendChild(campo);
    const foco = document.activeElement;
    campo.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    campo.remove();
    if (foco && foco.focus) foco.focus();
    return ok;
  }

  function copiarNumeroUsp_(numero) {
    const texto = String(numero || "");
    const sucesso = () => mostrarAvisoCopia_("Número USP copiado para área de transferência");
    const falha = () => {
      if (copiarPorCampoTemporario_(texto)) sucesso();
      else mostrarAvisoCopia_("Não consegui copiar. Selecione o número e use Ctrl+C.");
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(sucesso, falha);
    } else {
      falha();
    }
  }

  // Resultado que está na tela agora (já filtrado por texto, ano e
  // semestre) — é exatamente isso que os botões de exportação usam.
  let RESULTADO_ATUAL = [];

  /*-----------------------------------------------------
    Normalização pra busca: minúsculas + sem acento, pra
    "Claudia" achar "Cláudia" e vice-versa.
  ------------------------------------------------------*/
  function normalizar_(texto) {
    return String(texto || "")
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "")
        .toLowerCase();
  }

  function escaparHtml_(texto) {
    const div = document.createElement("div");
    div.textContent = String(texto || "");
    return div.innerHTML;
  }

  // Envolve, dentro de um texto já normalizado/minúsculo, os trechos
  // que batem com os termos buscados, num <mark> — usa o texto
  // ORIGINAL (com acento) pra exibição, só a posição vem do texto
  // normalizado (os dois têm o mesmo tamanho, char a char).
  function destacar_(textoOriginal, termos) {
    const textoNormalizado = normalizar_(textoOriginal);
    const marcado = new Array(textoOriginal.length).fill(false);
    termos.forEach(termo => {
      if (!termo) return;
      let pos = 0;
      while (true) {
        const i = textoNormalizado.indexOf(termo, pos);
        if (i === -1) break;
        for (let k = i; k < i + termo.length; k++) marcado[k] = true;
        pos = i + termo.length;
      }
    });
    let html = "";
    let aberto = false;
    for (let i = 0; i < textoOriginal.length; i++) {
      if (marcado[i] && !aberto) { html += "<mark>"; aberto = true; }
      if (!marcado[i] && aberto) { html += "</mark>"; aberto = false; }
      html += escaparHtml_(textoOriginal[i]);
    }
    if (aberto) html += "</mark>";
    return html;
  }

  // v1.1: além do texto de busca, guarda ano e semestre de ingresso
  // já separados ("2024/1" → _ano "2024", _semestre "1"). Ingresso
  // fora do formato fica com _ano vazio e só aparece em "Todos os anos".
  // v1.2: vale para qualquer pessoa (tipo ausente = aluno); setor
  // entra no texto de busca; campos que o cadastro não tem ficam "".
  function prepararAluno_(aluno) {
    const tipo = VINCULOS[aluno.tipo] ? aluno.tipo : "aluno";
    const completo = Object.assign({ numeroUsp: "", nome: "", ingresso: "", email: "", emailSecundario: "", setor: "" }, aluno, { tipo: tipo });
    const busca = normalizar_([completo.nome, completo.numeroUsp, completo.email, completo.emailSecundario, completo.setor].join(" "));
    const partes = tipo === "aluno" ? String(completo.ingresso || "").trim().match(/^(\d{4})(?:\s*\/\s*(\d))?/) : null;
    return Object.assign(completo, {
      _busca: busca,
      _ano: partes ? partes[1] : "",
      _semestre: partes && partes[2] ? partes[2] : ""
    });
  }

  function filtrarAlunos_(query) {
    const termos = normalizar_(query).split(/\s+/).filter(Boolean);
    const ano = filtroAno.value;
    const semestre = filtroSemestre.value;
    if (termos.length === 0 && !ano) return { termos: [], resultado: [] };
    const resultado = TODOS_ALUNOS.filter(aluno =>
      (!ano || aluno._ano === ano) &&
      (!semestre || aluno._semestre === semestre) &&
      termos.every(termo => aluno._busca.indexOf(termo) !== -1)
    );
    // Lista de um ano inteiro (sem texto) sai em ordem alfabética —
    // é a que costuma ser exportada.
    if (termos.length === 0) {
      resultado.sort((a, b) => String(a.nome).localeCompare(String(b.nome), "pt-BR"));
    }
    return { termos: termos, resultado: resultado };
  }

  // Monta o combobox com todos os anos que aparecem na coluna
  // Ingresso, do mais recente para o mais antigo, com a contagem.
  function montarFiltroAno_() {
    const selecionado = filtroAno.value;
    const contagem = {};
    TODOS_ALUNOS.forEach(a => { if (a._ano) contagem[a._ano] = (contagem[a._ano] || 0) + 1; });
    const anos = Object.keys(contagem).sort((a, b) => b.localeCompare(a));
    filtroAno.innerHTML = "";
    const todos = document.createElement("option");
    todos.value = "";
    todos.textContent = "Todos os anos";
    filtroAno.appendChild(todos);
    anos.forEach(ano => {
      const opcao = document.createElement("option");
      opcao.value = ano;
      opcao.textContent = `${ano} (${contagem[ano]})`;
      filtroAno.appendChild(opcao);
    });
    filtroAno.value = anos.indexOf(selecionado) !== -1 ? selecionado : "";
    filtroSemestre.disabled = !filtroAno.value;
    if (!filtroAno.value) filtroSemestre.value = "";
  }

  function renderizarVazio_(mensagem, ehErro) {
    listaResultados.innerHTML = "";
    const div = document.createElement("div");
    div.className = ehErro ? "vazio erro" : "vazio";
    div.textContent = mensagem;
    listaResultados.appendChild(div);
  }

  function renderizarResultados_(alunos, termos) {

    listaResultados.innerHTML = "";

    const mostrando = alunos.slice(0, MAX_RESULTADOS);

    mostrando.forEach(aluno => {

      // v1.3: o card é um contêiner com o botão da ficha (todos os
      // vínculos) e, para pessoas, o botão que copia o nº USP — dois
      // botões lado a lado, nunca um dentro do outro.
      const ehAluno = aluno.tipo === "aluno";
      const card = document.createElement("div");
      card.className = "cardAluno cardAluno--" + aluno.tipo;
      card.dataset.tipo = aluno.tipo;
      card.dataset.chave = chavePessoa_(aluno);

      const dados = document.createElement("button");
      dados.type = "button";
      dados.className = "dadosAluno abrirFicha";
      dados.setAttribute("aria-haspopup", "dialog");
      dados.dataset.chave = chavePessoa_(aluno);
      dados.addEventListener("click", () => abrirFicha_(aluno, dados));

      const nome = document.createElement("span");
      nome.className = "nomeAluno";
      const selo = document.createElement("span");
      selo.className = "seloVinculo seloVinculo--" + aluno.tipo;
      selo.textContent = VINCULOS[aluno.tipo];
      const textoNome = document.createElement("span");
      textoNome.className = "textoNome";
      textoNome.innerHTML = destacar_(nomeExibido_(aluno), termos);
      nome.appendChild(selo);
      nome.appendChild(textoNome);
      if (ehAluno && aluno.ingresso) {
        const ingresso = document.createElement("span");
        ingresso.className = "ingressoAluno";
        ingresso.textContent = "· ingresso " + aluno.ingresso;
        nome.appendChild(ingresso);
      }

      const detalhe = document.createElement("span");
      detalhe.className = "detalheAluno";
      const partesDetalhe = [];
      // Setor do servidor (no card de setor, só se diferente do nome).
      if (aluno.setor && (aluno.tipo === "servidor" || normalizar_(aluno.setor) !== normalizar_(aluno.nome))) {
        partesDetalhe.push(destacar_(aluno.setor, termos));
      }
      if (aluno.email) partesDetalhe.push(destacar_(aluno.email, termos));
      if (aluno.emailSecundario) partesDetalhe.push(destacar_(aluno.emailSecundario, termos) + " (secundário)");
      detalhe.innerHTML = partesDetalhe.length
          ? partesDetalhe.join('<span class="separador">·</span>')
          : "sem e-mail cadastrado";

      dados.appendChild(nome);
      dados.appendChild(detalhe);

      card.appendChild(dados);
      // v1.3: nº USP de toda PESSOA (aluno, docente, servidor); setor não tem.
      if (aluno.tipo !== "setor") {
        const badge = document.createElement("span");
        badge.className = "badgeUsp";
        badge.innerHTML = aluno.numeroUsp ? destacar_(aluno.numeroUsp, termos) : "sem nº USP";
        if (aluno.numeroUsp) {
          const copiar = document.createElement("button");
          copiar.type = "button";
          copiar.className = "copiarUsp";
          copiar.title = "Copiar número USP";
          copiar.setAttribute("aria-label", `Copiar número USP ${aluno.numeroUsp}`);
          copiar.addEventListener("click", () => copiarNumeroUsp_(aluno.numeroUsp));
          copiar.appendChild(badge);
          card.appendChild(copiar);
        } else {
          badge.classList.add("semUsp");
          card.appendChild(badge);
        }
      }
      listaResultados.appendChild(card);

    });

    if (alunos.length > MAX_RESULTADOS) {
      const aviso = document.createElement("div");
      aviso.className = "vazio";
      aviso.style.padding = "14px 20px";
      aviso.textContent = `Mostrando os primeiros ${MAX_RESULTADOS} de ${alunos.length} resultados — digite mais alguma coisa pra refinar. A exportação inclui todos os ${alunos.length}.`;
      listaResultados.appendChild(aviso);
    }

  }

  function atualizarExportacao_() {
    const pode = RESULTADO_ATUAL.length > 0;
    botaoCsv.disabled = !pode;
    botaoPdf.disabled = !pode;
  }

  function executarBusca_() {

    const query = campoBusca.value;

    if (!query.trim() && !filtroAno.value) {
      RESULTADO_ATUAL = [];
      atualizarExportacao_();
      listaResultados.innerHTML = "";
      infoBusca.textContent = `${resumoCarga_()} — comece a digitar ou escolha um ano de ingresso.`;
      return;
    }

    const { termos, resultado } = filtrarAlunos_(query);
    RESULTADO_ATUAL = resultado;
    atualizarExportacao_();

    if (resultado.length === 0) {
      infoBusca.textContent = `${resumoCarga_()}.`;
      renderizarVazio_(filtroAno.value
          ? "Nenhum aluno encontrado com esse filtro de ingresso e essa busca."
          : "Nenhuma pessoa encontrada com esse nome, número USP, e-mail ou setor.", false);
      return;
    }

    infoBusca.textContent = `${resultado.length} resultado${resultado.length === 1 ? "" : "s"} encontrado${resultado.length === 1 ? "" : "s"}${descreverFiltro_()}.`;
    renderizarResultados_(resultado, termos);

  }

  // v1.2: "536 alunos, 81 docentes, 12 servidores e 3 setores carregados"
  // (tipos sem ninguém não aparecem).
  function resumoCarga_() {
    const plural = { aluno: "alunos", docente: "docentes", servidor: "servidores", setor: "setores" };
    const contagem = { aluno: 0, docente: 0, servidor: 0, setor: 0 };
    TODOS_ALUNOS.forEach(p => { contagem[p.tipo]++; });
    const partes = Object.keys(contagem)
        .filter(t => contagem[t] > 0)
        .map(t => `${contagem[t]} ${contagem[t] === 1 ? t : plural[t]}`);
    if (!partes.length) return "Nenhuma pessoa carregada";
    const texto = partes.length === 1 ? partes[0] : partes.slice(0, -1).join(", ") + " e " + partes[partes.length - 1];
    return texto + (TODOS_ALUNOS.length === 1 ? " carregado" : " carregados");
  }

  // " · ingresso 2024 (1º semestre)" — texto do filtro ativo.
  function descreverFiltro_() {
    if (!filtroAno.value) return "";
    return ` · ingresso ${filtroAno.value}` + (filtroSemestre.value ? ` (${filtroSemestre.value}º semestre)` : "");
  }

  let temporizadorBusca = null;
  campoBusca.addEventListener("input", () => {
    clearTimeout(temporizadorBusca);
    temporizadorBusca = setTimeout(executarBusca_, 120);
  });

  filtroAno.addEventListener("change", () => {
    filtroSemestre.disabled = !filtroAno.value;
    if (!filtroAno.value) filtroSemestre.value = "";
    executarBusca_();
  });
  filtroSemestre.addEventListener("change", executarBusca_);

  /*-----------------------------------------------------
    EXPORTAÇÃO — sempre do RESULTADO_ATUAL inteiro.
  ------------------------------------------------------*/
  // v1.2: Vínculo e Setor entram porque a lista pode misturar tipos.
  const COLUNAS_EXPORTACAO = [
    ["Vínculo", "vinculo"],
    ["Nome", "nome"],
    ["Setor", "setor"],
    ["Número USP", "numeroUsp"],
    ["Ingresso", "ingresso"],
    ["E-mail", "email"],
    ["E-mail secundário", "emailSecundario"]
  ];

  function valorExportacao_(pessoa, chave) {
    if (chave === "vinculo") return VINCULOS[pessoa.tipo];
    if (chave === "nome") return pessoa.nome || pessoa.setor || "";
    return pessoa[chave] || "";
  }

  function nomeBaseArquivo_() {
    const partes = [filtroAno.value ? "alunos" : "comunidade"];
    if (filtroAno.value) partes.push("ingresso-" + filtroAno.value + (filtroSemestre.value ? "-" + filtroSemestre.value : ""));
    if (campoBusca.value.trim()) partes.push("busca");
    return partes.join("_");
  }

  function tituloExportacao_() {
    let titulo = filtroAno.value ? "Alunos" : "Comunidade IPUSP";
    if (filtroAno.value) titulo += ` — ingresso ${filtroAno.value}` + (filtroSemestre.value ? `/${filtroSemestre.value}` : "");
    if (campoBusca.value.trim()) titulo += ` — busca "${campoBusca.value.trim()}"`;
    return titulo;
  }

  // CSV com ";" (padrão do Excel em português) e BOM UTF-8, pra
  // acentos abrirem certo. Campos que começam com = + - @ ganham um
  // apóstrofo na frente, pra planilhas não executarem como fórmula.
  function celulaCsv_(valor) {
    let t = String(valor == null ? "" : valor);
    if (/^[=+\-@\t\r]/.test(t)) t = "'" + t;
    return /[";\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  }

  function baixarArquivo_(conteudo, tipo, nome) {
    const blob = conteudo instanceof Blob ? conteudo : new Blob([conteudo], { type: tipo });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = nome;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  botaoCsv.addEventListener("click", () => {
    if (!RESULTADO_ATUAL.length) return;
    const linhas = [COLUNAS_EXPORTACAO.map(c => celulaCsv_(c[0])).join(";")];
    RESULTADO_ATUAL.forEach(a => linhas.push(COLUNAS_EXPORTACAO.map(c => celulaCsv_(valorExportacao_(a, c[1]))).join(";")));
    baixarArquivo_("﻿" + linhas.join("\r\n") + "\r\n", "text/csv;charset=utf-8", nomeBaseArquivo_() + ".csv");
    infoBusca.textContent = `CSV gerado com ${RESULTADO_ATUAL.length} pessoa${RESULTADO_ATUAL.length === 1 ? "" : "s"}.`;
  });

  botaoPdf.addEventListener("click", () => {
    if (!RESULTADO_ATUAL.length) return;
    botaoPdf.disabled = true;
    const textoOriginal = botaoPdf.textContent;
    botaoPdf.textContent = "Gerando PDF...";
    const linhas = RESULTADO_ATUAL.map(a => {
      const l = {};
      COLUNAS_EXPORTACAO.forEach(c => { l[c[1]] = valorExportacao_(a, c[1]); });
      return l;
    });
    google.script.run
        .withSuccessHandler(arquivo => {
          botaoPdf.textContent = textoOriginal;
          atualizarExportacao_();
          const bytes = Uint8Array.from(atob(arquivo.base64), c => c.charCodeAt(0));
          baixarArquivo_(new Blob([bytes], { type: "application/pdf" }), "application/pdf", arquivo.nome);
          infoBusca.textContent = `PDF gerado com ${linhas.length} pessoa${linhas.length === 1 ? "" : "s"}.`;
        })
        .withFailureHandler(erro => {
          botaoPdf.textContent = textoOriginal;
          atualizarExportacao_();
          infoBusca.textContent = "Não consegui gerar o PDF: " + ((erro && erro.message) ? erro.message : String(erro));
        })
        .gerarPdfListaAlunos({ titulo: tituloExportacao_(), nomeArquivo: nomeBaseArquivo_(), linhas: linhas });
  });

  /*-----------------------------------------------------
    FICHA (modal; alunos, docentes, servidores e setores) — ESC fecha, Tab fica preso dentro,
    o foco volta ao card que abriu e o scroll da página fica
    travado enquanto aberto (mesmo contrato da Central de Ajuda).
  ------------------------------------------------------*/
  const fichaOverlay = document.getElementById("fichaOverlay");
  const fichaDialogo = document.getElementById("fichaDialogo");
  const fichaTitulo = document.getElementById("fichaTitulo");
  const fichaRotulo = document.getElementById("fichaRotulo");
  const fichaCampos = document.getElementById("fichaCampos");
  const fichaStatus = document.getElementById("fichaStatus");
  const fichaSalvar = document.getElementById("fichaSalvar");

  let FICHA = null;          // { aluno, linha, campos, podeEditar }
  let fichaGatilho = null;   // elemento que recebe o foco ao fechar
  let fichaOverflowAnterior = "";
  let fichaSalvando = false;

  function definirStatusFicha_(texto, tipo) {
    fichaStatus.textContent = texto || "";
    fichaStatus.className = "fichaStatus" + (tipo ? " " + tipo : "");
  }

  function abrirFicha_(aluno, gatilho) {
    fichaGatilho = gatilho || document.activeElement;
    fichaOverflowAnterior = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    fichaOverlay.hidden = false;
    FICHA = { aluno: aluno, linha: aluno.linha, campos: [], podeEditar: false, tratamento: "" };
    fichaRotulo.textContent = ROTULO_FICHA[aluno.tipo];
    fichaTitulo.textContent = nomeExibido_(aluno);
    fichaCampos.innerHTML = "";
    fichaSalvar.disabled = true;
    definirStatusFicha_("Carregando a ficha...");
    fichaDialogo.focus();
    google.script.run
        .withSuccessHandler(ficha => { if (FICHA && FICHA.aluno === aluno) preencherFicha_(ficha); })
        .withFailureHandler(erro => { if (FICHA && FICHA.aluno === aluno) definirStatusFicha_((erro && erro.message) ? erro.message : String(erro), "erro"); })
        .obterFicha(referenciaFicha_(aluno));
  }

  // v1.3: o que o servidor precisa pra achar e conferir a linha
  // (alunos: nº USP + nome; docentes e servidores: nome + e-mail).
  function referenciaFicha_(p) {
    return { cadastro: CADASTRO_DO_TIPO[p.tipo], linha: p.linha, numeroUsp: p.numeroUsp, nome: p.nome, email: p.email };
  }

  // Título da ficha: "Profª. Nome" para docentes com M / F preenchido.
  function tituloFicha_() {
    const nome = nomeExibido_(FICHA.aluno);
    return FICHA.tratamento ? FICHA.tratamento + " " + nome : nome;
  }

  function preencherFicha_(ficha) {
    FICHA.linha = ficha.linha;
    FICHA.campos = ficha.campos;
    FICHA.podeEditar = !!ficha.podeEditar;
    FICHA.tratamento = ficha.tratamento || "";
    fichaTitulo.textContent = tituloFicha_();
    fichaCampos.innerHTML = "";

    const aviso = document.createElement("p");
    aviso.className = "fichaAviso" + (FICHA.podeEditar ? "" : " alerta");
    aviso.textContent = FICHA.podeEditar
        ? "Altere os campos necessários e clique em Salvar alterações. Só os campos modificados são gravados na planilha."
        : `Sua conta pode consultar esta ficha, mas não alterar a planilha de ${CADASTRO_DO_TIPO[FICHA.aluno.tipo]}. Para editar, é preciso ser editor da planilha.`;
    fichaCampos.appendChild(aviso);

    ficha.campos.forEach((campo, i) => {
      const rotulo = document.createElement("label");
      rotulo.className = "fichaCampo";
      const texto = document.createElement("span");
      texto.textContent = campo.titulo;
      if (!campo.editavel) {
        const nota = document.createElement("small");
        nota.textContent = " (somente leitura)";
        texto.appendChild(nota);
      }
      const entrada = document.createElement("input");
      entrada.type = "text";
      entrada.value = campo.valor;
      entrada.dataset.indice = String(i);
      entrada.readOnly = !FICHA.podeEditar || !campo.editavel;
      entrada.autocomplete = "off";
      entrada.spellcheck = false;
      entrada.addEventListener("input", atualizarAlteracoesFicha_);
      rotulo.appendChild(texto);
      rotulo.appendChild(entrada);
      fichaCampos.appendChild(rotulo);
    });

    definirStatusFicha_("");
    atualizarAlteracoesFicha_();
    const primeiro = fichaCampos.querySelector("input:not([readonly])");
    if (primeiro) primeiro.focus();
  }

  function camposAlterados_() {
    const novos = {};
    const originais = {};
    fichaCampos.querySelectorAll("input[data-indice]").forEach(entrada => {
      const campo = FICHA.campos[Number(entrada.dataset.indice)];
      const mudou = entrada.value.trim() !== String(campo.valor).trim();
      entrada.classList.toggle("alterado", mudou);
      if (mudou) {
        novos[campo.titulo] = entrada.value.trim();
        originais[campo.titulo] = campo.valor;
      }
    });
    return { novos: novos, originais: originais, total: Object.keys(novos).length };
  }

  function atualizarAlteracoesFicha_() {
    if (!FICHA) return;
    const alt = camposAlterados_();
    fichaSalvar.disabled = fichaSalvando || !FICHA.podeEditar || alt.total === 0;
    if (alt.total && !fichaSalvando) {
      definirStatusFicha_(`${alt.total} campo${alt.total === 1 ? "" : "s"} alterado${alt.total === 1 ? "" : "s"}, ainda não salvo${alt.total === 1 ? "" : "s"}.`);
    } else if (!fichaSalvando && fichaStatus.classList.contains("ok") === false && fichaStatus.classList.contains("erro") === false) {
      definirStatusFicha_("");
    }
  }

  function salvarFicha_() {
    if (!FICHA || fichaSalvando) return;
    const alt = camposAlterados_();
    if (!alt.total) return;
    fichaSalvando = true;
    fichaSalvar.disabled = true;
    definirStatusFicha_("Salvando...");
    const aluno = FICHA.aluno;
    google.script.run
        .withSuccessHandler(ficha => {
          fichaSalvando = false;
          // Atualiza a lista em memória com os dados novos e refaz a
          // busca — o aluno pode até sair do filtro atual.
          const atualizado = prepararAluno_(ficha.resumo);
          const posicao = TODOS_ALUNOS.indexOf(aluno);
          if (posicao !== -1) TODOS_ALUNOS[posicao] = atualizado;
          FICHA.aluno = atualizado;
          montarFiltroAno_();
          executarBusca_();
          fichaRotulo.textContent = ROTULO_FICHA[atualizado.tipo];
          preencherFicha_(ficha);
          definirStatusFicha_("Alterações salvas na planilha.", "ok");
        })
        .withFailureHandler(erro => {
          fichaSalvando = false;
          atualizarAlteracoesFicha_();
          definirStatusFicha_((erro && erro.message) ? erro.message : String(erro), "erro");
        })
        .salvarFicha(Object.assign(referenciaFicha_(aluno), {
          linha: FICHA.linha,
          originais: alt.originais,
          novos: alt.novos
        }));
  }

  function fecharFicha_() {
    if (fichaOverlay.hidden) return;
    if (fichaSalvando) return;
    if (FICHA && camposAlterados_().total && !window.confirm("Há alterações não salvas. Fechar a ficha e descartar essas alterações?")) return;
    fichaOverlay.hidden = true;
    document.body.style.overflow = fichaOverflowAnterior;
    FICHA = null;
    fichaCampos.innerHTML = "";
    definirStatusFicha_("");
    // O card pode ter sido recriado pela busca depois de salvar:
    // devolve o foco a ele (ou ao card novo do mesmo aluno); se o aluno
    // saiu do filtro, ao campo de busca.
    const chaveGatilho = fichaGatilho && fichaGatilho.dataset ? fichaGatilho.dataset.chave : "";
    const cardNovo = chaveGatilho ? listaResultados.querySelector(`button.abrirFicha[data-chave="${chaveGatilho}"]`) : null;
    if (fichaGatilho && document.body.contains(fichaGatilho)) fichaGatilho.focus();
    else if (cardNovo) cardNovo.focus();
    else campoBusca.focus();
  }

  document.getElementById("fichaFechar").addEventListener("click", fecharFicha_);
  document.getElementById("fichaCancelar").addEventListener("click", fecharFicha_);
  fichaSalvar.addEventListener("click", salvarFicha_);
  document.getElementById("fichaFormulario").addEventListener("submit", ev => { ev.preventDefault(); salvarFicha_(); });
  fichaOverlay.addEventListener("click", ev => { if (ev.target === fichaOverlay) fecharFicha_(); });

  document.addEventListener("keydown", ev => {
    if (fichaOverlay.hidden) return;
    // Se a Central de Ajuda estiver aberta por cima, ela cuida do teclado.
    const ajuda = document.querySelector("[data-gradip-help-overlay]");
    if (ajuda && !ajuda.hidden) return;
    if (ev.key === "Escape") { ev.preventDefault(); fecharFicha_(); return; }
    if (ev.key !== "Tab") return;
    const focaveis = Array.prototype.filter.call(
        fichaDialogo.querySelectorAll("button:not([disabled]), input:not([disabled])"),
        el => el.offsetParent !== null);
    if (!focaveis.length) { ev.preventDefault(); fichaDialogo.focus(); return; }
    const primeiro = focaveis[0];
    const ultimo = focaveis[focaveis.length - 1];
    const ativo = document.activeElement;
    if (ativo === fichaDialogo || !fichaDialogo.contains(ativo)) {
      ev.preventDefault();
      (ev.shiftKey ? ultimo : primeiro).focus();
    } else if (ev.shiftKey && ativo === primeiro) {
      ev.preventDefault(); ultimo.focus();
    } else if (!ev.shiftKey && ativo === ultimo) {
      ev.preventDefault(); primeiro.focus();
    }
  });

  // v1.2: um cadastro que não abriu não impede os outros — aviso
  // fixo abaixo da busca, com o motivo devolvido pelo servidor.
  function mostrarIndisponiveis_(indisponiveis) {
    if (!indisponiveis || !indisponiveis.length) { avisoCadastros.hidden = true; avisoCadastros.textContent = ""; return; }
    avisoCadastros.textContent = "Atenção: não consegui ler o cadastro de " +
        indisponiveis.map(i => `${i.descricao} (${i.motivo})`).join("; ") +
        ". As demais pessoas aparecem normalmente.";
    avisoCadastros.hidden = false;
  }

  function iniciar() {
    google.script.run
        .withSuccessHandler(resposta => {
          const dados = resposta || {};
          TODOS_ALUNOS = (dados.pessoas || []).map(prepararAluno_);
          CARREGOU = true;
          campoBusca.disabled = false;
          filtroAno.disabled = false;
          montarFiltroAno_();
          mostrarIndisponiveis_(dados.indisponiveis);
          infoBusca.textContent = `${resumoCarga_()} — comece a digitar ou escolha um ano de ingresso.`;
          campoBusca.focus();
        })
        .withFailureHandler(erro => {
          infoBusca.textContent = "";
          const mensagem = (erro && erro.message) ? erro.message : String(erro);
          renderizarVazio_("Não consegui carregar a lista de pessoas: " + mensagem, true);
        })
        .listarComunidadeParaBusca();
  }

  iniciar();

</script>
