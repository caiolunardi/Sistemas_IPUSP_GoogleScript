<!--
  GRADIP UI — Marca USP (variante Dark em SVG inline, sem dependência
  de rede; variante Light continua o PNG institucional já usado)

  NOVO NA v1.2. Antes desta rodada só existia a variante azul (PNG),
  reaproveitada nos dois temas com um "wrapper" de superfície clara
  atrás dela em Dark Mode (para não perder contraste/legibilidade
  contra o fundo escuro do header). A partir desta rodada, Dark Mode
  passa a mostrar a marca USP branca institucional diretamente sobre o
  fundo escuro do header, com fundo transparente — sem nenhuma
  superfície/tarja atrás dela. Light Mode continua exatamente como
  antes (PNG azul, inalterado).

  ORIGEM DO SVG BRANCO: geometria e fill-rule copiados EXATAMENTE de
  assets/usp/logo-usp-branco.svg do repositório central
  (Sistemas_IPUSP_GoogleScript), sem redesenho — path e viewBox
  idênticos ao arquivo de origem (viewBox="0 0 738.57 299.48"; path
  único, fill="#ffffff", fill-rule="evenodd", exatamente como
  fornecido pelo arquivo). Conforme assets/usp/README.md desse
  repositório: o SVG vem do vetor institucional oficial (Superintendência
  de Comunicação Social da USP, "Logotipo USP — Versão Vetor"), convertido
  por Ghostscript+Poppler — não é o PNG azul recolorido nem traçado/
  reconstruído aqui. O PNG azul da variante Light permanece o único
  ativo Light, sem qualquer troca ou decisão visual nova (o mesmo
  README recomenda explicitamente que ele só deve ser substituído por
  decisão visual própria, fora do escopo desta correção).

  A troca entre as duas variantes usa o MESMO mecanismo já empregado
  pela marca IPUSP: as classes gradip-logo-light / gradip-logo-dark,
  definidas uma única vez em GradipTema.html (display:none conforme
  data-theme), que precisa estar incluído antes deste arquivo. Nenhum
  filter/invert/recolorização via CSS é aplicado a nenhuma das duas —
  são dois ativos distintos (PNG azul original; SVG branco
  institucional), exatamente como fornecidos. A troca acompanha
  data-theme automaticamente, inclusive quando a preferência Sistema
  muda com a página já aberta (mesma reatividade 100% CSS que já
  existe para o resto do tema — nenhum script novo precisou ser
  escrito para isso; testado nesta rodada).

  Acessibilidade: segue o padrão documentado em
  docs/THEME_IMPLEMENTATION.md (seção 6, "Logo por tema") do
  repositório central — cada variante carrega seu próprio nome
  acessível "Universidade de São Paulo" (alt na <img>; role="img" +
  aria-label no <svg>, o mesmo aria-label que o arquivo de origem já
  traz) e a exclusividade entre as duas é só o display:none/block já
  existente conforme o tema — sem aria-hidden estático em nenhuma das
  duas. A marca IPUSP (GradipMarcaIPUSP.html) segue hoje o MESMO
  padrão: tinha originalmente um aria-hidden="true" fixo na variante
  Dark além do aria-label — como CSS não consegue alternar atributos
  aria-* conforme o tema, esse aria-hidden fixo fazia a marca IPUSP
  nunca ser anunciada a tecnologia assistiva enquanto o Dark Mode
  estava ativo (a variante Light, sem aria-hidden, fica com
  display:none nesse momento). Esse aria-hidden fixo foi removido numa
  correção pontual posterior (ver comentário em GradipMarcaIPUSP.html)
  — as duas marcas do cabeçalho agora usam exatamente o mesmo
  mecanismo de exclusividade só por display:none, sem nenhum
  aria-hidden estático em nenhuma variante de nenhuma das duas.

  Este arquivo não contém <style> nem <script> próprios.
-->
