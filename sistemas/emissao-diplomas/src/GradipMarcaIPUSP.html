<!--
  GRADIP UI — Marca IPUSP (SVG inline, sem dependência de rede)

  Geometria e preenchimentos copiados EXATAMENTE de
  assets/ipusp/logo-ipusp-azul.svg e assets/ipusp/logo-ipusp-branco.svg
  do pacote de diretrizes GRADIP, sem redesenho. Os dois <svg> abaixo
  são inline (não <img src="...">) porque o Google Apps Script não
  serve arquivos SVG do repositório por caminho relativo em runtime —
  incluir o markup diretamente evita qualquer dependência do GitHub (ou
  de qualquer outra origem externa) para exibir a marca.

  A troca entre as duas variantes é automática: as classes
  gradip-logo-light / gradip-logo-dark já são definidas (display:none
  conforme o tema) pelo <style> de GradipTema.html, que precisa estar
  incluído antes deste arquivo. Nenhum filter/invert/recolorização via
  CSS é aplicado — as duas variantes são desenhos distintos (fill
  #00509d e fill #ffffff), exatamente como fornecidos.

  Este arquivo não contém <style> nem <script> próprios, então pode ser
  incluído mais de uma vez na mesma página (ex.: cabeçalho + caixa de
  loading) sem duplicar regras CSS nem listeners.

  CORREÇÃO v1.2 (miolo dos "p" de "ipusp" aparecia preenchido): os SVGs
  centrais de origem (assets/ipusp/logo-ipusp-azul.svg e
  logo-ipusp-branco.svg, conferidos byte a byte nesta rodada contra o
  repositório central) declaram, no elemento <svg> raiz:
  style="shape-rendering:geometricPrecision; text-rendering:
  geometricPrecision; image-rendering:optimizeQuality;
  fill-rule:evenodd; clip-rule:evenodd" — fill-rule:evenodd é a regra
  necessária para que o contorno interno ("miolo") dos dois "p" seja
  tratado como um buraco vazado, revelando o fundo por trás, em vez de
  ser preenchido como se fosse mais uma parte sólida da letra. Essa
  regra (junto com o resto do style) se perdeu ao colar a geometria
  aqui: nenhum dos <path> abaixo jamais declarou fill-rule, então o
  navegador usava o default da especificação SVG (nonzero), que não
  necessariamente abre os buracos dependendo do sentido de desenho de
  cada subpath — daí o miolo aparecer preenchido. O style da origem foi
  restaurado nos dois elementos <svg> abaixo, palavra por palavra
  (fill-rule é herdado por todo path filho via os <g>, sem precisar
  repetir em cada um; clip-rule não tem efeito visível aqui — não há
  nenhum clip-path nesta marca — mas foi incluído por fidelidade ao
  arquivo de origem). CONFERIDO nesta rodada, path a path: os 10
  <path> de cada variante abaixo são byte-idênticos aos 10 <path> de
  assets/ipusp/logo-ipusp-azul.svg e logo-ipusp-branco.svg
  respectivamente — nenhuma geometria, proporção ou fill foi alterada;
  a única mudança desta correção é este style no <svg> raiz. Confirmado
  visualmente: os dois "p" passam a revelar o fundo correspondente,
  tanto no cabeçalho quanto na marca exibida durante o carregamento
  (mesmo arquivo, incluído nos dois lugares — corrigir aqui uma vez
  corrige os dois).

  CORREÇÃO PONTUAL v1.2 (nome acessível ausente em Dark Mode): o <svg>
  gradip-logo-dark abaixo tinha aria-hidden="true" fixo, além do
  role="img"/aria-label já presente. aria-hidden="true" remove o
  elemento (e seu nome) da árvore de acessibilidade independentemente
  do aria-label — então, sempre que essa variante estava visível (Dark
  Mode), a marca IPUSP não tinha nome acessível nenhum (a variante
  Light, sem aria-hidden, está com display:none nesse momento, também
  fora da árvore). O aria-hidden="true" foi removido: as duas
  variantes agora seguem o mesmo padrão (role="img" + aria-label
  próprios, sem aria-hidden em nenhuma), com a exclusividade entre
  elas garantida só pelo display:none já existente em GradipTema.html
  — que remove de fato a variante oculta da árvore de acessibilidade,
  não só da tela (mesmo mecanismo usado pela marca USP em
  GradipMarcaUSP.html). Nenhum path, fill-rule, cor ou viewBox foi
  tocado nesta correção pontual — só este atributo em um <svg>.
-->
