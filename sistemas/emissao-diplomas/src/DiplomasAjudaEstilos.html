<!--=====================================================
  CENTRAL DE AJUDA — Estilos (RODADA D).

  Bloco de CSS AUTOCONTIDO (própria tag <style>), incluído via
  include_('DiplomasAjudaEstilos') junto dos outros estilos do
  cabeçalho de DiplomasApp.html — mesmo padrão já usado por
  HistoricoAnaliseEstilos.html.

  Reaproveita a MESMA paleta de cores já usada no resto do sistema
  (azul #005AA9, verde #2e7d32, vermelho #b71c1c, laranja #e5893a) e
  o mesmo "vocabulário visual" (cards com borda #e3e8ec, badges
  arredondados, avisos em caixa amarela) — nenhuma cor nova é
  introduzida. Todas as classes/IDs usam o prefixo "ajuda" para não
  colidir com nada existente em DiplomasApp.html, HistoricoAnaliseUI.html
  ou HistoricoParser.html.

  Este arquivo é SOMENTE CSS — nenhum <script>, nenhum markup.
  Central de Ajuda v1.0.0.
=====================================================-->
<style>

/*=================================
    BOTÃO "AJUDA" NO HEADER (usado em
    DiplomasApp.html, ao lado da logo USP)
==================================*/

.ajudaAcoesHeader{
    display:flex;
    align-items:center;
    gap:14px;
}

.ajudaBotaoHeader{
    background:var(--gradip-info-bg);
    border:1px solid var(--gradip-info-border);
    color:var(--gradip-link);
    font-size:13px;
    font-weight:bold;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
    white-space:nowrap;
    font-family:inherit;
}

.ajudaBotaoHeader:hover{
    background:var(--gradip-primary);
    color:var(--gradip-on-primary);
}

/*=================================
    FUNDO E MOLDURA DO MODAL
==================================*/

.ajudaModalFundo{
    display:none;
    position:fixed;
    z-index:11000;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:var(--gradip-overlay);
    align-items:center;
    justify-content:center;
    box-sizing:border-box;
    padding:20px;
}

.ajudaModalFundo.ajudaAberta{
    display:flex;
}

.ajudaModalCaixa{
    background:var(--gradip-surface);
    width:1050px;
    max-width:94vw;
    height:90vh;
    max-height:92vh;
    border-radius:10px;
    box-shadow:0 10px 40px rgba(0,0,0,0.35);
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/*=================================
    TOPO (título + busca + fechar)
==================================*/

.ajudaTopo{
    background:var(--gradip-primary);
    color:var(--gradip-on-primary);
    padding:14px 20px;
    border-radius:10px 10px 0 0;
    display:flex;
    align-items:center;
    gap:16px;
    flex-shrink:0;
    flex-wrap:wrap;
}

.ajudaTituloTopo{
    margin:0;
    font-size:17px;
    font-weight:bold;
    white-space:nowrap;
}

.ajudaTituloBloco{
    display:flex;
    flex-direction:column;
    gap:2px;
    min-width:0;
}

.ajudaSubtituloTopo{
    font-size:11px;
    font-weight:normal;
    opacity:.8;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.ajudaBuscaContainer{
    flex:1;
    min-width:160px;
    display:flex;
    align-items:center;
    background:rgba(255,255,255,.15);
    border-radius:6px;
    padding:0 10px;
}

.ajudaBuscaContainer:focus-within{
    background:rgba(255,255,255,.25);
    outline:3px solid var(--gradip-on-primary);
    outline-offset:1px;
}

.ajudaBuscaIcone{
    font-size:13px;
    opacity:.85;
    margin-right:6px;
}

#ajudaBuscaCampo{
    flex:1;
    border:none;
    background:transparent;
    color:var(--gradip-on-primary);
    font-size:13.5px;
    padding:10px 0;
    outline:none;
}

#ajudaBuscaCampo::placeholder{
    color:var(--gradip-on-primary);
    opacity:.8;
}

.ajudaBuscaLimpar{
    background:none;
    border:none;
    color:var(--gradip-on-primary);
    opacity:.8;
    cursor:pointer;
    font-size:15px;
    padding:2px 6px;
    line-height:1;
}

.ajudaBuscaLimpar:hover{
    opacity:1;
}

.ajudaFecharBotao{
    background:rgba(255,255,255,.15);
    border:none;
    color:var(--gradip-on-primary);
    font-size:22px;
    line-height:1;
    width:34px;
    height:34px;
    border-radius:6px;
    cursor:pointer;
    flex-shrink:0;
}

.ajudaFecharBotao:hover{
    background:rgba(255,255,255,.3);
}

/*=================================
    RODAPÉ (versão da Central)
==================================*/

.ajudaRodape{
    flex-shrink:0;
    padding:6px 20px;
    font-size:11px;
    color:var(--gradip-text-muted);
    text-align:right;
    border-top:1px solid var(--gradip-border);
    background:var(--gradip-surface-2);
    border-radius:0 0 10px 10px;
}

/*=================================
    CORPO (nav lateral + conteúdo)
==================================*/

.ajudaCorpo{
    flex:1;
    display:flex;
    min-height:0;
    overflow:hidden;
}

.ajudaNav{
    width:250px;
    flex-shrink:0;
    background:var(--gradip-surface-2);
    border-right:1px solid var(--gradip-border);
    overflow-y:auto;
    padding:10px 0 20px 0;
}

.ajudaNavGrupoTitulo{
    font-size:10.5px;
    font-weight:bold;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--gradip-text-muted);
    padding:14px 18px 6px 18px;
}

.ajudaNavItem{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    border-left:3px solid transparent;
    padding:9px 18px;
    font-size:13.5px;
    color:var(--gradip-text);
    cursor:pointer;
    font-family:inherit;
}

.ajudaNavItem:hover{
    background:var(--gradip-info-bg);
}

.ajudaNavItem.ajudaNavAtiva{
    background:var(--gradip-info-bg);
    border-left-color:var(--gradip-link);
    color:var(--gradip-link);
    font-weight:bold;
}

.ajudaNavSubitem{
    padding-left:32px;
    font-size:12.5px;
}

.ajudaConteudo{
    flex:1;
    overflow-y:auto;
    padding:26px 34px 40px 34px;
}

.ajudaSecao{
    display:none;
}

.ajudaSecao.ajudaSecaoAtiva{
    display:block;
}

.ajudaSecao h2{
    margin:0 0 6px 0;
    font-size:20px;
    color:var(--gradip-text);
}

.ajudaSubtituloSecao{
    font-size:13px;
    color:var(--gradip-text-muted);
    margin:0 0 22px 0;
}

.ajudaSecao h3{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.03em;
    color:var(--gradip-link);
    margin:26px 0 12px 0;
    border-bottom:2px solid var(--gradip-border);
    padding-bottom:6px;
}

.ajudaSecao h3:first-of-type{
    margin-top:6px;
}

.ajudaSecao h4{
    font-size:13.5px;
    color:var(--gradip-text);
    margin:16px 0 8px 0;
}

.ajudaSecao p{
    font-size:13.5px;
    line-height:1.65;
    color:var(--gradip-text);
    margin:0 0 12px 0;
}

.ajudaSecao ul,
.ajudaSecao ol{
    font-size:13.5px;
    line-height:1.65;
    color:var(--gradip-text);
    margin:0 0 14px 0;
    padding-left:20px;
}

.ajudaSecao li{
    margin-bottom:4px;
}

.ajudaSecao strong{
    color:var(--gradip-text);
}

.ajudaLinkInterno{
    background:none;
    border:none;
    padding:0;
    color:var(--gradip-link);
    text-decoration:underline;
    font-size:inherit;
    font-family:inherit;
    cursor:pointer;
}

/*=================================
    "COMECE AQUI" — atalhos
==================================*/

.ajudaAtalhosGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:10px;
    margin:14px 0 22px 0;
}

.ajudaAtalhoCard{
    text-align:left;
    border:1px solid var(--gradip-border);
    border-radius:8px;
    padding:12px 14px;
    background:var(--gradip-surface);
    cursor:pointer;
    font-size:13px;
    color:var(--gradip-text);
    font-family:inherit;
}

.ajudaAtalhoCard:hover{
    border-color:var(--gradip-link);
    background:var(--gradip-info-bg);
}

.ajudaFluxoEtapas{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
    margin:16px 0 20px 0;
}

.ajudaFluxoEtapa{
    background:var(--gradip-info-bg);
    color:var(--gradip-link);
    padding:8px 14px;
    border-radius:20px;
    font-size:12.5px;
    font-weight:bold;
    white-space:nowrap;
}

.ajudaFluxoSeta{
    color:var(--gradip-text-muted);
    font-size:16px;
}

/*=================================
    GUIA RÁPIDO — 4 cards
==================================*/

.ajudaGuiaCards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:14px;
    margin:16px 0 22px 0;
}

.ajudaGuiaCard{
    border:1px solid var(--gradip-border);
    border-radius:8px;
    padding:16px;
    background:var(--gradip-surface-2);
}

.ajudaGuiaCardNumero{
    background:var(--gradip-primary);
    color:var(--gradip-on-primary);
    width:26px;
    height:26px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:13px;
    margin-bottom:10px;
}

.ajudaGuiaCard h4{
    margin:0 0 8px 0;
    font-size:14px;
    color:var(--gradip-text);
}

.ajudaGuiaCard ul{
    margin:0;
    padding-left:18px;
    font-size:12.5px;
    color:var(--gradip-text);
    line-height:1.6;
}

/*=================================
    TABELA COMPARATIVA (pequena)
==================================*/

.ajudaTabela{
    width:100%;
    border-collapse:collapse;
    margin:10px 0 20px 0;
    font-size:13px;
}

.ajudaTabela th{
    background:var(--gradip-primary);
    color:var(--gradip-on-primary);
    text-align:left;
    padding:9px 12px;
}

.ajudaTabela th:first-child{ border-radius:6px 0 0 0; }
.ajudaTabela th:last-child{ border-radius:0 6px 0 0; }

.ajudaTabela td{
    padding:8px 12px;
    border-bottom:1px solid var(--gradip-border);
    color:var(--gradip-text);
    vertical-align:top;
}

.ajudaTabela tr:nth-child(even) td{
    background:var(--gradip-surface-2);
}

/*=================================
    AVISOS
==================================*/

.ajudaAviso{
    background:var(--gradip-warning-bg);
    border:1px solid var(--gradip-warning-border);
    color:var(--gradip-warning);
    border-radius:6px;
    padding:12px 14px;
    font-size:13px;
    line-height:1.55;
    margin:14px 0;
}

.ajudaAvisoPerigo{
    background:var(--gradip-danger-bg);
    border-color:var(--gradip-danger);
    color:var(--gradip-danger);
}

.ajudaAvisoOk{
    background:var(--gradip-success-bg);
    border-color:var(--gradip-success);
    color:var(--gradip-success);
}

/*=================================
    BADGES (APTO / NÃO APTO / CONFERIR)
==================================*/

.ajudaBadge{
    display:inline-block;
    font-size:11px;
    font-weight:bold;
    padding:4px 11px;
    border-radius:14px;
    white-space:nowrap;
    background:var(--gradip-surface-2);
    color:var(--gradip-text-muted);
}

.ajudaBadge.apto{ background:var(--gradip-success-bg); color:var(--gradip-success); }
.ajudaBadge.naoApto{ background:var(--gradip-danger-bg); color:var(--gradip-danger); }
.ajudaBadge.conferir{ background:var(--gradip-warning-bg); color:var(--gradip-warning); }

/*=================================
    PROBLEMAS COMUNS
==================================*/

.ajudaProblemaCard{
    border:1px solid var(--gradip-border);
    border-radius:8px;
    padding:14px 16px;
    margin-bottom:12px;
    background:var(--gradip-surface);
}

.ajudaProblemaTitulo{
    font-weight:bold;
    font-size:13.5px;
    color:var(--gradip-text);
    margin:0 0 8px 0;
}

.ajudaProblemaLabel{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.03em;
    color:var(--gradip-text-muted);
    margin-top:10px;
}

.ajudaProblemaTexto{
    font-size:13px;
    color:var(--gradip-text);
    margin:3px 0 0 0;
    line-height:1.55;
}

/*=================================
    FAQ (accordion)
==================================*/

.ajudaFaqItem{
    border-bottom:1px solid var(--gradip-border);
}

.ajudaFaqPergunta{
    width:100%;
    text-align:left;
    background:none;
    border:none;
    padding:14px 4px;
    font-size:13.5px;
    font-weight:bold;
    color:var(--gradip-text);
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    font-family:inherit;
}

.ajudaFaqPergunta:hover{
    color:var(--gradip-link);
}

.ajudaFaqIcone{
    flex-shrink:0;
    color:var(--gradip-link);
    font-size:15px;
    transition:transform .15s ease;
}

.ajudaFaqPergunta[aria-expanded="true"] .ajudaFaqIcone{
    transform:rotate(45deg);
}

.ajudaFaqResposta{
    display:none;
    padding:0 4px 16px 4px;
    font-size:13px;
    color:var(--gradip-text);
    line-height:1.6;
}

.ajudaFaqResposta.ajudaAberta{
    display:block;
}

/*=================================
    GLOSSÁRIO
==================================*/

.ajudaGlossarioLista dt{
    font-weight:bold;
    color:var(--gradip-link);
    margin-top:14px;
    font-size:13.5px;
}

.ajudaGlossarioLista dd{
    margin:4px 0 0 0;
    font-size:13px;
    color:var(--gradip-text);
    line-height:1.55;
}

/*=================================
    DETALHES TÉCNICOS (recolhido)
==================================*/

.ajudaDetalhesTecnicos{
    border:1px dashed var(--gradip-border-strong);
    border-radius:8px;
    padding:6px 16px;
    margin-top:24px;
    background:var(--gradip-surface-2);
}

.ajudaDetalhesTecnicosTitulo{
    width:100%;
    text-align:left;
    background:none;
    border:none;
    cursor:pointer;
    font-size:12.5px;
    font-weight:bold;
    color:var(--gradip-text-muted);
    padding:12px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:inherit;
}

.ajudaDetalhesTecnicosCorpo{
    display:none;
    margin:0 0 14px 0;
    font-size:12.5px;
    color:var(--gradip-text);
    line-height:1.65;
}

.ajudaDetalhesTecnicosCorpo.ajudaAberta{
    display:block;
}

.ajudaDetalhesTecnicosCorpo h4{
    font-size:12.5px;
    color:var(--gradip-text);
    margin:14px 0 6px 0;
}

.ajudaDetalhesTecnicosCorpo ul{
    margin:0 0 10px 0;
    padding-left:18px;
}

/*=================================
    RESULTADOS DE BUSCA
==================================*/

.ajudaResultadosTitulo{
    font-size:12px;
    color:var(--gradip-text-muted);
    margin:0 0 14px 0;
}

.ajudaResultadoItem{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    border-bottom:1px solid var(--gradip-border);
    padding:12px 4px;
    cursor:pointer;
    font-family:inherit;
}

.ajudaResultadoItem:hover{
    background:var(--gradip-info-bg);
}

.ajudaResultadoTitulo{
    font-weight:bold;
    color:var(--gradip-link);
    font-size:13.5px;
}

.ajudaResultadoCaminho{
    font-size:11px;
    color:var(--gradip-text-muted);
    margin-top:2px;
}

.ajudaResultadoTrecho{
    font-size:12.5px;
    color:var(--gradip-text-muted);
    margin-top:5px;
    line-height:1.5;
}

.ajudaSemResultado{
    font-size:13px;
    color:var(--gradip-text-muted);
    padding:20px 4px;
}

/*=================================
    GATILHOS CONTEXTUAIS ("?")
==================================*/

.ajudaGatilho{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:18px;
    height:18px;
    border-radius:50%;
    background:var(--gradip-info-bg);
    color:var(--gradip-link);
    font-size:11px;
    font-weight:bold;
    cursor:pointer;
    border:1px solid var(--gradip-info-border);
    vertical-align:middle;
    margin-left:6px;
    user-select:none;
    line-height:1;
    padding:0;
    font-family:inherit;
}

.ajudaGatilho:hover{
    background:var(--gradip-primary);
    color:var(--gradip-on-primary);
}

.ajudaGatilhoAba{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:22px;
    height:22px;
    border-radius:50%;
    background:var(--gradip-info-bg);
    color:var(--gradip-link);
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
    border:1px solid var(--gradip-info-border);
    vertical-align:middle;
    margin-left:8px;
    user-select:none;
    padding:0;
    font-family:inherit;
}

.ajudaGatilhoAba:hover{
    background:var(--gradip-primary);
    color:var(--gradip-on-primary);
}

.ajudaGatilho:focus-visible,
.ajudaGatilhoAba:focus-visible{
    outline:2px solid var(--gradip-focus);
    outline-offset:2px;
}

/* Wrapper para colocar um rótulo de campo e um .ajudaGatilho lado a
   lado sem aninhar o botão dentro do <label> (RODADA D.1.1). O
   espaçamento entre o texto do rótulo e o "?" continua vindo do
   margin-left já existente em .ajudaGatilho — nenhum gap é somado
   aqui para não dobrar o espaçamento. O margin-bottom que o rótulo já
   tinha (herdado de ".campoEditavel label") continua sendo aplicado
   normalmente dentro deste wrapper flex. */
.ajudaRotuloComGatilho{
    display:flex;
    align-items:center;
}

/*=================================
    BLOQUEIO DE SCROLL DO BODY
==================================*/

body.ajudaBodyTravado{
    overflow:hidden;
}

/*=================================
    ACESSIBILIDADE — FOCO VISÍVEL
==================================*/

.ajudaModalCaixa a:focus-visible,
.ajudaModalCaixa button:focus-visible,
.ajudaModalCaixa input:focus-visible{
    outline:2px solid var(--gradip-focus);
    outline-offset:2px;
}

/*=================================
    RESPONSIVO — até 768px
==================================*/

@media (max-width:768px){

    .ajudaModalFundo{
        padding:0;
    }

    .ajudaModalCaixa{
        width:96vw;
        max-width:96vw;
        height:94vh;
        max-height:94vh;
        border-radius:8px;
    }

    .ajudaTopo{
        padding:12px 14px;
        gap:10px;
    }

    .ajudaTituloTopo{
        font-size:15px;
    }

    .ajudaCorpo{
        flex-direction:column;
    }

    .ajudaNav{
        width:100%;
        max-height:120px;
        border-right:none;
        border-bottom:1px solid var(--gradip-border);
        display:flex;
        flex-wrap:nowrap;
        overflow-x:auto;
        overflow-y:hidden;
        padding:8px;
    }

    .ajudaNavGrupoTitulo{
        display:none;
    }

    .ajudaNavItem{
        flex-shrink:0;
        white-space:nowrap;
        border-left:none;
        border-bottom:3px solid transparent;
        padding:8px 12px;
    }

    .ajudaNavItem.ajudaNavAtiva{
        border-left-color:transparent;
        border-bottom-color:var(--gradip-link);
    }

    .ajudaNavSubitem{
        padding-left:12px;
    }

    .ajudaConteudo{
        padding:18px 18px 32px 18px;
    }

    .ajudaAtalhosGrid,
    .ajudaGuiaCards{
        grid-template-columns:1fr;
    }
}

/*=================================
    RESPONSIVO — até 390px
==================================*/

@media (max-width:390px){

    .ajudaTopo{
        flex-wrap:wrap;
    }

    .ajudaBuscaContainer{
        order:3;
        width:100%;
    }

    .ajudaTituloTopo{
        font-size:14px;
    }

    .ajudaSecao h2{
        font-size:17px;
    }

    .ajudaConteudo{
        padding:14px 14px 28px 14px;
    }

    .ajudaTabela{
        font-size:11.5px;
    }

    .ajudaSubtituloTopoExtra{
        display:none;
    }
}

</style>
