  function confirmarRecomeco() {
    var palavra = $('recomecoPalavra').value;
    P.Modal.fechar($('modalRecomeco'));
    I.executarNoServidor('cadastrarNovaGrade', [palavra], 'Apagando e preparando a planilha…').then(function () {
      Object.keys(I.LISTAS).forEach(function (k) { I.LISTAS[k].marcados = {}; I.LISTAS[k].semOferecimento = []; });
      previa = { aba: 'PSA', marcados: {} };
      P.estado.etapa = 1;
      return I.carregar('Carregando a planilha nova…');
    }).then(function () {
      P.mostrarAviso('Planilha recomeçada. Importe o CSV da "Grade Curricular" do Júpiter para cadastrar a nova grade.');
    }, function () { /* erro já avisado */ });
  }


  /**
   * Salva (ou cadastra) e redesenha a ficha com os dados gravados; a
   * Promise diz se deu certo (true/false). opcoes.adicionarAGrade (1.4.3):
   * salva e adiciona à grade horária na MESMA chamada (salvarDisciplina).
   */
  function salvar(opcoes) {
    if (!ficha) return Promise.resolve(false);
    if (operacaoPendente) { avisoEspera(); return Promise.resolve(false); }   // (1.8.4) uma operação de ficha por vez
    // (1.8.4) Contexto da operação, guardado ANTES da chamada: a resposta
    // não consulta a ficha que estiver aberta quando chegar.
    var novo = ficha.novo, id = ficha.id;
    var adicionar = !!(opcoes && opcoes.adicionarAGrade) && !novo;
    var dados = coletar();
    if (!dados.campos.nome) { I.$('fichaCampo-nome').focus(); P.mostrarAviso('Preencha o nome da disciplina.'); return Promise.resolve(false); }
    var item = novo ? null : P.estado.idx.itens[id];
    var rotulo = novo ? (dados.campos.codigo || 'a nova disciplina') : (item ? item.codigo : String(id));
    // (1.8.9) Descarte dos vínculos de oferta a revisar: só com a caixa marcada E confirmação.
    if (dados.descartarPendentes) {
      var nPend = item && item._ofertaPendencias ? item._ofertaPendencias.length : 0;
      if (!confirm('Descartar ' + (nPend === 1 ? 'o vínculo' : 'os ' + nPend + ' vínculos') + ' de oferta a revisar de ' + rotulo + '?\n\nA oferta passa a ser só a da tabela "Onde aparece". Os vínculos descartados não poderão ser recuperados pelo painel.')) return Promise.resolve(false);
    }
    var op = iniciarOperacao(novo ? 'cadastrar' : adicionar ? 'salvarEAdicionar' : 'salvar', rotulo);
    if (!op) return Promise.resolve(false);
    var b = $('fichaSalvar');
    travarRodapeFicha(true);
    travarCampos(true);
    if (adicionar) $('fichaGrade').textContent = 'Salvando e adicionando…';
    else b.textContent = 'Salvando…';
    var pedido = { origem: ficha.origem, chave: item ? item._chave : '', campos: dados.campos, oferta: dados.oferta, observacoes: dados.observacoes };
    if (dados.descartarPendentes) pedido.ofertaPendentes = 'descartar';   // (1.8.9) confirmado acima
    if (dados.restaurarOferta) pedido.restaurarOferta = true;   // (1.8.10) restauração explícita da oferta
    if (adicionar) pedido.adicionarAGrade = true;
    var chamada = novo
      ? I.executarNoServidor('cadastrarDisciplinaOutros', [{ campos: dados.campos, observacoes: dados.observacoes }], null)
      : I.executarNoServidor('salvarDisciplina', [pedido], null);
    var enviado = serializar();
    return chamada.then(function (r) {
      terminarOperacao(op);
      // (1.8.5) Só aplica dados LIDOS da planilha; sem leitura, pede para recarregar.
      if (r.preparacao) I.aplicarPreparacao(r.preparacao, r.observacao);
      var g = r.grade;
      var msg = novo ? 'Disciplina cadastrada.'
        : !adicionar || !g ? 'Alterações salvas.'
        : g.adicionada || g.jaEstava ? 'Alterações salvas e disciplina adicionada à Grade Horária.'
        : g.semOferecimento ? 'Alterações salvas. Não foi adicionada à grade: falta o semestre de oferecimento.'
        : 'Alterações salvas. Disciplina excluída não entra na grade.';
      if (!r.preparacao) msg += ' Recarregue a página para ver os dados atualizados.';
      mostrarPendencia(null);
      var idGravado = novo ? 'O:' + r.chave : id;
      if (instanciaAberta(op)) {
        // A mesma ficha continua aberta e travada desde o envio: mostra o gravado.
        var d = r.preparacao ? P.estado.idx.itens[idGravado] : null;
        if (d) { P.estado.fichaAtual = idGravado; renderizarFichaEditavel(d); }
        else {
          travarCampos(false); b.textContent = novo ? 'Cadastrar' : 'Salvar';
          // (1.8.10) Restauração gravada: a intenção não vale para o próximo salvamento.
          if (ficha.restaurarOferta) { ficha.restaurarOferta = false; var e = JSON.parse(enviado); delete e.restaurarOferta; ficha.inicial = JSON.stringify(e); }
          else ficha.inicial = enviado;
          travarRodapeFicha(false);
        }
        P.mostrarAviso(msg);
        var t = $('modalDisciplinaTitulo'); t.setAttribute('tabindex', '-1'); t.focus();
      } else {
        // Ficha fechada, outra ficha ou outra instância: não toca no formulário,
        // no foco nem na navegação; só avisa qual disciplina foi gravada.
        var gravada = P.estado.idx.itens[idGravado];
        P.mostrarAviso(novo ? 'Disciplina ' + (gravada ? gravada.codigo : rotulo) + ' cadastrada.' : rotulo + ' — ' + msg);
      }
      return true;
    }, function (erro) {
      terminarOperacao(op);
      // (1.8.5) Recusa com o que foi lido da planilha: atualiza os dados
      // confirmados (lista), sem mexer no formulário; salvamento pendente
      // vira o aviso fixo com "Concluir salvamento pendente".
      var lidos = erro && erro.dados;
      if (lidos && lidos.preparacao) I.aplicarPreparacao(lidos.preparacao, lidos.observacao);
      if (erro && (erro.codigo === 'SALVAMENTO_PENDENTE' || erro.codigo === 'SALVAMENTO_INCERTO') && lidos && lidos.salvamento) {
        mostrarPendencia(lidos.salvamento);
        ultimaPendencia = { instancia: op.instancia, id: id, enviado: enviado };
      }
      if (instanciaAberta(op)) {
        // O rascunho continua no formulário (nada foi redesenhado nem marcado como salvo).
        travarCampos(false);
        b.textContent = novo ? 'Cadastrar' : 'Salvar';
        travarRodapeFicha(false);
        if (erro && erro.mensagem) P.mostrarAviso(erro.mensagem);
      } else {
        P.mostrarAviso('Não foi possível ' + (novo ? 'cadastrar ' : 'salvar ') + rotulo + ': ' + ((erro && erro.mensagem) || 'erro desconhecido'));
      }
      return false;
    });
  }

  /*----------------------------------------------------------------
    (1.8.5) Salvamento de disciplina pendente
  ----------------------------------------------------------------*/
  // Última recusa SALVAMENTO_PENDENTE vinda de uma ficha: se essa mesma
  // instância ainda estiver aberta e sem novas edições quando o salvamento
  // for concluído, a ficha é redesenhada com o gravado.
  var ultimaPendencia = null;
  var pendenciaAtual = null;   // salvamento individual (1.8.5)
  var loteAtual = null;        // (1.8.7) ação em lote
  /**
   * Aviso fixo acima das etapas, com até dois blocos: salvamento de
   * disciplina e (1.8.7) ação em lote (info.tipo === 'lote'). info =
   * resumo do servidor ({ estado, id, codigo|nome, mensagem, podeDescartar })
   * ou null (some tudo); estado 'nenhum' some só o bloco do tipo.
   * daCarga = veio de obterDadosPainel (estado 'concluido' = concluído agora).
   */
  function mostrarPendencia(info, daCarga) {
    var el = $('salvamentoPendente');
    if (!el) return;
    if (info === null || info === undefined) { pendenciaAtual = null; loteAtual = null; }
    else {
      var lote = info.tipo === 'lote';
      if (info.estado === 'concluido' && daCarga) P.mostrarAviso(lote ? 'A ação "' + (info.nome || 'em lote') + '" que tinha ficado pendente foi concluída.' : 'O salvamento de ' + (info.codigo || 'uma disciplina') + ' que tinha ficado pendente foi concluído.');
      var valido = info.estado === 'concluido' || info.estado === 'nenhum' ? null : info;
      if (lote) loteAtual = valido; else pendenciaAtual = valido;
    }
    var html = blocoSalvamento(pendenciaAtual) + blocoLote(loteAtual);
    if (!html) { el.hidden = true; el.innerHTML = ''; return; }
    el.innerHTML = html + '<div class="ajudaLinha">' + gatilho('ajuda-pendencias', 'Entenda este aviso') + '</div>';   // (1.9.0) só explica: não conclui nem descarta
    el.hidden = false;
  }
  function blocoSalvamento(info) {
    if (!info) return '';
    var msg = info.mensagem || ('O salvamento de ' + (info.codigo || 'uma disciplina') + ' não terminou.');
    // (1.8.6) 'incerto' (registro já encerrado, gravação não confirmada) e
    // 'recarregar' (concluído, mas sem leitura): só o aviso, sem botões.
    var semBotao = info.estado === 'adiado' || info.estado === 'incerto' || info.estado === 'recarregar';
    var titulo = info.estado === 'incerto' ? 'Salvamento não confirmado' : info.estado === 'recarregar' ? 'Salvamento concluído' : 'Salvamento pendente';
    return '<div class="alerta__titulo">' + titulo + (info.codigo ? ' — ' + esc(info.codigo) : '') + '</div><p>' + esc(msg) + '</p>' +
      (semBotao ? '' : '<p><button type="button" class="botao botao--secundario" data-concluir-salvamento>Concluir salvamento pendente</button>' +
        (info.podeDescartar ? ' <button type="button" class="botao botao--perigoContorno" data-descartar-salvamento>Descartar salvamento pendente</button>' : '') + '</p>');
  }
  /** (1.8.7) Bloco da ação em lote. "Concluir" só quando ela é retomável (não em base mudada, incerta, adiada). */
  function blocoLote(info) {
    if (!info) return '';
    var nome = info.nome || 'em lote';
    var msg = info.mensagem || ('A ação "' + nome + '" não terminou.');
    var titulo = info.estado === 'incerto' ? 'Ação em lote não confirmada' : info.estado === 'recarregar' ? 'Gravação concluída' : 'Ação em lote pendente';
    var concluir = info.estado === 'pendente' || info.estado === 'desconhecido';
    var descartar = !!info.podeDescartar;
    return '<div data-pendencia-lote><div class="alerta__titulo">' + titulo + (info.nome && info.estado !== 'recarregar' ? ' — ' + esc(nome) + (info.total ? ' (' + info.total + (info.total === 1 ? ' disciplina' : ' disciplinas') + ')' : '') : '') + '</div><p>' + esc(msg) + '</p>' +
      (concluir || descartar ? '<p>' + (concluir ? '<button type="button" class="botao botao--secundario" data-concluir-lote>Concluir ação pendente</button>' : '') +
        (descartar ? ' <button type="button" class="botao botao--perigoContorno" data-descartar-lote>Descartar ação pendente</button>' : '') + '</p>' : '') + '</div>';
  }
  /** (1.8.7) "Concluir ação pendente" / "Descartar ação pendente". */
  function resolverPendenciaLote(acao) {
    if (!loteAtual) return;
    var info = loteAtual;
    if (acao === 'descartar' && !confirm('Descartar a ação pendente "' + (info.nome || 'em lote') + '"?\n\nDescartar só encerra a pendência: o que já foi gravado (' + (info.confirmados === null || info.confirmados === undefined ? 'não conferido' : info.confirmados + ' de ' + info.total) + ') NÃO é desfeito e o que falta não será aplicado. Confira as disciplinas depois.')) return;
    var botao = document.querySelector(acao === 'descartar' ? '[data-descartar-lote]' : '[data-concluir-lote]');
    if (botao) botao.disabled = true;
    I.executarNoServidor('resolverLotePendente', [{ acao: acao, id: info.id }], acao === 'descartar' ? 'Descartando…' : 'Concluindo a ação…').then(function (r) {
      var nome = r.nome || info.nome || 'em lote';
      var msg = r.resultado === 'concluido' ? 'Ação "' + nome + '" concluída.' : r.resultado === 'descartado' ? 'Ação pendente "' + nome + '" descartada (o que já estava gravado continua).' : 'Não há ação em lote pendente.';
      // (1.8.8) Sem leitura da preparação (leituraFalhou ou preparacao ausente): a
      // gravação está encerrada, mas o painel continua com os dados de antes. O
      // aviso fixo de recarga (posto por chamarServidor/aposConcluir no caso
      // 'concluido') fica — ou é posto aqui —, sem "Concluir"/"Descartar"; nada é
      // recarregado sozinho (fichas e rascunhos abertos ficam como estão).
      if (r.leituraFalhou || !r.preparacao) {
        mostrarPendencia(I.avisoRecarregarLote());
        P.mostrarAviso(msg + ' O painel não conseguiu atualizar os dados: recarregue a página para ver o resultado.');
        return;
      }
      I.aplicarPreparacao(r.preparacao);
      mostrarPendencia({ tipo: 'lote', estado: 'nenhum' });
      P.mostrarAviso(msg);
    }, function () {
      // a recusa (LOTE_PENDENTE…) já atualizou listas e aviso fixo em chamarServidor
      if (botao && document.body.contains(botao)) botao.disabled = false;
    });
  }
  function resolverPendencia(acao) {
    if (!pendenciaAtual) return;
    if (acao === 'descartar' && !confirm('Descartar o salvamento pendente de ' + (pendenciaAtual.codigo || 'uma disciplina') + '?\n\nO que ele ia gravar não será aplicado. Confira a disciplina depois.')) return;
    var botao = document.querySelector(acao === 'descartar' ? '[data-descartar-salvamento]' : '[data-concluir-salvamento]');
    if (botao) botao.disabled = true;
    I.executarNoServidor('resolverSalvamentoPendente', [{ acao: acao, id: pendenciaAtual.id }], acao === 'descartar' ? 'Descartando…' : 'Concluindo o salvamento…').then(function (r) {
      if (r.preparacao) I.aplicarPreparacao(r.preparacao, r.observacao);
      var codigo = r.codigo || (pendenciaAtual && pendenciaAtual.codigo) || 'a disciplina';
      mostrarPendencia(null);
      var p = ultimaPendencia; ultimaPendencia = null;
      // A ficha que pediu continua aberta e sem edições depois do envio: mostra o gravado.
      if (r.resultado === 'concluido' && p && instanciaAberta(p) && serializar() === p.enviado && P.estado.idx.itens[p.id]) renderizarFichaEditavel(P.estado.idx.itens[p.id]);
      P.mostrarAviso(r.resultado === 'concluido' ? 'Salvamento de ' + codigo + ' concluído.' : r.resultado === 'descartado' ? 'Salvamento pendente de ' + codigo + ' descartado.' : 'Não há salvamento pendente.');
    }, function (erro) {
      var lidos = erro && erro.dados;
      if (lidos && lidos.preparacao) I.aplicarPreparacao(lidos.preparacao, lidos.observacao);
      if (lidos && lidos.salvamento) mostrarPendencia(lidos.salvamento);
      else if (botao) botao.disabled = false;
    });
  }

  /** "Voltar aos dados do Júpiter": põe no formulário os valores originais. */
  function voltarJupiter() {
    var d = P.estado.idx.itens[ficha.id];
    if (!d || d._origem !== 'estrutura') return;
    document.querySelectorAll('#formFicha [data-campo]').forEach(function (c) {
      var k = c.getAttribute('data-campo');
      c.value = v(d._jupiter[k]);
    });
    var jupiter = P.estado.idx.ofertasJupiter[d._chave];
    // (1.8.10) Com oferta ajustada, a restauração é uma intenção explícita (nesta ficha):
    // ao salvar, o servidor remove o ajuste mesmo que os valores já coincidam com o Júpiter.
    if (jupiter && d._ofertaAjustada) ficha.restaurarOferta = true;
    if (jupiter) {
      document.querySelectorAll('#formFicha [data-oferta-curriculo]').forEach(function (tr) {
        var o = jupiter.filter(function (x) { return x.curriculo === tr.getAttribute('data-oferta-curriculo'); })[0];
        tr.querySelector('[data-oferta="tipo"]').value = o ? o.tipo : '';
        var per = tr.querySelector('[data-oferta="periodo"]');
        per.value = o && o.periodo ? o.periodo : '';
        per.disabled = !o;
      });
    }
    atualizarSalvar();
    P.mostrarAviso('Valores do Júpiter no formulário. Clique em "Salvar" para gravar.' + (d._ofertaPendencias && d._ofertaPendencias.length ? ' Esta disciplina tem vínculos de oferta a revisar: para voltar à oferta do Júpiter, marque também "Descartar os vínculos a revisar".' : ''));
  }

  /** Excluir (ou restaurar) a disciplina da ficha. */
  function excluirDaFicha() {
    if (!ficha || ficha.novo) return;
    if (operacaoPendente) { avisoEspera(); return; }
    var id = ficha.id;
    var d = P.estado.idx.itens[id];
    if (!d) return;
    var excluir = !d._excluida, rotulo = d.codigo;
    if (excluir && !confirm('Excluir ' + d.codigo + ' — ' + d.nome + '?\n\nEla deixa de aparecer na lista e na grade. Os dados continuam guardados: dá para restaurar pelo filtro Situação › Excluídas.')) return;
    var op = iniciarOperacao(excluir ? 'excluir' : 'restaurar', rotulo);
    if (!op) return;
    I.executarNoServidor('excluirDisciplinas', [[{ origem: d._origem, chave: d._chave }], excluir], excluir ? 'Excluindo…' : 'Restaurando…').then(function (r) {
      terminarOperacao(op);
      I.aplicarPreparacao(r.preparacao);
      var msg = excluir ? 'Disciplina excluída. Para desfazer: filtro Situação › Excluídas.' : 'Disciplina restaurada.';
      if (instanciaAberta(op)) {
        if (excluir) { ficha.inicial = serializar(); P.Modal.fechar($('modalDisciplina')); }
        else { var atual = P.estado.idx.itens[id]; if (atual) renderizarFichaEditavel(atual); }
        P.mostrarAviso(msg);
      } else P.mostrarAviso(rotulo + ' — ' + msg);
    }, function () {
      terminarOperacao(op);   // o aviso do erro já foi mostrado; a ficha continua como estava
    });
  }

  /** Abre a ficha em branco para cadastrar uma disciplina para outros cursos. */
  function abrirCadastro() {
    P.estado.pilhaFicha = [];
    P.estado.fichaAtual = null;
    renderizarFichaEditavel(null);
    var modal = $('modalDisciplina');
    if (!P.Modal.aberto(modal)) P.Modal.abrir(modal, { foco: $('fichaCampo-codigo'), aoFechar: function () { ficha = null; P.estado.pilhaFicha = []; P.estado.fichaAtual = null; } });
  }

  /*----------------------------------------------------------------
    Lista de disciplinas por unidade (CSV do Júpiter)
  ----------------------------------------------------------------*/
  function corpoUnidade(html) { $('unidadeCorpo').innerHTML = html; }
  function rodapeUnidade(html) { $('unidadeRodape').innerHTML = html; }

  /** Abre a janela no passo "escolher arquivo". */
  function abrirUnidade() {
    unidade = { texto: null, arquivo: null, previa: null, ocupado: false };
    passoArquivo();
    P.Modal.abrir($('modalUnidade'), { aoFechar: function () { unidade = null; } });
  }

  function passoArquivo(erro) {
    corpoUnidade(
      (erro ? '<div class="alerta alerta--erro" role="alert"><div class="alerta__titulo">Não foi possível usar este arquivo</div><p>' + esc(erro) + '</p></div>' : '') +
      '<div class="soltarArquivo" id="soltarUnidade">' +
        '<div class="soltarArquivo__icone" aria-hidden="true">📄</div>' +
        '<p><strong>Arraste o CSV para cá</strong> ou</p>' +
        '<label class="botao botao--primario" for="entradaUnidade">Escolher arquivo</label>' +
        '<input type="file" id="entradaUnidade" accept=".csv,text/csv" class="somenteLeitor">' +
        '<p class="pequeno texto-suave">CSV da "Lista de disciplinas por unidade" (Unidade: Instituto de Psicologia · Opção: Ativas)</p>' +
      '</div>' +
      '<div class="alerta alerta--info"><div class="alerta__titulo">Por que só o CSV</div><p>O PDF do mesmo relatório é uma imagem (precisaria de OCR, sujeito a erro) e só acrescenta a versão da disciplina, que não é usada na grade. O CSV traz código, nome, ativação e créditos exatamente como no Júpiter.</p></div>' +
      '<p class="pequeno">Só aparecem as disciplinas cujo código <strong>ainda não está</strong> na lista (estrutura curricular, com os códigos já ajustados, e disciplinas para outros cursos, inclusive as excluídas). Você escolhe quais incluir.</p>');
    rodapeUnidade('<button type="button" class="botao botao--secundario" data-fechar-unidade>Cancelar</button>');
    var entrada = $('entradaUnidade'), zona = $('soltarUnidade');
    entrada.addEventListener('change', function () { if (entrada.files[0]) lerArquivo(entrada.files[0]); });
    ['dragenter', 'dragover'].forEach(function (t) { zona.addEventListener(t, function (e) { e.preventDefault(); zona.classList.add('soltarArquivo--ativo'); }); });
    ['dragleave', 'drop'].forEach(function (t) { zona.addEventListener(t, function (e) { e.preventDefault(); zona.classList.remove('soltarArquivo--ativo'); }); });
    zona.addEventListener('drop', function (e) { var f = e.dataTransfer && e.dataTransfer.files[0]; if (f) lerArquivo(f); });
  }

  /** Lê o arquivo no navegador (UTF-8 ou Windows-1252) e pede a prévia ao servidor. */
  function lerArquivo(arquivo) {
    if (/\.pdf$/i.test(arquivo.name) || arquivo.type === 'application/pdf') { passoArquivo('Este é um PDF. Baixe o mesmo relatório em CSV no Júpiter e escolha o arquivo .csv.'); return; }
    if (arquivo.size > 2 * 1024 * 1024) { passoArquivo('Arquivo grande demais para esta lista (mais de 2 MB).'); return; }
    var leitor = new FileReader();
    leitor.onload = function () {
      var dec = LeitorCsvJupiter._decodificarBytes(new Uint8Array(leitor.result));
      unidade.texto = dec.texto;
      unidade.arquivo = arquivo.name;
      pedirPrevia();
    };
    leitor.onerror = function () { passoArquivo('Não foi possível ler o arquivo.'); };
    leitor.readAsArrayBuffer(arquivo);
  }

  function pedirPrevia() {
    corpoUnidade('<p role="status">Comparando com a lista atual…</p>');
    rodapeUnidade('');
    unidade.ocupado = true;
    P.chamarServidor('previaDisciplinasUnidade', unidade.texto, unidade.arquivo).then(function (pv) {
      unidade.ocupado = false;
      unidade.previa = pv;
      mostrarPreviaUnidade();
    }, function (erro) {
      unidade.ocupado = false;
      passoArquivo(erro.mensagem);
    });
  }

  /** Prévia: resumo e a lista das disciplinas novas, todas marcadas. */
  function mostrarPreviaUnidade(erro) {
    var pv = unidade.previa;
    // (1.8.2) total de recusadas (a lista traz até 50 motivos)
    var nIgnoradas = pv.totalInvalidas != null ? pv.totalInvalidas : pv.invalidas.length;
    var html = (erro ? '<div class="alerta alerta--erro" role="alert"><p>' + esc(erro) + '</p></div>' : '') +
      '<p><strong>' + esc(pv.arquivo) + '</strong>: ' + pv.total + ' disciplinas no arquivo · <strong>' + pv.novas.length + '</strong> ainda não estão na lista · ' + pv.conhecidas + ' já estão' +
      (pv.repetidas ? ' · ' + pv.repetidas + ' repetidas no arquivo' : '') + (nIgnoradas ? ' · ' + nIgnoradas + ' linhas ignoradas' : '') + '.</p>';
    if (nIgnoradas) {
      // (1.8.2) aberta: os motivos ficam à vista; estas linhas não são incluídas
      html += '<details class="grupoMudancas" open><summary>Linhas ignoradas — não serão incluídas (' + nIgnoradas + ')' + (nIgnoradas > pv.invalidas.length ? ' · mostrando as ' + pv.invalidas.length + ' primeiras' : '') + '</summary><ul class="listaMudancas">' + pv.invalidas.map(function (i) { return '<li>' + (i.ate ? 'Linhas ' + i.linha + ' a ' + i.ate : 'Linha ' + i.linha) + ': ' + esc(i.motivo) + '</li>'; }).join('') + '</ul>' +
        '<div class="ajudaLinha">' + gatilho('ajuda-outros-cursos-ignoradas', 'Por que linhas são ignoradas') + '</div></details>';
    }
    if (!pv.novas.length) {
      html += nIgnoradas
        ? '<div class="alerta alerta--aviso" role="status"><div class="alerta__titulo">Nada a incluir</div><p>Nenhuma linha válida traz disciplina nova. As linhas ignoradas acima não serão incluídas: corrija o arquivo e escolha-o de novo, se for o caso.</p></div>'
        : '<div class="alerta alerta--sucesso" role="status"><div class="alerta__titulo">Nada a incluir</div><p>Todas as disciplinas do arquivo já estão na lista.</p></div>';
      corpoUnidade(html);
      rodapeUnidade('<button type="button" class="botao botao--secundario" data-unidade="outro">Escolher outro arquivo</button><button type="button" class="botao botao--primario" data-fechar-unidade>Fechar</button>');
      return;
    }
    html += '<p class="pequeno">Elas serão marcadas como <strong>disciplina para outros cursos</strong>. Desmarque as que não devem entrar (ex.: disciplinas antigas ou que você já cadastrou com outro código).</p>' +
      '<div class="tabelaScroll"><table class="tabela tabelaUnidade"><caption class="somenteLeitor">Disciplinas que ainda não estão na lista</caption><thead><tr>' +
      '<th scope="col" class="celSelecao"><label><input type="checkbox" id="unidadeTodas" checked aria-label="Marcar ou desmarcar todas"></label></th>' +
      '<th scope="col">Disciplina</th><th scope="col">Departamento</th><th scope="col" class="num">Créditos</th><th scope="col" class="num">CH</th><th scope="col">Ativação</th></tr></thead><tbody>' +
      pv.novas.map(function (d) {
        return '<tr><td class="celSelecao"><label><input type="checkbox" class="caixaUnidade" value="' + esc(d.codigo) + '" checked aria-label="Incluir ' + esc(d.codigo) + '"></label></td>' +
          '<td><span class="mono">' + esc(d.codigo) + '</span> ' + esc(d.nome) + '</td><td data-rotulo="Departamento">' + esc(d.departamento) + '</td>' +
          '<td class="num" data-rotulo="Créditos">' + esc(v(d.creditosAula)) + ' + ' + esc(v(d.creditosTrabalho)) + '</td><td class="num" data-rotulo="CH">' + esc(d.ch == null ? '—' : d.ch + ' h') + '</td><td data-rotulo="Ativação">' + esc(d.ativacao || '—') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    corpoUnidade(html);
    $('unidadeTodas').addEventListener('change', function () {
      var c = this.checked;
      document.querySelectorAll('.caixaUnidade').forEach(function (x) { x.checked = c; });
      atualizarBotaoIncluir();
    });
    document.querySelectorAll('.caixaUnidade').forEach(function (x) { x.addEventListener('change', atualizarBotaoIncluir); });
    rodapeUnidade('<button type="button" class="botao botao--secundario" data-unidade="outro">Escolher outro arquivo</button><button type="button" class="botao botao--primario" data-unidade="incluir"></button>');
    atualizarBotaoIncluir();
  }

  function escolhidos() { return Array.prototype.map.call(document.querySelectorAll('.caixaUnidade:checked'), function (x) { return x.value; }); }

  function atualizarBotaoIncluir() {
    var n = escolhidos().length;
    var b = document.querySelector('[data-unidade="incluir"]');
    if (b) { b.textContent = n ? 'Incluir ' + n + (n === 1 ? ' disciplina' : ' disciplinas') : 'Nenhuma escolhida'; b.disabled = !n; }
    var todas = $('unidadeTodas');
    var total = document.querySelectorAll('.caixaUnidade').length;
    if (todas) { todas.checked = n === total; todas.indeterminate = n > 0 && n < total; }
  }

  function incluir() {
    var codigos = escolhidos();
    if (!codigos.length) return;
    unidade.ocupado = true;
    rodapeUnidade('<button type="button" class="botao botao--primario" disabled>Incluindo…</button>');
    P.chamarServidor('incluirDisciplinasUnidade', unidade.texto, unidade.arquivo, unidade.previa.assinatura, codigos).then(function (r) {
      unidade.ocupado = false;
      I.aplicarPreparacao(r.preparacao);
      corpoUnidade('<div class="alerta alerta--sucesso" role="status"><div class="alerta__titulo">' + r.incluidas + (r.incluidas === 1 ? ' disciplina incluída' : ' disciplinas incluídas') + '</div><p>Elas estão na etapa 2 (Disciplinas para outros cursos) e na lista para a grade horária. Abra cada uma para informar a unidade e o curso atendidos, se quiser.</p></div>');
      rodapeUnidade('<button type="button" class="botao botao--primario" data-fechar-unidade>Ver as disciplinas</button>');
    }, function (erro) {
      unidade.ocupado = false;
      if (erro.codigo === 'PREVIA_DESATUALIZADA') { pedirPrevia(); P.mostrarAviso(erro.mensagem); return; }
      mostrarPreviaUnidade(erro.mensagem);
    });
  }

  /*----------------------------------------------------------------
    Eventos
  ----------------------------------------------------------------*/
  document.addEventListener('click', function (ev) {
    var alvo = ev.target.closest ? ev.target : null;
    if (!alvo) return;
    if (alvo.closest('#fichaSalvar')) { salvar(); return; }
    if (alvo.closest('[data-concluir-salvamento]')) { resolverPendencia('concluir'); return; }
    if (alvo.closest('[data-descartar-salvamento]')) { resolverPendencia('descartar'); return; }
    if (alvo.closest('[data-concluir-lote]')) { resolverPendenciaLote('concluir'); return; }
    if (alvo.closest('[data-descartar-lote]')) { resolverPendenciaLote('descartar'); return; }
    if (alvo.closest('#fichaGrade')) { acaoGradeFicha(); return; }
    var abaPrevia = alvo.closest('[data-previa-aba]');
    if (abaPrevia) { previa.aba = abaPrevia.getAttribute('data-previa-aba'); previa.marcados = {}; renderizarPrevia(); $('previa-aba-' + previa.aba).focus(); return; }
    if (alvo.closest('[data-previa-remover]')) { removerSelecionadasDaPrevia(); return; }
    if (alvo.closest('[data-cadastrar-nova-grade]')) { abrirRecomeco(); return; }
    if (alvo.closest('[data-enviar-grade]')) { abrirEnvioGrade(); return; }
    if (alvo.closest('[data-confirmar-envio]')) { confirmarEnvioGrade(); return; }
    if (alvo.closest('[data-reconferir-envio]')) { abrirEnvioGrade(); return; }   // (1.8.12) nova conferência (nova instância)
    if (alvo.closest('[data-fechar-envio]')) { P.Modal.fechar($('modalEnvioGrade')); return; }
    if (alvo.closest('[data-recarregar-envio]')) { P.Modal.fechar($('modalEnvioGrade')); I.carregar('Atualizando a estrutura…'); return; }
    if (alvo.closest('[data-fechar-recomeco]')) { P.Modal.fechar($('modalRecomeco')); return; }
    if (alvo.closest('[data-confirmar-recomeco]')) { confirmarRecomeco(); return; }
    if (alvo.closest('#fichaExcluir')) { excluirDaFicha(); return; }
    if (alvo.closest('[data-voltar-jupiter]')) { voltarJupiter(); return; }
    if (alvo.closest('[data-abrir-unidade]')) { abrirUnidade(); return; }
    if (alvo.closest('[data-cadastrar-outros]')) { abrirCadastro(); return; }
    if (alvo.closest('[data-fechar-unidade]')) { if (!unidade || !unidade.ocupado) P.Modal.fechar($('modalUnidade')); return; }
    var u = alvo.closest('[data-unidade]');
    if (u) {
      var acao = u.getAttribute('data-unidade');
      if (acao === 'outro') passoArquivo();
      else if (acao === 'incluir') incluir();
    }
  });
  // Qualquer mudança no formulário da ficha: período só com tipo; "Salvar" só com alteração.
  document.addEventListener('input', function (ev) {
    if (!ev.target.closest || !ev.target.closest('#modalDisciplinaCorpo')) return;
    // (1.8.10) Edição manual da oferta depois de "Voltar aos dados do Júpiter": vale a escolha final.
    if (ev.target.getAttribute('data-oferta') && ficha) ficha.restaurarOferta = false;
    if (ev.target.getAttribute('data-oferta') === 'tipo') {
      var per = ev.target.closest('tr').querySelector('[data-oferta="periodo"]');
      per.disabled = !ev.target.value;
      if (!ev.target.value) per.value = '';
    }
    atualizarSalvar();
    conferirCh();
  });
  document.addEventListener('change', function (ev) {
    if (ev.target.closest && ev.target.closest('#modalDisciplinaCorpo')) {
      if (ev.target.getAttribute('data-oferta') && ficha) ficha.restaurarOferta = false;   // (1.8.10)
      atualizarSalvar();
    }
    if (ev.target.id === 'gradeSemestre' || ev.target.id === 'gradeAno') {
      alvo = { semestre: $('gradeSemestre').value, ano: Number($('gradeAno').value) };
      previa.marcados = {};
      renderizarPrevia();
      return;
    }
    // Prévia: caixa de uma disciplina ou "Selecionar todas" da aba atual.
    if (ev.target.id === 'previaTodas') {
      var grupo = disciplinasDaPrevia()[previa.aba];
      previa.marcados = {};
      if (ev.target.checked) grupo.forEach(function (d) { previa.marcados[d._id] = true; });
      renderizarPrevia();
      return;
    }
    var cx = ev.target.getAttribute && ev.target.getAttribute('data-previa-sel');
    if (cx) {
      if (ev.target.checked) previa.marcados[cx] = true; else delete previa.marcados[cx];
      renderizarPrevia();
    }
  });
  // Confirmação do recomeço: botão só com a palavra certa.
  document.addEventListener('input', function (ev) {
    if (ev.target.id !== 'recomecoPalavra') return;
    var b = document.querySelector('[data-confirmar-recomeco]');
    if (b) b.disabled = ev.target.value.trim().toUpperCase() !== 'APAGAR';
  });
  // Abas da prévia: setas, Home e End.
  document.addEventListener('keydown', function (ev) {
    var aba = ev.target.closest && ev.target.closest('[data-previa-aba]');
    if (!aba) return;
    var ids = GRUPOS_PREVIA.map(function (g) { return g.id; });
    var i = ids.indexOf(aba.getAttribute('data-previa-aba')), j = null;
    if (ev.key === 'ArrowRight') j = (i + 1) % ids.length;
    if (ev.key === 'ArrowLeft') j = (i - 1 + ids.length) % ids.length;
    if (ev.key === 'Home') j = 0;
    if (ev.key === 'End') j = ids.length - 1;
    if (j === null) return;
    ev.preventDefault();
    previa.aba = ids[j]; previa.marcados = {};
    renderizarPrevia();
    $('previa-aba-' + previa.aba).focus();
  });

  return { renderizarFichaEditavel: renderizarFichaEditavel, fichaAlterada: fichaAlterada, gravando: gravandoEsta, mostrarPendencia: mostrarPendencia, abrirCadastro: abrirCadastro, abrirUnidade: abrirUnidade, renderizarPrevia: renderizarPrevia, projecaoDoEnvio: projecaoDoEnvio };
})(Painel);
</script>
