      r.voltar = '<p><button type="button" class="botao botao--texto" data-voltar-ficha>← Voltar para ' + esc(idx.itens[anterior].codigo) + '</button></p>';
    }
    if (d._excluida) r.avisos += '<div class="alerta alerta--aviso"><div class="alerta__titulo">Excluída no painel</div><p>Esta disciplina não aparece na lista nem na grade. Para voltar a usá-la, restaure-a (lista com o filtro Situação › Excluídas).</p></div>';
    if (d._fora) r.avisos += '<div class="alerta alerta--aviso"><div class="alerta__titulo">Fora da estrutura atual</div><p>Esta disciplina estava numa importação anterior e não veio na última.</p></div>';
    // (1.8.9) Oferta ajustada depois de troca de currículo.
    if (d._ofertaPendencias && d._ofertaPendencias.length) {
      r.avisos += '<div class="alerta alerta--aviso" data-oferta-a-revisar><div class="alerta__titulo">Oferta a revisar</div><p>A oferta ajustada no painel tem ' + (d._ofertaPendencias.length === 1 ? 'um vínculo' : d._ofertaPendencias.length + ' vínculos') + ' de currículo que não pôde ser associado com segurança ao currículo em uso. ' + (d._ofertaPendencias.length === 1 ? 'Ele está guardado' : 'Eles estão guardados') + ', mas não conta para o semestre de oferecimento, os filtros e a grade até ser revisado:</p><ul>' +
        d._ofertaPendencias.map(function (p) { return '<li>Currículo ' + esc(p.curriculo || '?') + (p.tipo && ROTULO_TIPO[p.tipo] ? ' · ' + esc(ROTULO_TIPO[p.tipo]) : '') + (p.periodo ? ' · ' + esc(p.periodo) + 'º período' : '') + ' — ' + esc(p.motivo || '') + '</li>'; }).join('') +
        '</ul>' + (ehAdmin() ? '<p>Para resolver: ajuste "Onde aparece" abaixo, marque "Descartar os vínculos a revisar" e salve. Salvar outros campos sem mexer na oferta não descarta esses vínculos.</p>' : '') + gatilhoAjuda('ajuda-oferta-revisar', 'Entenda a oferta a revisar') + '</div>';
    }
    if (d._ofertaAssociada) r.avisos += '<div class="alerta alerta--info"><div class="alerta__titulo">Oferta ajustada associada ao currículo atual</div><p>' + (d._ofertaAssociada === 1 ? 'Um vínculo da oferta ajustada era' : d._ofertaAssociada + ' vínculos da oferta ajustada eram') + ' de um currículo substituído e ' + (d._ofertaAssociada === 1 ? 'foi associado' : 'foram associados') + ' ao currículo em uso da mesma habilitação, com o tipo e o período ajustados.</p>' + gatilhoAjuda('ajuda-oferta-revisar-associada', 'O que isto quer dizer') + '</div>';
    if (d._origem === 'outros') {
      r.resumo = '<section class="secao"><h3 class="secao__titulo">Em resumo</h3><div class="resumoDidatico"><p>Disciplina do IP ministrada para cursos de outras unidades' +
        (d.unidadeAtendida || d.cursoAtendido ? ' (' + esc([d.unidadeAtendida, d.cursoAtendido].filter(Boolean).join(' — ')) + ')' : '') + '. Não faz parte da estrutura curricular do curso de Psicologia.</p>' +
        '<p>' + (d.oferecimento === 'ambos' ? 'Oferecida nos dois semestres do ano.' : d.oferecimento ? 'Oferecida no ' + ROTULO_SEMESTRE[d.oferecimento] + ' do ano.' : 'Semestre de oferecimento não informado: escolha abaixo, em "Disciplina de semestre", se é oferecida no 1º, no 2º ou nos dois semestres do ano.') + '</p>' +
        (d.creditosAula != null ? '<p>' + esc(plural(d.creditosAula, 'crédito-aula', 'créditos-aula')) + (d.creditosTrabalho ? ' e ' + esc(plural(d.creditosTrabalho, 'crédito-trabalho', 'créditos-trabalho')) : '') + (d.ch != null ? ', ' + esc(d.ch) + ' horas no semestre' : '') + '.</p>' : '') +
        '</div></section>';
      r.historico = '<section class="secao"><h3 class="secao__titulo">Histórico</h3><p class="pequeno texto-suave" style="margin:0">' +
        esc([d.origem ? 'Origem: ' + d.origem : '', d.incluidaEm ? 'incluída em ' + d.incluidaEm : '', d.ativacao ? 'ativação no Júpiter: ' + d.ativacao : '', d.alteradoEm ? 'última alteração no painel: ' + d.alteradoEm + (d.alteradoPor ? ' por ' + d.alteradoPor : '') : ''].filter(Boolean).join(' · ')) + '</p></section>';
      return r;
    }
    var ofertas = ofertasDe(d);
    r.resumo = '<section class="secao"><h3 class="secao__titulo">Em resumo</h3><div class="resumoDidatico">' +
      textoResumo(d, ofertas).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div></section>';

    // Requisitos (habilitações com a mesma lista aparecem juntas)
    var porAssinatura = {}, ordemAss = [];
    ofertas.forEach(function (o) {
      var lista = (idx.requisitos[o.curriculo + '|' + d._chave] || []).slice().sort(function (a, b) { return (a.grupo || 0) - (b.grupo || 0) || (a.requisito < b.requisito ? -1 : 1); });
      var ass = lista.map(function (q) { return q.requisito + ':' + q.grupo; }).join(',');
      if (!porAssinatura[ass]) { porAssinatura[ass] = { habs: [], lista: lista }; ordemAss.push(ass); }
      porAssinatura[ass].habs.push(o.habNome);
    });
    if (ofertas.length) {
      r.requisitos = '<section class="secao"><h3 class="secao__titulo">Requisitos para cursar</h3>' +
        '<div class="ajudaLinha ajudaLinha--secao">' + gatilhoAjuda('ajuda-ficha-requisitos', '"Basta um destes" e "e também"') + '</div><div class="requisitos">' +
        ordemAss.map(function (a) {
          var g = porAssinatura[a];
          var titulo = g.habs.length === idx.habs.length && idx.habs.length > 1 ? 'Em todas as habilitações' : g.habs.join(', ');
          return '<div class="requisitos__hab"><h4>' + esc(titulo) + '</h4>' +
            (g.lista.length ? listaRequisitosHtml(g.lista, d._id) : '<p class="texto-suave" style="margin:0">Sem requisito.</p>') + '</div>';
        }).join('') + '</div></section>';
    }

    // É requisito de
    var dependentes = {};
    (idx.requisitoDe[d._chave] || []).forEach(function (q) {
      var h = idx.habPorCurriculo[q.curriculo];
      (dependentes[q.codigo] = dependentes[q.codigo] || []).push(h ? h.nome : q.curriculo);
    });
    var codigosDep = Object.keys(dependentes).sort();
    if (codigosDep.length) {
      r.ehRequisito = '<section class="secao"><h3 class="secao__titulo">É requisito para</h3><ul class="requisitos__lista">' +
        codigosDep.map(function (c) {
          var x = idx.disciplinas[c];
          return '<li><button type="button" class="linkDisciplina mono" data-abrir-ficha="' + esc(c) + '" data-vindo-de="' + esc(d._id) + '">' + esc(x ? x.codigo : c) + '</button> — ' + esc(x ? x.nome : '') + ' <span class="texto-suave pequeno">(' + esc(dependentes[c].join(', ')) + ')</span></li>';
        }).join('') + '</ul></section>';
    }

    // Origem dos dados e histórico
    var origem = [];
    if (d.versao) origem.push('Versão ' + d.versao + (d.versaoOrigem === 'PDF' ? ', lida no PDF' : d.versaoOrigem ? ', tirada do CSV (de outra disciplina que a tem como requisito)' : ''));
    if (d.incluidaEm) origem.push('Incluída na base em ' + d.incluidaEm);
    if (d.alteradaEm && d.alteradaEm !== d.incluidaEm) origem.push('Última alteração em ' + d.alteradaEm);
    if (d.complementoPdfEm) origem.push('Extensão e versão conferidas no PDF em ' + d.complementoPdfEm);
    if (d._ajustes.length || d._ofertaAjustada) origem.push('Ajustada no painel' + (d._alteradoEm ? ' em ' + d._alteradoEm : '') + (d._alteradoPor ? ' por ' + d._alteradoPor : ''));
    var hist = idx.alteracoes[d._chave] || [];
    r.historico = '<section class="secao"><h3 class="secao__titulo">Histórico</h3>' +
      (origem.length ? '<p class="pequeno texto-suave" style="margin-top:0">' + esc(origem.join(' · ')) + '</p>' : '') +
      (hist.length
        ? '<ul class="historico">' + hist.map(function (a) {
            var detalhe = a.campo ? a.campo + ': ' + (a.antes || '—') + ' → ' + (a.depois || '—') : '';
            return '<li><strong>' + esc(a.dataHora) + '</strong> — ' + esc(a.tipo) + (a.habilitacao ? ' (' + esc(a.habilitacao) + ')' : '') + (detalhe ? '<br><span class="texto-suave">' + esc(detalhe) + '</span>' : '') + '</li>';
          }).join('') + '</ul>'
        : '<p class="texto-suave pequeno" style="margin:0">Nenhuma mudança registrada desde a primeira importação.</p>') +
      '</section>';
    return r;
  }

  /*----------------------------------------------------------------
    Currículos
  ----------------------------------------------------------------*/
  /**
   * Aba Currículos: um cartão por habilitação em uso (contagens e, se o
   * PDF já foi importado, duração, quadro de carga horária, estágio, AAC,
   * AEX, extensão, total geral e o texto da habilitação) e, no fim, as
   * estruturas anteriores guardadas na base.
   */
  function renderizarCurriculos() {
    var idx = estado.idx;
    // Linha do quadro de carga horária (aula, trabalho, total).
    function linhaCh(rotulo, aula, trab, total) {
      return '<tr><th scope="row">' + esc(rotulo) + '</th><td>' + esc(numeroOuTraco(aula)) + '</td><td>' + esc(numeroOuTraco(trab)) + '</td><td>' + esc(numeroOuTraco(total)) + '</td></tr>';
    }
    var html = idx.vigentes.map(function (c) {
      var i = c.info || {};
      var temInfo = !!c.infoPdfEm;
      var partes = [];
      partes.push('<div class="curriculo__topo"><h2 class="curriculo__nome">' + esc(c.habilitacao) + '</h2>' +
        '<span class="texto-suave pequeno">Currículo <span class="mono">' + esc(formatarCurriculo(c.curriculo)) + '</span> · cadastrado em ' + esc(c.cadastradoEm) + (c.situacaoJupiter ? ' · ' + esc(c.situacaoJupiter) : '') + '</span></div>');
      partes.push('<div class="contagens">' +
        contagem(c.disciplinas, 'disciplinas') + contagem(c.obrigatorias, 'obrigatórias') + contagem(c.eletivas, 'optativas eletivas') + contagem(c.livres, 'optativas livres') + contagem(c.requisitos, 'requisitos') +
        (temInfo ? contagem(i.duracaoIdeal, 'semestres (duração ideal)') : '') + '</div>');
      if (temInfo) {
        partes.push('<p class="pequeno" style="margin:0 0 6px">' +
          (i.dataAtivacao ? 'Ativo desde ' + esc(i.dataAtivacao) + ' · ' : '') +
          'Duração: ideal ' + esc(numeroOuTraco(i.duracaoIdeal)) + ', mínima ' + esc(numeroOuTraco(i.duracaoMinima)) + ', máxima ' + esc(numeroOuTraco(i.duracaoMaxima)) + ' semestres</p>');
        partes.push('<div class="tabelaScroll"><table class="quadroCh"><caption class="somenteLeitor">Carga horária exigida em horas</caption><thead><tr><th scope="col">Carga horária (h)</th><th scope="col">Aula</th><th scope="col">Trabalho</th><th scope="col">Total</th></tr></thead><tbody>' +
          linhaCh('Obrigatórias', i.chAulaObrigatoria, i.chTrabalhoObrigatoria, i.chObrigatoria) +
          linhaCh('Optativas eletivas', i.chAulaEletiva, i.chTrabalhoEletiva, i.chEletiva) +
          linhaCh('Optativas livres', i.chAulaLivre, i.chTrabalhoLivre, i.chLivre) +
          '<tr><th scope="row">Total em disciplinas</th><td></td><td></td><td><strong>' + esc(numeroOuTraco(i.chDisciplinas)) + '</strong></td></tr>' +
          '</tbody></table></div>');
        partes.push('<div class="numeros" style="margin-top:12px">' +
          blocoNumero(horas(i.estagio), 'Estágio', 'exigido no currículo') +
          blocoNumero(horas(c.aacHoras), 'AAC', 'atividades acadêmicas complementares' + (c.aacPercentual != null ? ' (' + String(c.aacPercentual).replace('.', ',') + '%)' : '')) +
          blocoNumero(horas(i.aexApolo), 'AEX Apolo', 'extensão registrada no Apolo') +
          blocoNumero(horas(i.extensaoTotal), 'Extensão exigida', i.extensaoPercentual != null ? String(i.extensaoPercentual).replace('.', ',') + '% da carga horária' : 'no currículo') +
          blocoNumero(horas(i.totalGeral), 'Total geral', 'disciplinas + AAC + AEX + extensão em optativas') +
          '</div>');
        if (i.informacoesEspecificas) {
          partes.push('<details class="textoLongo"><summary>Informações específicas da habilitação</summary>' +
            i.informacoesEspecificas.split('\n').map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</details>');
        }
      } else {
        partes.push('<p class="secao__nota">AAC exigida: ' + esc(numeroOuTraco(c.aacHoras, ' h')) + '. Duração, cargas horárias exigidas e o texto do currículo aparecem aqui depois que o PDF do relatório for importado.</p>');
      }
      return '<article class="cartao curriculo">' + partes.join('') + '</article>';
    });
    var antigos = idx.curriculos.filter(function (c) { return !c.vigente; });
    if (antigos.length) {
      html.push('<section class="cartao curriculo"><h2 class="curriculo__nome" style="font-size:16px">Estruturas anteriores guardadas na base</h2><ul class="listaMudancas">' +
        antigos.map(function (c) { return '<li>' + esc(c.habilitacao) + ' — currículo <span class="mono">' + esc(formatarCurriculo(c.curriculo)) + '</span> (' + esc(c.cadastradoEm) + '): ' + esc(c.vigenteTexto) + '</li>'; }).join('') + '</ul></section>');
    }
    $('listaCurriculos').innerHTML = html.join('');
  }

  /** Pequeno quadro "valor + rótulo" das contagens do currículo. */
  function contagem(valor, rotulo) {
    return '<div class="contagem"><div class="contagem__valor">' + esc(numeroOuTraco(valor)) + '</div><div class="contagem__rotulo">' + esc(rotulo) + '</div></div>';
  }

  /*----------------------------------------------------------------
    Histórico de importações
  ----------------------------------------------------------------*/
  /**
   * Aba Importações: um cartão por importação (mais recente primeiro),
   * com números do que mudou e a lista de mudanças registradas. O e-mail
   * de quem importou só vem do servidor para administradores.
   */
  function renderizarHistorico() {
    var d = estado.dados;
    var porImportacao = {};
    (d.alteracoes || []).forEach(function (a) { (porImportacao[a.importacao] = porImportacao[a.importacao] || []).push(a); });
    if (!d.importacoes.length) { $('listaImportacoes').innerHTML = '<div class="cartao vazio">Nenhuma importação registrada.</div>'; return; }
    $('listaImportacoes').innerHTML = d.importacoes.map(function (imp) {
      var alt = porImportacao[imp.id] || [];
      var numeros = [];
      if (imp.novas) numeros.push(plural(imp.novas, 'nova', 'novas'));
      if (imp.alteradas) numeros.push(plural(imp.alteradas, 'alterada', 'alteradas'));
      if (imp.sairam) numeros.push(imp.sairam + ' saíram');
      if (imp.voltaram) numeros.push(imp.voltaram + ' voltaram');
      if (imp.ofertasAlteradas) numeros.push(plural(imp.ofertasAlteradas, 'mudança de oferta', 'mudanças de oferta'));
      return '<article class="cartao importacao">' +
        '<div class="importacao__topo"><h3 class="importacao__titulo">' + esc(imp.dataHora) + ' — ' + esc(imp.arquivo) + '</h3><span class="selo selo--info">' + esc(imp.leitura || imp.formato) + '</span></div>' +
        '<p class="pequeno texto-suave" style="margin:6px 0 0">' + esc(imp.modo) + (imp.usuario ? ' · por ' + esc(imp.usuario) : '') + '</p>' +
        '<p class="pequeno" style="margin:6px 0 0">' + esc(imp.curriculos) + '</p>' +
        '<p class="pequeno" style="margin:6px 0 0">' + esc(imp.disciplinas) + ' disciplinas no arquivo' + (numeros.length ? ' · ' + esc(numeros.join(' · ')) : ' · nenhuma mudança nas disciplinas') + '</p>' +
        (alt.length ? '<details><summary>Ver mudanças registradas (' + alt.length + ')</summary><ul class="listaMudancas">' + alt.map(function (a) {
          var alvo = a.codigo ? '<span class="mono">' + esc(a.codigo) + '</span> ' + esc(a.nome) + ' — ' : '';
          var detalhe = a.campo || a.antes || a.depois ? ' (' + esc([a.campo, (a.antes || '') + (a.antes || a.depois ? ' → ' : '') + (a.depois || '')].filter(Boolean).join(': ')) + ')' : '';
          return '<li>' + alvo + esc(a.tipo) + (a.habilitacao ? ' — ' + esc(a.habilitacao) : '') + detalhe + '</li>';
        }).join('') + '</ul></details>' : '') +
        '</article>';
    }).join('');
  }

  /*----------------------------------------------------------------
    Abas
  ----------------------------------------------------------------*/
  /** Mostra a aba id ("disciplinas", "curriculos" ou "historico"); focar = levar o foco à aba. */
  function ativarAba(id, focar) {
    ['disciplinas', 'curriculos', 'historico'].forEach(function (nome) {
      var aba = $('aba-' + nome), painel = $('painel-' + nome);
      var ativa = nome === id;
      aba.setAttribute('aria-selected', ativa ? 'true' : 'false');
      aba.tabIndex = ativa ? 0 : -1;
      painel.hidden = !ativa;
      if (ativa && focar) aba.focus();
    });
  }

  /*----------------------------------------------------------------
    Eventos
  ----------------------------------------------------------------*/
  /**
   * Liga os eventos da página (uma vez, ao carregar o script): em cada
   * lista, busca com espera de 150 ms, filtros, ordenação, download,
   * botão "Filtros" no celular e caixas de seleção; cliques delegados
   * (ficha, chips, ações em lote, voltar, importar); abas e etapas com
   * setas/Home/End.
   */
  function ligarEventos() {
    Object.keys(LISTAS).forEach(function (id) {
      var L = LISTAS[id];
      var raiz = $(L.raizId);
      if (!raiz) return;
      var temporizadorBusca;
      var busca = el(L, 'campoBusca');
      if (busca) busca.addEventListener('input', function () {
        clearTimeout(temporizadorBusca);
        var valor = this.value;
        temporizadorBusca = setTimeout(function () { L.filtros.texto = valor.trim(); renderizarLista(L); }, 150);
      });
      raiz.querySelectorAll('[data-filtro]').forEach(function (c) {
        c.addEventListener('change', function () {
          var k = c.getAttribute('data-filtro');
          L.filtros[k] = c.type === 'checkbox' ? c.checked : c.value;
          if (k === 'situacao') L.marcados = {};
          renderizarLista(L);
        });
      });
      var ord = el(L, 'ordenacao');
      if (ord) ord.addEventListener('change', function () { L.ordem = this.value; renderizarLista(L); });
      var limpar = el(L, 'limparFiltros');
      if (limpar) limpar.addEventListener('click', function () { limparFiltros(L); });
      var baixar = el(L, 'baixarLista');
      if (baixar) baixar.addEventListener('click', function () { baixarLista(L); });
      var botaoFiltros = el(L, 'botaoFiltros');
      if (botaoFiltros) botaoFiltros.addEventListener('click', function () {
        var f = el(L, 'filtros');
        var fechado = f.getAttribute('data-fechado') === 'true';
        f.setAttribute('data-fechado', fechado ? 'false' : 'true');
        this.setAttribute('aria-expanded', fechado ? 'true' : 'false');
      });
      raiz.addEventListener('change', function (ev) {
        var caixa = ev.target.closest ? ev.target.closest('.caixaSelecao, [data-sel-todos]') : null;
        if (caixa) caixaMudou(L, caixa);
      });
    });

    // Cliques delegados (listas, chips, ficha, estado da base)
    document.addEventListener('click', function (ev) {
      var alvo = ev.target.closest ? ev.target : null;
      if (!alvo) return;
      if (alvo.closest('.caixaSelecao, [data-sel-todos], .celSelecao')) {
        // Clique na célula da caixa (fora da caixa) marca/desmarca a caixa.
        var cel = alvo.closest('.celSelecao');
        if (cel && !alvo.closest('input, label')) { var cx = cel.querySelector('input'); if (cx && !cx.disabled) cx.click(); }
        return;
      }
      var botaoFicha = alvo.closest('[data-abrir-ficha]');
      if (botaoFicha) { abrirFicha(botaoFicha.getAttribute('data-abrir-ficha'), botaoFicha.getAttribute('data-vindo-de')); return; }
      var linha = alvo.closest('tbody tr[data-id]');
      if (linha && linha.closest('.tabelaLista') && !alvo.closest('button, a, input')) { abrirFicha(linha.getAttribute('data-id')); return; }
      var lote = alvo.closest('[data-lote]');
      if (lote) { acaoLote(LISTAS[lote.getAttribute('data-lista')], lote.getAttribute('data-lote')); return; }
      var remover = alvo.closest('[data-remover-filtro]');
      if (remover) {
        var L = LISTAS[remover.getAttribute('data-lista')] || LISTAS.estrutura;
        var k = remover.getAttribute('data-remover-filtro');
        L.filtros[k] = L.padrao[k];
        if (k === 'situacao') L.marcados = {};
        sincronizarControlesFiltros(L);
        renderizarLista(L);
        if (el(L, 'campoBusca')) el(L, 'campoBusca').focus();
        return;
      }
      var limpar = alvo.closest('[data-limpar-filtros]');
      if (limpar) { limparFiltros(LISTAS[limpar.getAttribute('data-lista')] || LISTAS.estrutura); return; }
      if (alvo.closest('[data-voltar-ficha]')) {
        var anterior = estado.pilhaFicha.pop();
        if (anterior && estado.idx.itens[anterior]) { estado.fichaAtual = anterior; renderizarFicha(estado.idx.itens[anterior]); $('modalDisciplinaTitulo').setAttribute('tabindex', '-1'); $('modalDisciplinaTitulo').focus(); }
        return;
      }
      if (alvo.closest('[data-fechar-modal]')) { fecharFicha(); return; }
      if (alvo.closest('[data-abrir-importacao]') && window.Importacao) { window.Importacao.abrir(); }
    });

    // Abas da etapa 1 e etapas: clique e setas do teclado
    function ligarTabs(ids, ativar) {
      ids.forEach(function (nome, i, todas) {
        var aba = $(nome);
        if (!aba) return;
        aba.addEventListener('click', function () { ativar(i); });
        aba.addEventListener('keydown', function (ev) {
          var j = null;
          if (ev.key === 'ArrowRight') j = (i + 1) % todas.length;
          if (ev.key === 'ArrowLeft') j = (i - 1 + todas.length) % todas.length;
          if (ev.key === 'Home') j = 0;
          if (ev.key === 'End') j = todas.length - 1;
          if (j !== null) { ev.preventDefault(); ativar(j, true); }
        });
      });
    }
    var abas = ['disciplinas', 'curriculos', 'historico'];
    ligarTabs(abas.map(function (n) { return 'aba-' + n; }), function (i, focar) { ativarAba(abas[i], focar); });
    ligarTabs(['etapa-1', 'etapa-2', 'etapa-3', 'etapa-4'], function (i, focar) { ativarEtapa(i + 1, focar); });
  }

  /** Volta busca e filtros da lista L ao padrão e leva o foco ao campo de busca. */
  function limparFiltros(L) {
    L = L || LISTAS.estrutura;
    L.filtros = copiar(L.padrao);
    L.marcados = {};
    sincronizarControlesFiltros(L);
    renderizarLista(L);
    if (el(L, 'campoBusca')) el(L, 'campoBusca').focus();
  }

  ligarEventos();

  // Usados por PainelImportacao.html (janela, chamadas ao servidor, avisos
  // e recarga da base depois de gravar).
  return {
    carregar: carregar,
    abrirFicha: abrirFicha,
    Modal: Modal,
    esc: esc,
    gatilhoAjuda: gatilhoAjuda,   // (1.9.0) botão "?" da Central de Ajuda
    chamarServidor: chamarServidor,
    mostrarAviso: mostrarAviso,
    estado: estado,
    // Usados por PainelPreparacao.html (etapas 2 e 3 e ficha editável).
    interno: {
      $: $, ehAdmin: ehAdmin, secoesFicha: secoesFicha, cabecalhoFicha: cabecalhoFicha, ofertasDe: ofertasDe,
      aplicarPreparacao: aplicarPreparacao, avisoRecarregarLote: avisoRecarregarLote, executarNoServidor: executarNoServidor, ativarEtapa: ativarEtapa, itensDe: itensDe, carregar: carregar,
      renderizarFicha: renderizarFicha, fecharFicha: fecharFicha, mostrarCarregando: mostrarCarregando, esconderCarregando: esconderCarregando,
      ROTULO_SEMESTRE: ROTULO_SEMESTRE, ROTULO_SEMESTRE_CURTO: ROTULO_SEMESTRE_CURTO, oferecimentoPeloPeriodo: oferecimentoPeloPeriodo, oferecimentoDe: oferecimentoDe,
      ROTULO_TIPO: ROTULO_TIPO, NOME_DEPARTAMENTO: NOME_DEPARTAMENTO, DEPARTAMENTOS_LISTA: DEPARTAMENTOS_LISTA, LISTAS: LISTAS
    }
  };
})();

window.addEventListener('load', function () { Painel.carregar(); });
</script>
