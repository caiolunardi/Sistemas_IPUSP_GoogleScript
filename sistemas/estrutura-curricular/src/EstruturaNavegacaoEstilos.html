<style>
/* 1.10.0 — camada visual isolada. Tokens de tema existentes; efeitos apenas
   na navegação. Exceção visual solicitada: brilho discreto + elevação. */
.conteudo { max-width: 1480px; }
.estruturaNavegacao {
  display: flex; align-items: center; justify-content: flex-end;
  gap: 12px; margin-bottom: 20px;
}
.estruturaNavegacao__rotulo { color: var(--gradip-text-muted); margin: 0; font-size: 13px; }
.estruturaNavegacao__modos {
  display: inline-flex; gap: 4px; padding: 4px;
  background: var(--gradip-surface); border: 1px solid var(--gradip-border); border-radius: 13px;
}
.estruturaModo, .estruturaMenuMovel {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 8px 14px; border: 1px solid transparent;
  border-radius: 9px; font: inherit; font-size: 14px; font-weight: 600;
  background: transparent; color: var(--gradip-text-muted); cursor: pointer;
}
.estruturaModo[aria-pressed="true"] {
  background: var(--gradip-info-bg); border-color: var(--gradip-link); color: var(--gradip-link);
}

}

  background: var(--gradip-surface); scrollbar-gutter: stable;

.estruturaSidebar__titulo { margin: 0; font-size: 16px; font-weight: 700; color: var(--gradip-text); }
.estruturaSidebar__grupo + .estruturaSidebar__grupo { border-top: 1px solid var(--gradip-border); margin-top: 16px; padding-top: 16px; }
.estruturaSidebar__rotulo { margin: 0 8px 10px; font-size: 12px; font-weight: 600; color: var(--gradip-text-muted); }

}
.estruturaSidebar .etapas__textos { flex: 1; min-width: 0; }
.estruturaSidebar .etapas__titulo { font-size: 14px; }
.estruturaSidebar .etapas__contagem { font-size: 12px; color: var(--gradip-text-muted); }
.estruturaSidebar .abas__contagem { margin-left: auto; }
.estruturaIcone { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 20px; height: 20px; pointer-events: none; }
.estruturaIcone svg { width: 20px; height: 20px; }
.visoes__botao, .abas__aba { display: inline-flex; align-items: center; gap: 8px; }

.estruturaModo:focus-visible, .estruturaMenuMovel:focus-visible {

#estruturaLayout[data-navegacao="abas"] :is(.visoes, .abas) { padding: 6px 4px; }
@media (hover: hover) and (pointer: fine) {

  .estruturaModo:hover {

  .estruturaNavegacao__rotulo { flex-basis: 100%; }
  .estruturaNavegacao__modos { width: 100%; }
  .estruturaModo { flex: 1; padding: 8px; }

  #estruturaLayout[data-navegacao="abas"] .etapas { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  #estruturaLayout :is(.visoes__botao, .etapas__etapa, .abas__aba), .estruturaModo {
    transition: none; transform: none !important;
  }

}
@media print {
  .estruturaNavegacao, .estruturaSidebar { display: none !important; }
  .estruturaLayout[data-navegacao="sidebar"] { display: block; }
}
</style>
