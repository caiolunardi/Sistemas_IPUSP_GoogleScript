<style>
/*=====================================================================
  ESTRUTURA CURRICULAR — estilos do painel
  Só tokens GRADIP (GradipTema.html): nenhuma cor fixa, salvo onde
  indicado. Claro e escuro têm a mesma estrutura; muda só o token.
=====================================================================*/

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  background: var(--gradip-bg);
  color: var(--gradip-text);
}

button, input, select, textarea { font: inherit; }
/* "hidden" sempre esconde, mesmo em componentes com display próprio. */
[hidden] { display: none !important; }

.somenteLeitor {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

.pularParaConteudo {
  position: absolute; left: 8px; top: -60px; z-index: 100;
  background: var(--gradip-primary); color: var(--gradip-on-primary);
  padding: 10px 14px; border-radius: 8px; text-decoration: none; font-weight: bold;
}
.pularParaConteudo:focus { top: 8px; }

:focus-visible { outline: 3px solid var(--gradip-focus); outline-offset: 2px; }

/*---------------- Cabeçalho (mesmo padrão do Painel de Solicitações) ----------------*/
.cabecalho {
  background: var(--gradip-header-bg);
  min-height: 72px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 10px 22px;
  border-bottom: 1px solid var(--gradip-border);
}
.cabecalho__marca { display: flex; align-items: center; gap: 15px; min-width: 0; }
.cabecalho__marca .marcaIpuspSvg { height: 52px; width: auto; flex: 0 0 auto; }
.cabecalho__textos { min-width: 0; }
.cabecalho__titulo { font-size: 17px; font-weight: bold; color: var(--gradip-text); }
.cabecalho__subtitulo { font-size: 13px; color: var(--gradip-text-muted); margin-top: 2px; }
.cabecalho__acoes { display: flex; align-items: center; gap: 16px; flex: 0 0 auto; }
.logoUSP { height: 44px; width: auto; flex: 0 0 auto; }
.logoUSPWrap { display: flex; align-items: center; flex: 0 0 auto; padding: 4px 6px; }
.barraInstitucional { height: 6px; background: var(--gradip-header-accent); }

/*---------------- Estrutura geral ----------------*/
.conteudo { max-width: 1200px; margin: 0 auto; padding: 22px 20px 48px; }
.conteudo:focus { outline: none; }

.cartao {
  background: var(--gradip-surface);
  color: var(--gradip-text);
  border: 1px solid var(--gradip-border);
  border-radius: 10px;
  box-shadow: var(--gradip-shadow);
}

.versaoSistema { margin: 28px 0 0; text-align: center; }
.versaoSistema:empty { display: none; }

.titulo2 { font-size: 20px; margin: 0 0 6px; }
.texto-suave { color: var(--gradip-text-muted); }
.pequeno { font-size: 13px; }
.mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }

/*---------------- Botões ----------------*/
.botao {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 16px;
  border-radius: 8px; border: 1px solid transparent;
  font-weight: bold; cursor: pointer; text-decoration: none; white-space: nowrap;
}
.botao--primario { background: var(--gradip-primary); color: var(--gradip-on-primary); }
.botao--primario:hover { background: var(--gradip-primary-hover); }
.botao--secundario { background: var(--gradip-surface); color: var(--gradip-text); border-color: var(--gradip-border-strong); }
.botao--secundario:hover { background: var(--gradip-surface-2); }
.botao--texto { background: transparent; color: var(--gradip-link); border-color: transparent; padding: 0 10px; }
.botao--texto:hover { color: var(--gradip-link-hover); text-decoration: underline; }
.botao:disabled, .botao[aria-disabled="true"] {
  background: var(--gradip-disabled-bg); color: var(--gradip-disabled-text);
  border-color: var(--gradip-border); cursor: not-allowed;
}
.botao__icone { font-size: 17px; line-height: 1; }

/*---------------- Estado da base ----------------*/
.estadoBase { padding: 18px 20px; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.estadoBase__titulo { font-size: 18px; font-weight: bold; margin: 0 0 4px; }
.estadoBase__meta { margin: 0; color: var(--gradip-text-muted); font-size: 14px; }
.estadoBase__meta strong { color: var(--gradip-text); }
.estadoBase--vazio { flex-direction: column; align-items: flex-start; }
.avisoPlanilha { margin: 10px 0 0; max-width: 80ch; }
.estadoBase--vazio p { margin: 0 0 6px; max-width: 70ch; }

/*---------------- Abas ----------------*/
.abas {
  display: flex; gap: 4px; margin: 22px 0 16px;
  border-bottom: 1px solid var(--gradip-border);
  overflow-x: auto;
}
.abas__aba {
  min-height: 44px; padding: 0 16px;
  background: transparent; border: 0; border-bottom: 3px solid transparent;
  color: var(--gradip-text-muted); font-weight: bold; cursor: pointer; white-space: nowrap;
}
.abas__aba:hover { color: var(--gradip-text); }
.abas__aba[aria-selected="true"] { color: var(--gradip-link); border-bottom-color: var(--gradip-header-accent); }
.abas__contagem { font-weight: normal; color: var(--gradip-text-muted); }

/*---------------- Busca e filtros ----------------*/
.busca { padding: 16px; margin-bottom: 14px; }
.busca__linha { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.campo { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.campo__rotulo { font-size: 13px; font-weight: bold; color: var(--gradip-text); }
.campo input[type="search"], .campo select, .campo input[type="text"] {
  min-height: 44px; padding: 0 12px; width: 100%;
  background: var(--gradip-input-bg); color: var(--gradip-input-text);
  border: 1px solid var(--gradip-border-strong); border-radius: 8px;
}
.campo input::placeholder { color: var(--gradip-input-placeholder); }
.campo--busca { flex: 1 1 320px; }
.busca__alternarFiltros { display: none; }

.filtros {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px; margin-top: 14px;
}
.filtros__marcadores {
  grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center;
  margin: 0; padding: 0; border: 0;
}
.filtros__marcadores legend { font-size: 13px; font-weight: bold; margin-bottom: 6px; padding: 0; }
.marcador {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 44px; padding: 0 12px;
  border: 1px solid var(--gradip-border-strong); border-radius: 22px;
  background: var(--gradip-surface); cursor: pointer; font-size: 14px;
}
.marcador input { width: 18px; height: 18px; accent-color: var(--gradip-primary); margin: 0; }
.marcador:has(input:checked) { background: var(--gradip-info-bg); border-color: var(--gradip-info-border); }
.marcador:has(input:focus-visible) { outline: 3px solid var(--gradip-focus); outline-offset: 2px; }
.confirmacaoRevisao { margin-top: 14px; font-weight: bold; }
.paginacaoRevisao { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; margin: 10px 0; }
.paginacaoRevisao__estado { font-size: 14px; }
.revisaoGrupo { font-size: 15px; margin: 12px 0 6px; }
.filtros__acoes { grid-column: 1 / -1; display: flex; justify-content: flex-end; }

/*---------------- Resultado ----------------*/
.resultado__topo { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin: 4px 0 10px; }
.resultado__contagem { font-weight: bold; }
.resultado__ferramentas { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.resultado__ferramentas .campo { flex-direction: row; align-items: center; gap: 8px; }
.resultado__ferramentas select { width: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; padding: 0; list-style: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 6px 0 12px;
  background: var(--gradip-info-bg); border: 1px solid var(--gradip-info-border); color: var(--gradip-text);
  border-radius: 18px; font-size: 13px;
}
.chip__remover {
  min-width: 32px; min-height: 32px; border: 0; background: transparent; color: var(--gradip-text);
  border-radius: 16px; cursor: pointer; font-size: 16px; line-height: 1;
}
.chip__remover:hover { background: var(--gradip-surface-2); }

/*---------------- Tabela de disciplinas ----------------*/
.tabelaScroll { max-width: 100%; overflow-x: auto; }
.tabela { width: 100%; border-collapse: collapse; background: var(--gradip-surface); color: var(--gradip-text); }
.tabela caption { text-align: left; }
.tabela th {
  background: var(--gradip-surface-2); text-align: left; font-size: 13px;
  padding: 10px 12px; border-bottom: 1px solid var(--gradip-border); white-space: nowrap;
}
.tabela td { padding: 10px 12px; border-bottom: 1px solid var(--gradip-border); vertical-align: top; }
#tabelaDisciplinas tbody tr { cursor: pointer; }
#tabelaDisciplinas tbody tr:hover td { background: var(--gradip-surface-2); }
.tabela .num { text-align: right; white-space: nowrap; }
.tabela__abrir {
  display: block; width: 100%; text-align: left; background: transparent; border: 0; padding: 0;
  color: inherit; cursor: pointer; min-height: 44px;
}
.tabela__codigo { display: block; font-weight: bold; color: var(--gradip-link); }
.tabela__nome { display: block; }
.tabela__abrir:hover .tabela__nome { text-decoration: underline; }
.tabela__fora { display: inline-block; margin-top: 4px; }
.vazio { padding: 28px 20px; text-align: center; color: var(--gradip-text-muted); }

/*---------------- Selos (tipo por habilitação, departamento, estado) ----------------*/
.selos { display: flex; flex-wrap: wrap; gap: 6px; }
.selo {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 11px; border-radius: 999px; /* 1.4.1: todas as marcações em "balão" (elípticas) */ font-size: 12.5px; line-height: 1.35;
  background: var(--gradip-surface-2); border: 1px solid var(--gradip-border); color: var(--gradip-text);
}
/* Cor de domínio por tipo — convenção da grade horária com as secretarias:
   VERDE = obrigatória, AZUL = optativa eletiva, ROSA = optativa livre.
   Rótulo em "balão" (fundo claro da cor, borda e texto em negrito num tom
   mais escuro); no tema escuro, fundo escuro da cor e texto claro. Todas as
   combinações têm contraste de texto ≥ 4,5:1. O texto sempre diz o tipo. */
:root {
  --tipo-obrig-bg: #dcfce7; --tipo-obrig-borda: #86efac; --tipo-obrig-texto: #166534;
  --tipo-eletiva-bg: #dbeafe; --tipo-eletiva-borda: #93c5fd; --tipo-eletiva-texto: #1e40af;
  --tipo-livre-bg: #fce7f3; --tipo-livre-borda: #f9a8d4; --tipo-livre-texto: #9d174d;
}
:root[data-theme="dark"] {
  --tipo-obrig-bg: #12301f; --tipo-obrig-borda: #2f6b45; --tipo-obrig-texto: #86efac;
  --tipo-eletiva-bg: #13264a; --tipo-eletiva-borda: #2c4f8a; --tipo-eletiva-texto: #93c5fd;
  --tipo-livre-bg: #3a1529; --tipo-livre-borda: #7a2f57; --tipo-livre-texto: #f9a8d4;
}
.selo--OBRIGATORIA, .selo--OPTATIVA_ELETIVA, .selo--OPTATIVA_LIVRE { border-radius: 999px; padding: 3px 11px; font-weight: bold; }
.selo--OBRIGATORIA { background: var(--tipo-obrig-bg); border-color: var(--tipo-obrig-borda); color: var(--tipo-obrig-texto); }
.selo--OPTATIVA_ELETIVA { background: var(--tipo-eletiva-bg); border-color: var(--tipo-eletiva-borda); color: var(--tipo-eletiva-texto); }
.selo--OPTATIVA_LIVRE { background: var(--tipo-livre-bg); border-color: var(--tipo-livre-borda); color: var(--tipo-livre-texto); }
/* Habilitação que atende aos filtros: anel na cor do texto. */
.selo--destaque { box-shadow: 0 0 0 2px currentColor; }
.selo--aviso { background: var(--gradip-warning-bg); border-color: var(--gradip-warning-border); }
.selo--info { background: var(--gradip-info-bg); border-color: var(--gradip-info-border); }
.selo strong { font-weight: bold; }

/*---------------- Alertas ----------------*/
.alerta { border: 1px solid; border-radius: 8px; padding: 12px 14px; margin: 0 0 12px; }
.alerta p { margin: 4px 0 0; color: var(--gradip-text); }
.alerta__titulo { font-weight: bold; }
.alerta--sucesso { background: var(--gradip-success-bg); border-color: var(--gradip-success-border); }
.alerta--sucesso .alerta__titulo { color: var(--gradip-success); }
.alerta--aviso { background: var(--gradip-warning-bg); border-color: var(--gradip-warning-border); }
.alerta--aviso .alerta__titulo { color: var(--gradip-warning); }
.alerta--erro { background: var(--gradip-danger-bg); border-color: var(--gradip-danger-border); }
.alerta--erro .alerta__titulo { color: var(--gradip-danger); }
.alerta--info { background: var(--gradip-info-bg); border-color: var(--gradip-info-border); }
.alerta--info .alerta__titulo { color: var(--gradip-info); }
.alerta ul { margin: 6px 0 0; padding-left: 20px; }
.alerta li { margin: 3px 0; }
.detalheAviso { display: block; margin-top: 3px; color: var(--gradip-text-muted); font-size: 13px; overflow-wrap: anywhere; }

/*---------------- Modal ----------------*/
.modal {
  position: fixed; inset: 0; z-index: 50;
  display: flex; align-items: flex-start; justify-content: center;
  background: var(--gradip-overlay); padding: 32px 16px; overflow-y: auto;
}
.modal[hidden] { display: none; }
.modal__painel {
  width: 100%; max-width: 880px; margin: auto 0;
  background: var(--gradip-surface-elevated); color: var(--gradip-text);
  border: 1px solid var(--gradip-border); border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25); /* sombra do modal: única cor fixa (preto translúcido, igual nos dois temas) */
}
.modal__topo {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding: 18px 20px 14px; border-bottom: 1px solid var(--gradip-border);
}
.modal__titulo { margin: 0; font-size: 20px; line-height: 1.3; }
.modal__subtitulo { margin: 2px 0 0; color: var(--gradip-text-muted); font-size: 14px; }
.modal__fechar {
  flex: 0 0 auto; min-width: 44px; min-height: 44px; border-radius: 8px;
  border: 1px solid var(--gradip-border-strong); background: var(--gradip-surface); color: var(--gradip-text);
  font-size: 20px; cursor: pointer;
}
.modal__fechar:hover { background: var(--gradip-surface-2); }
.modal__corpo { padding: 18px 20px; }
.modal__rodape { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; padding: 14px 20px 18px; border-top: 1px solid var(--gradip-border); }
body.modalAberto { overflow: hidden; }

.secao { margin: 0 0 22px; }
.secao:last-child { margin-bottom: 0; }
.secao__titulo { font-size: 15px; margin: 0 0 10px; text-transform: none; }
.secao__nota { margin: 6px 0 0; font-size: 13px; color: var(--gradip-text-muted); }

.resumoDidatico {
  margin: 0; padding: 12px 14px; border-radius: 8px;
  background: var(--gradip-info-bg); border: 1px solid var(--gradip-info-border); color: var(--gradip-text);
}
.resumoDidatico p { margin: 0 0 6px; }
.resumoDidatico p:last-child { margin-bottom: 0; }

.numeros { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.numero {
  padding: 10px 12px; border-radius: 8px;
  background: var(--gradip-surface); border: 1px solid var(--gradip-border);
}
.numero__valor { font-size: 22px; font-weight: bold; line-height: 1.2; }
.numero__rotulo { font-size: 13px; font-weight: bold; margin-top: 2px; }
.numero__explicacao { font-size: 12.5px; color: var(--gradip-text-muted); margin-top: 3px; }
.numero--vazio .numero__valor { color: var(--gradip-text-muted); font-size: 16px; }

.requisitos { display: grid; gap: 10px; }
.requisitos__hab { padding: 10px 12px; border: 1px solid var(--gradip-border); border-radius: 8px; background: var(--gradip-surface); }
.requisitos__hab h4 { margin: 0 0 6px; font-size: 14px; }
.requisitos__lista { margin: 0; padding: 0; list-style: none; }
.requisitos__lista li { margin: 4px 0; }
.requisitos__conector { display: inline-block; margin: 2px 0; font-size: 12.5px; font-weight: bold; color: var(--gradip-text-muted); text-transform: uppercase; letter-spacing: .03em; }
.linkDisciplina {
  background: transparent; border: 0; padding: 0; color: var(--gradip-link); cursor: pointer;
  text-decoration: underline; text-underline-offset: 2px; min-height: 28px; text-align: left;
}
.linkDisciplina:hover { color: var(--gradip-link-hover); }
.historico { margin: 0; padding: 0; list-style: none; }
.historico li { padding: 8px 0; border-bottom: 1px solid var(--gradip-border); font-size: 14px; }
.historico li:last-child { border-bottom: 0; }

/*---------------- Currículos ----------------*/
.curriculos { display: grid; gap: 16px; }
.curriculo { padding: 18px 20px; }
.curriculo__topo { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.curriculo__nome { margin: 0; font-size: 19px; }
.quadroCh { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
.quadroCh th, .quadroCh td { padding: 7px 10px; border-bottom: 1px solid var(--gradip-border); text-align: right; }
.quadroCh th:first-child, .quadroCh td:first-child { text-align: left; }
.quadroCh thead th { background: var(--gradip-surface-2); }
details.textoLongo { margin-top: 12px; }
details.textoLongo summary { cursor: pointer; font-weight: bold; min-height: 44px; display: flex; align-items: center; color: var(--gradip-link); }
details.textoLongo p { margin: 0 0 10px; max-width: 90ch; }

/*---------------- Histórico ----------------*/
.importacoes { display: grid; gap: 12px; }
.importacao { padding: 14px 16px; }
.importacao__topo { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.importacao__titulo { margin: 0; font-size: 16px; }
.importacao details summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; color: var(--gradip-link); font-weight: bold; }

/*---------------- Importação ----------------*/
.passos { display: flex; gap: 6px; margin: 0 0 16px; padding: 0; list-style: none; flex-wrap: wrap; }
.passos li {
  font-size: 13px; padding: 5px 10px; border-radius: 16px;
  border: 1px solid var(--gradip-border); color: var(--gradip-text-muted); background: var(--gradip-surface);
}
.passos li[aria-current="step"] { border-color: var(--gradip-link); color: var(--gradip-text); font-weight: bold; background: var(--gradip-info-bg); }
.passos li.feito { color: var(--gradip-text); }
.soltarArquivo {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center;
  padding: 26px 16px; border: 2px dashed var(--gradip-border-strong); border-radius: 10px; background: var(--gradip-surface-2);
}
.soltarArquivo.arrastando { border-color: var(--gradip-link); background: var(--gradip-info-bg); }
.soltarArquivo__icone { font-size: 32px; line-height: 1; }
.opcoesArquivo { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 14px; }
.opcoesArquivo > div { padding: 12px 14px; border: 1px solid var(--gradip-border); border-radius: 8px; background: var(--gradip-surface); }
.opcoesArquivo h4 { margin: 0 0 4px; font-size: 14px; }
.opcoesArquivo p { margin: 0; font-size: 13.5px; color: var(--gradip-text-muted); }
/* 1.4.2: CSV e PDF de uma vez — linha "Arquivo 1 de 2" acima da conferência */
.statusSegundo { margin: 0 0 12px; padding: 8px 12px; border-left: 3px solid var(--gradip-info-border); background: var(--gradip-info-bg); border-radius: 4px; }
.barraProgresso { height: 10px; border-radius: 5px; background: var(--gradip-surface-2); border: 1px solid var(--gradip-border); overflow: hidden; }
.barraProgresso__valor { height: 100%; width: 0; background: var(--gradip-primary); transition: width .2s ease; }
.contagens { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin: 8px 0 14px; }
.contagem { padding: 10px 12px; border: 1px solid var(--gradip-border); border-radius: 8px; background: var(--gradip-surface); }
.contagem__valor { font-size: 22px; font-weight: bold; }
.contagem__rotulo { font-size: 13px; color: var(--gradip-text-muted); }
.listaMudancas { margin: 6px 0 0; padding-left: 20px; font-size: 14px; }
.listaMudancas li { margin: 4px 0; overflow-wrap: anywhere; }
details.grupoMudancas { border: 1px solid var(--gradip-border); border-radius: 8px; padding: 0 12px; margin: 0 0 8px; background: var(--gradip-surface); }
details.grupoMudancas summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: bold; }
details.grupoMudancas[open] { padding-bottom: 10px; }

/*---------------- Etapas da preparação (só administradores) ----------------*/
.etapas {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px;
  margin: 0 0 18px;
}
.etapas[hidden] { display: none; }
.etapas__etapa {
  display: flex; align-items: center; gap: 12px; text-align: left;
  min-height: 60px; padding: 10px 14px;
  background: var(--gradip-surface); color: var(--gradip-text);
  border: 1px solid var(--gradip-border-strong); border-radius: 10px; cursor: pointer;
}
.etapas__etapa:hover { background: var(--gradip-surface-2); }
.etapas__etapa[aria-selected="true"] { border: 2px solid var(--gradip-link); background: var(--gradip-info-bg); padding: 9px 13px; }
.etapas__numero {
  flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
