<style>

/*=================================
    ÍCONE DE AJUDA CONTEXTUAL
    ("?" discreto ao lado de um rótulo de campo)
==================================*/

.iconeAjudaContextual{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:16px;
    height:16px;
    border-radius:50%;
    background:var(--gradip-info-bg);
    color:var(--gradip-link);
    font-size:11px;
    font-weight:bold;
    cursor:pointer;
    border:1px solid var(--gradip-info-border);
    margin-left:6px;
    line-height:1;
    vertical-align:middle;
    flex:0 0 auto;
}

.iconeAjudaContextual:hover{
    background:var(--gradip-primary);
    color:var(--gradip-on-primary);
}

.botaoAjudaManual{
    display:flex;
    align-items:center;
    gap:6px;
    padding:9px 14px;
    background:var(--gradip-surface);
    border:1px solid var(--gradip-border-strong);
    color:var(--gradip-text);
    border-radius:6px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
    white-space:nowrap;
}

.botaoAjudaManual:hover{
    border-color:var(--gradip-link);
    color:var(--gradip-link);
    background:var(--gradip-info-bg);
}

/* explicação dinâmica de tipo de grupo (ONE_OF/MIN_COUNT/MIN_CREDITS)
   dentro do modal de Novo Grupo */
.explicacaoTipoGrupo{
    font-size:12px;
    color:var(--gradip-text-muted);
    background:var(--gradip-surface-2);
    border:1px solid var(--gradip-border);
    border-radius:6px;
    padding:8px 12px;
    margin:-6px 0 14px 0;
}

/*=================================
    TELA DE AJUDA — OVERLAY DE PÁGINA INTEIRA
==================================*/

.telaAjudaOverlay{
    position:fixed;
    inset:0;
    z-index:10500;
    background:var(--gradip-bg);
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.cabecalhoAjuda{
    background:var(--gradip-header-bg);
    border-bottom:1px solid var(--gradip-border);
    padding:16px 26px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-shrink:0;
}

.cabecalhoAjuda h1{
    margin:0;
    font-size:18px;
    color:var(--gradip-text);
}

.subtituloAjuda{
    margin:4px 0 0 0;
    font-size:13px;
    color:var(--gradip-text-muted);
}

.corpoAjuda{
    flex:1;
    overflow-y:auto;
    padding:22px 26px 60px 26px;
}

.corpoAjudaConteudoInterno{
    max-width:980px;
    margin:0 auto;
}

.rodapeAjuda{
    text-align:center;
    color:var(--gradip-text-muted);
    font-size:12px;
    padding:10px 0 18px 0;
    flex-shrink:0;
}

/*=================================
    BUSCA
==================================*/

.buscaAjudaContainer{
    margin-bottom:18px;
}

.campoBuscaAjuda{
    width:100%;
    padding:13px 16px;
    border:1.5px solid var(--gradip-link);
    border-radius:8px;
    font-size:15px;
    box-sizing:border-box;
    background:var(--gradip-input-bg);
    color:var(--gradip-input-text);
}

.estadoBuscaVazia{
    text-align:center;
    color:var(--gradip-text-muted);
    padding:50px 20px;
    font-size:14px;
    background:var(--gradip-surface);
    border:1px solid var(--gradip-border);
    border-radius:6px;
}

/*=================================
    AJUDA RÁPIDA (atalhos) + DECISÃO EM 10 SEGUNDOS
==================================*/

.blocoDestacadoAjuda{
    background:var(--gradip-surface);
    border:1px solid var(--gradip-border);
    border-radius:8px;
    padding:18px 20px;
    margin-bottom:18px;
    box-shadow:var(--gradip-shadow);
}

.blocoDestacadoAjuda h2{
    margin:0 0 12px 0;
    font-size:14px;
    color:var(--gradip-link);
    text-transform:uppercase;
    letter-spacing:.03em;
}

.gradeAtalhosAjudaRapida{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:8px;
}

.atalhoAjudaRapida{
    text-align:left;
    padding:10px 14px;
    background:var(--gradip-surface-2);
    border:1px solid var(--gradip-border);
    border-radius:6px;
    font-size:13px;
    color:var(--gradip-text);
    cursor:pointer;
}

.atalhoAjudaRapida:hover{
    border-color:var(--gradip-link);
    background:var(--gradip-info-bg);
}

.cardDecisaoRapida{
    background:var(--gradip-warning-bg);
    border:1.5px solid var(--gradip-warning-border);
    border-radius:8px;
    padding:18px 20px;
    margin-bottom:22px;
}

.cardDecisaoRapida h2{
    margin:0 0 14px 0;
    font-size:15px;
    color:var(--gradip-warning);
}

.linhaDecisaoRapida{
    display:flex;
    align-items:baseline;
    gap:10px;
    padding:8px 0;
    border-bottom:1px dashed var(--gradip-warning-border);
    font-size:14px;
}

.linhaDecisaoRapida:last-child{
    border-bottom:none;
}

.linhaDecisaoRapida .pergunta{
    font-weight:bold;
    color:var(--gradip-text);
    flex:0 0 auto;
}

.linhaDecisaoRapida .resposta{
    color:var(--gradip-link);
    font-weight:bold;
}

/*=================================
    LAYOUT PRINCIPAL: ÍNDICE + CONTEÚDO
==================================*/

.layoutAjudaPrincipal{
    display:flex;
    gap:22px;
    align-items:flex-start;
}

.indiceAjuda{
    flex:0 0 220px;
    position:sticky;
    top:0;
    display:flex;
    flex-direction:column;
    gap:2px;
}

.itemIndiceAjuda{
    text-align:left;
    padding:9px 12px;
    background:none;
    border:none;
    border-radius:6px;
    font-size:13px;
    color:var(--gradip-text-muted);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
}

.itemIndiceAjuda:hover{
    background:var(--gradip-info-bg);
    color:var(--gradip-link);
}

.itemIndiceAjuda.ativo{
    background:var(--gradip-primary);
    color:var(--gradip-on-primary);
    font-weight:bold;
}

.seletorIndiceAjudaMobile{
    display:none;
    width:100%;
    padding:11px 14px;
    border:1px solid var(--gradip-border-strong);
    border-radius:6px;
    font-size:14px;
    margin-bottom:16px;
    box-sizing:border-box;
    background:var(--gradip-input-bg);
    color:var(--gradip-input-text);
}

.conteudoAjudaCategorias{
    flex:1;
    min-width:0;
}

/*=================================
    CATEGORIAS E ITENS (accordion via <details>)
==================================*/

.categoriaAjuda{
    background:var(--gradip-surface);
    border:1px solid var(--gradip-border);
    border-radius:8px;
    padding:18px 20px;
    margin-bottom:18px;
    box-shadow:var(--gradip-shadow);
    scroll-margin-top:10px;
}

.categoriaAjuda.ocultaPorBusca{
    display:none;
}

.tituloCategoriaAjuda{
    margin:0 0 4px 0;
    font-size:16px;
    color:var(--gradip-text);
    display:flex;
    align-items:center;
    gap:8px;
}

.contadorItensCategoria{
    font-size:12px;
    color:var(--gradip-text-muted);
    font-weight:normal;
}

.itemAjuda{
    border-top:1px solid var(--gradip-border);
    padding:4px 0;
}

.itemAjuda.ocultoPorBusca{
    display:none;
}

.itemAjuda summary{
    padding:10px 4px;
    cursor:pointer;
    font-size:14px;
    font-weight:bold;
    color:var(--gradip-text);
    list-style:none;
    display:flex;
    align-items:center;
    gap:8px;
}

.itemAjuda summary::-webkit-details-marker{
    display:none;
}

.itemAjuda summary::before{
    content:"▸";
    color:var(--gradip-link);
    flex:0 0 auto;
    transition:transform .1s;
}

.itemAjuda[open] summary::before{
    transform:rotate(90deg);
}

.itemAjuda summary:hover{
    color:var(--gradip-link);
}

.respostaItemAjuda{
    padding:2px 4px 14px 22px;
    font-size:13.5px;
    color:var(--gradip-text);
    line-height:1.6;
}

.respostaItemAjuda p{
    margin:0 0 10px 0;
}

.respostaItemAjuda p:last-child{
    margin-bottom:0;
}

.respostaItemAjuda ul, .respostaItemAjuda ol{
    margin:0 0 10px 0;
    padding-left:20px;
}

.respostaItemAjuda code{
    background:var(--gradip-surface-2);
    padding:1px 5px;
    border-radius:3px;
    font-size:12.5px;
}

.respostaItemAjuda strong{
    color:var(--gradip-text);
}

.respostaItemAjuda blockquote{
    margin:8px 0;
    padding:8px 12px;
    background:var(--gradip-info-bg);
    border-left:3px solid var(--gradip-link);
    border-radius:0 4px 4px 0;
}

.itemAjuda.destacadoTemporario{
    animation: pulseAjuda 1.6s ease-out 1;
    border-radius:6px;
}

@keyframes pulseAjuda{
    0%   { background:var(--gradip-warning-bg); }
    100% { background:transparent; }
}

/*=================================
    TABELA "AJUDA RÁPIDA POR SITUAÇÃO" e GLOSSÁRIO
==================================*/

.tabelaAjuda{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
    margin:8px 0;
}

.tabelaAjuda th, .tabelaAjuda td{
    text-align:left;
    padding:8px 10px;
    border-bottom:1px solid var(--gradip-border);
}

.tabelaAjuda th{
    color:var(--gradip-link);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.03em;
}

.listaGlossarioAjuda{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:12px;
    margin-top:6px;
}

.termoGlossario{
    background:var(--gradip-surface-2);
    border:1px solid var(--gradip-border);
    border-radius:6px;
    padding:10px 12px;
}

.termoGlossario strong{
    display:block;
    color:var(--gradip-link);
    font-size:13px;
    margin-bottom:3px;
}

.termoGlossario span{
    font-size:12.5px;
    color:var(--gradip-text-muted);
}

/*=================================
    CHECKLISTS VISUAIS (não salvam estado)
==================================*/

.listaChecklistAjuda{
    list-style:none;
    margin:8px 0;
    padding:0;
}

.listaChecklistAjuda li{
    display:flex;
    align-items:flex-start;
    gap:8px;
    padding:6px 0;
    font-size:13.5px;
    color:var(--gradip-text);
}

.listaChecklistAjuda input[type=checkbox]{
    margin-top:2px;
    flex:0 0 auto;
}

/*=================================
    RESPONSIVIDADE
==================================*/

@media (max-width: 760px){

    .cabecalhoAjuda{
        padding:14px 16px;
    }

    .corpoAjuda{
        padding:16px 14px 50px 14px;
    }

    .layoutAjudaPrincipal{
        flex-direction:column;
    }

    .indiceAjuda{
        display:none;
    }

    .seletorIndiceAjudaMobile{
        display:block;
    }

    .gradeAtalhosAjudaRapida{
        grid-template-columns:1fr;
    }

    .listaGlossarioAjuda{
        grid-template-columns:1fr;
    }

    .campoBuscaAjuda{
        font-size:14px;
    }

    .linhaDecisaoRapida{
        flex-direction:column;
        gap:2px;
    }

}

</style>
