<!-- Menu lateral / abas do Painel dos servidores — só apresentação.
     Mesmo modelo do Lunaris_APPSCRIPT 0.4.2 e da Estrutura Curricular
     1.10.0: um único conjunto de botões, reposicionado por CSS conforme
     data-navegacao="sidebar" | "abas" em #painelLayout. Usa apenas tokens
     GRADIP. O brilho/elevação no hover é a mesma exceção visual já
     aprovada na Estrutura Curricular, limitada à navegação. -->
<style>

.somenteLeitor{
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
}

/*---------------- ESCOLHA DO MODO ----------------*/

.painelNavegacaoModos{
    max-width:1240px;
    box-sizing:border-box;
    margin:16px auto 0 auto;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:12px;
}

.painelNavegacaoModos__rotulo{
    margin:0;
    font-size:13px;
    color:var(--gradip-text-muted);
}

.painelNavegacaoModos__grupo{
    display:inline-flex;
    gap:4px;
    padding:4px;
    background:var(--gradip-surface);
    border:1px solid var(--gradip-border);
    border-radius:12px;
}

.painelModo,
.painelMenuMovel{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    min-height:44px;
    padding:8px 14px;
    border:1px solid transparent;
    border-radius:9px;
    background:transparent;
    color:var(--gradip-text-muted);
    font:inherit;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}

.painelModo[aria-pressed="true"]{
    background:var(--gradip-info-bg);
    border-color:var(--gradip-link);
    color:var(--gradip-link);
}

/*---------------- LAYOUT ----------------*/

.painelLayout{
    max-width:1240px;
    box-sizing:border-box;
    margin:0 auto;
    padding:0 20px;
}

.painelLayout[data-navegacao="sidebar"]{
    display:grid;
    grid-template-columns:260px minmax(0, 1fr);
    gap:28px;
    align-items:start;
}

/* Dentro do layout, o #conteudo continua com a largura de leitura de
   antes (900px); o recuo lateral passa a ser do próprio layout. */
.painelLayout #conteudo{
    width:100%;
    box-sizing:border-box;
    margin:16px auto 60px auto;
    padding:0;
}

.painelLayout[data-navegacao="abas"]{
    max-width:940px;
}

/*---------------- MENU LATERAL ----------------*/

.painelSidebar{
    position:sticky;
    top:16px;
    margin-top:16px;
    max-height:calc(100vh - 32px);
    overflow-y:auto;
    box-sizing:border-box;
    padding:16px 12px;
    background:var(--gradip-surface);
    border:1px solid var(--gradip-border);
    border-radius:14px;
    box-shadow:var(--gradip-shadow);
}

.painelSidebar__topo{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:0 6px 10px 6px;
}

.painelSidebar__titulo{
    margin:0;
    font-size:12px;
    font-weight:bold;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--gradip-text-muted);
}

.painelMenuMovel{
    display:none;
    border-color:var(--gradip-border-strong);
    color:var(--gradip-text);
}

.painelMenu{
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:2px;
}

.painelSidebar__apoio{
    margin-top:14px;
    padding:14px 2px 2px 2px;
    border-top:1px solid var(--gradip-border);
}

.painelNavItem{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    min-height:46px;
    box-sizing:border-box;
    padding:6px 10px;
    border:1px solid transparent;
    border-radius:10px;
    background:transparent;
    color:var(--gradip-text);
    font:inherit;
    font-size:14px;
    line-height:1.3;
    text-align:left;
    cursor:pointer;
    transition:transform 180ms ease, box-shadow 180ms ease, background-color 180ms ease, border-color 180ms ease, color 180ms ease;
}

/* Formulários e Regras Curriculares ficam recuados sob Configurações,
   espelhando a hierarquia das telas. */
.painelNavItem--sub{
    width:calc(100% - 18px);
    margin-left:18px;
    font-size:13.5px;
}

.painelNavIcone{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex:0 0 30px;
    width:30px;
    height:30px;
    box-sizing:border-box;
    border:1px solid var(--gradip-info-border);
    border-radius:8px;
    background:var(--gradip-info-bg);
    color:var(--gradip-link);
    pointer-events:none;
}

.painelNavIcone svg{
    display:block;
    width:18px;
    height:18px;
}

.painelNavTexto{
    min-width:0;
    overflow-wrap:anywhere;
}

.painelNavItem[aria-current="page"]{
    background:var(--gradip-info-bg);
    border-color:var(--gradip-link);
    color:var(--gradip-link);
    font-weight:bold;
}

.painelNavItem[aria-current="page"]::before{
    content:"";
    position:absolute;
    left:-1px;
    top:10px;
    bottom:10px;
    width:3px;
    border-radius:3px;
    background:var(--gradip-link);
}

.painelModo .painelNavIcone{
    flex-basis:20px;
    width:20px;
    height:20px;
    border:0;
    background:transparent;
    color:inherit;
}

/*---------------- ABAS ----------------*/

.painelLayout[data-navegacao="abas"] .painelSidebar{
    position:static;
    max-height:none;
    overflow:visible;
    padding:6px;
}

.painelLayout[data-navegacao="abas"] .painelSidebar__topo,
.painelLayout[data-navegacao="abas"] .painelSidebar__apoio{
    display:none;
}

.painelLayout[data-navegacao="abas"] .painelMenu{
    flex-direction:row;
    gap:6px;
    padding:6px 4px 8px 4px;
    overflow-x:auto;
    scroll-padding-inline:8px;
}

.painelLayout[data-navegacao="abas"] .painelNavItem{
    flex:0 0 auto;
    width:auto;
    margin-left:0;
    white-space:nowrap;
    border-bottom-width:3px;
}

.painelLayout[data-navegacao="abas"] .painelNavItem::before{
    display:none;
}

.painelLayout[data-navegacao="abas"] .painelNavItem[aria-selected="true"]{
    background:var(--gradip-info-bg);
    border-color:var(--gradip-info-border);
    border-bottom-color:var(--gradip-link);
    color:var(--gradip-link);
    font-weight:bold;
}

/*---------------- HOVER, FOCO E TRANSIÇÃO ----------------*/

.painelNavItem:focus-visible,
.painelModo:focus-visible,
.painelMenuMovel:focus-visible{
    outline:3px solid var(--gradip-focus);
    outline-offset:2px;
    z-index:1;
}

@media (hover:hover) and (pointer:fine){
    .painelNavItem:hover,
    .painelModo:hover{
        transform:translateY(-3px);
        z-index:1;
        color:var(--gradip-link);
        background:var(--gradip-info-bg);
        border-color:var(--gradip-info-border);
        box-shadow:0 8px 18px rgba(0, 80, 157, .12), 0 0 18px rgba(0, 90, 169, .13);
    }
    :root[data-theme="dark"] .painelNavItem:hover,
    :root[data-theme="dark"] .painelModo:hover{
        box-shadow:0 8px 18px rgba(0, 0, 0, .32), 0 0 20px rgba(102, 181, 242, .18);
    }
    .painelNavItem:active,
    .painelModo:active{
        transform:translateY(-1px);
    }
}

.painelConteudo--transicao{
    animation:painelEntrada 180ms ease-out;
}

@keyframes painelEntrada{
    from{ opacity:.65; transform:translateY(4px); }
    to{ opacity:1; transform:none; }
}

@media (prefers-reduced-motion:reduce){
    .painelNavItem,
    .painelModo{
        transition:none;
        transform:none !important;
    }
    .painelConteudo--transicao{
        animation:none;
    }
}

/*---------------- TELAS ESTREITAS ----------------*/

@media (max-width:900px){
    .painelLayout[data-navegacao="sidebar"]{
        grid-template-columns:minmax(0, 1fr);
        gap:0;
    }
    .painelLayout[data-navegacao="sidebar"] .painelSidebar{
        position:static;
        max-height:none;
        padding:10px;
    }
    .painelLayout[data-navegacao="sidebar"] .painelSidebar__topo{
        padding:0 2px;
    }
    .painelMenuMovel{
        display:inline-flex;
    }
    .painelSidebar[data-recolhido="true"] .painelMenu,
    .painelSidebar[data-recolhido="true"] .painelSidebar__apoio{
        display:none;
    }
    .painelSidebar:not([data-recolhido="true"]) .painelSidebar__topo{
        padding-bottom:10px;
    }
}

@media (max-width:760px){
    .painelNavegacaoModos,
    .painelLayout{
        padding:0 14px;
    }
}

@media (max-width:480px){
    .painelNavegacaoModos{
        flex-wrap:wrap;
        justify-content:flex-start;
        gap:6px;
    }
    .painelNavegacaoModos__rotulo{
        flex-basis:100%;
    }
    .painelNavegacaoModos__grupo{
        width:100%;
        box-sizing:border-box;
    }
    .painelModo{
        flex:1;
        padding:8px;
    }
}

@media print{
    .painelNavegacaoModos,
    .painelSidebar{
        display:none !important;
    }
    .painelLayout[data-navegacao="sidebar"]{
        display:block;
    }
}

</style>
