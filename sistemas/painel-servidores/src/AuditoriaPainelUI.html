<script>
/* Auditoria do Painel dos servidores — o que acontece na página.
   Carregado por último. Não muda nenhuma tela: envolve as funções que
   já existiam (abrirSistema, abrirRuleset, abrirModal...) e escuta
   cliques da ajuda, do tema e do modo de navegação. Os eventos vão em
   lotes para registrarEventosPainel (AuditoriaPainel.gs), que confere
   o acesso e grava e-mail, nome e perfil por conta própria.
   Se a auditoria falhar, o painel segue igual: os eventos ficam na fila
   e são tentados de novo; nada aqui bloqueia o uso. A URL dos sistemas
   não é enviada, só o nome do card. Códigos: aba DICIONARIO. */
(function () {
  'use strict';
  if (window.PainelAuditoria) return;

  var SESSAO = typeof SESSAO_AUDITORIA === 'string' ? SESSAO_AUDITORIA : '';
  var INTERVALO_MS = 10000;
  var MAX_FILA = 200;
  var MAX_LOTE = 50;
  var MAX_ERROS = 10;
  var ESPERA_BUSCA_MS = 1500;

  var fila = [];
  var enviando = false;
  var parado = false;   // conta sem acesso: não insiste
  var falhas = 0;
  var erros = 0;

  function navegador() {
    var ua = navigator.userAgent || '';
    var m = ua.match(/(Edg|OPR|Firefox|Chrome|Version)\/(\d+)/);
    var nome = !m ? 'outro' : m[1] === 'Edg' ? 'Edge' : m[1] === 'OPR' ? 'Opera' : m[1] === 'Version' ? 'Safari' : m[1];
    var so = /Windows/.test(ua) ? 'Windows' : /Android/.test(ua) ? 'Android' : /iPhone|iPad/.test(ua) ? 'iOS' : /Mac OS/.test(ua) ? 'macOS' : /Linux/.test(ua) ? 'Linux' : 'outro';
    return nome + (m ? ' ' + m[2] : '') + ' · ' + so;
  }

  function contexto() {
    return {
      navegador: navegador(),
      largura_tela: window.innerWidth,
      tema: document.documentElement.getAttribute('data-theme') || '',
      modo_navegacao: window.PainelNavegacao ? window.PainelNavegacao.getModo() : ''
    };
  }

  function visivel(id) {
    var el = document.getElementById(id);
    return !!el && el.style.display === 'block';
  }

  function telaAtual() {
    if (!visivel('telaConfiguracoes')) return 'Sistemas';
    if (visivel('configFormularios')) return 'Configurações › Formulários';
    if (visivel('configRegrasCurriculares')) {
      return visivel('painelEditorRuleset') ? 'Configurações › Regras Curriculares › Editor' : 'Configurações › Regras Curriculares';
    }
    return 'Configurações';
  }

  function registrar(evento, campos, urgente) {
    if (parado) return;
    var ev = { evento: evento, tela: telaAtual(), data_hora_navegador: new Date().toISOString() };
    Object.keys(campos || {}).forEach(function (k) { if (campos[k] !== undefined && campos[k] !== null) ev[k] = campos[k]; });
    fila.push(ev);
    if (fila.length > MAX_FILA) fila.splice(0, fila.length - MAX_FILA);
    if (urgente) enviar();
  }

  function enviar() {
    if (enviando || parado || !fila.length || !window.google || !google.script || !google.script.run) return;
    var lote = fila.splice(0, MAX_LOTE);
    enviando = true;
    google.script.run
      .withSuccessHandler(function () {
        enviando = false;
        falhas = 0;
        if (fila.length) enviar();
      })
      .withFailureHandler(function (erro) {
        enviando = false;
        var msg = String(erro && erro.message || erro || '');
        if (/não tem acesso|Não foi possível identificar sua conta/.test(msg)) { parado = true; fila = []; return; }
        if (/não aceito|inválido|grande demais/.test(msg)) return; // lote recusado: descarta
        falhas++;
        fila = lote.concat(fila).slice(-MAX_FILA);
      })
      .registrarEventosPainel({ sessao_id: SESSAO, contexto: contexto(), eventos: lote });
  }

  // Depois de falhas seguidas, espera mais entre as tentativas (até ~2 min).
  var tique = 0;
  setInterval(function () {
    tique++;
    var passo = Math.min(Math.pow(2, falhas), 12);
    if (tique % passo === 0) enviar();
  }, INTERVALO_MS);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') enviar();
  });

  // Envolve uma função global sem mudar o que ela faz.
  function envolver(nome, antes, depois) {
    var original = window[nome];
    if (typeof original !== 'function') return;
    window[nome] = function () {
      var args = arguments;
      try { if (antes) antes.apply(null, args); } catch (e) { /* auditoria nunca atrapalha */ }
      var r = original.apply(this, args);
      try { if (depois) depois.apply(null, args); } catch (e) { /* idem */ }
      return r;
    };
  }

  /*---------------- TELAS ----------------*/

  var ultimaTela = null;
  function conferirTela() {
    var t = telaAtual();
    if (t === ultimaTela) return;
    ultimaTela = t;
    registrar('TELA.ABRIR', { alvo_tipo: 'tela', alvo_id: t });
  }
  envolver('sincronizarNavegacaoPainel_', null, conferirTela);
  envolver('fecharTelaConfiguracoes', null, conferirTela);

  /*---------------- CARDS E BUSCA DE SISTEMAS ----------------*/

  envolver('abrirSistema', function (url) {
    var lista = typeof SISTEMAS !== 'undefined' ? SISTEMAS : [];
    var s = lista.filter(function (x) { return x.url === url; })[0];
    registrar('CARD.ABRIR', { alvo_tipo: 'sistema', alvo_id: s ? s.nome : '(sem nome)' }, true);
  });

  var esperaBusca = null;
  envolver('filtrarSistemas', null, function () {
    clearTimeout(esperaBusca);
    esperaBusca = setTimeout(function () {
      var caixa = document.getElementById('caixaBusca');
      var termo = caixa ? caixa.value.trim() : '';
      if (!termo) return;
      var n = document.querySelectorAll('#listaCategorias .cardSistema').length;
      registrar('BUSCA.SISTEMAS', { mensagem: termo, detalhes: { resultados: n } });
    }, ESPERA_BUSCA_MS);
  });

  /*---------------- FORMULÁRIOS ----------------*/

  var formularioAberto = null;
  function abriuFormulario() {
    var f = typeof formularioEmEdicao !== 'undefined' ? formularioEmEdicao : null;
    formularioAberto = { nome: f && f.indicador ? f.indicador : '', desde: Date.now() };
    registrar('FORMULARIO.ABRIR', { alvo_tipo: 'formulario', alvo_id: formularioAberto.nome });
  }
  function fechouFormulario() {
    if (!formularioAberto) return;
    registrar('FORMULARIO.FECHAR', { alvo_tipo: 'formulario', alvo_id: formularioAberto.nome, duracao_ms: Date.now() - formularioAberto.desde });
    formularioAberto = null;
  }
  ['abrirModalConfigFormulario', 'abrirModalColacao', 'abrirModalExclusaoDisciplinas'].forEach(function (n) { envolver(n, null, abriuFormulario); });
  ['fecharModalConfigFormulario', 'fecharModalColacao', 'fecharModalExclusaoDisciplinas'].forEach(function (n) { envolver(n, fechouFormulario); });

  /*---------------- REGRAS CURRICULARES ----------------*/

  function rulesetAberto() {
    return typeof rulesetEmEdicao !== 'undefined' && rulesetEmEdicao && rulesetEmEdicao.ruleset ? rulesetEmEdicao.ruleset.ruleset_id : '';
  }
  envolver('abrirRuleset', function (id) { registrar('RULESET.ABRIR', { alvo_tipo: 'ruleset', alvo_id: id }); });
  envolver('selecionarTabRuleset', function (aba) { registrar('RULESET.ABA', { alvo_tipo: 'ruleset', alvo_id: rulesetAberto(), mensagem: aba }); });
  envolver('abrirModalHistoricoRevisoes', function () { registrar('RULESET.HISTORICO', { alvo_tipo: 'ruleset', alvo_id: rulesetAberto() }); });
  [['abrirModalRequisito', 'requisito'], ['abrirModalDisciplina', 'disciplina'], ['abrirModalGrupo', 'grupo'],
   ['abrirModalOutroCurriculo', 'outro currículo'], ['abrirModalCorrigirAtivo', 'corrigir ruleset ativo']].forEach(function (par) {
    envolver(par[0], function (item) {
      var id = item && (item.requisito_id || item.regra_disciplina_id || item.grupo_id);
      registrar('JANELA.ABRIR', { alvo_tipo: 'janela', alvo_id: par[1], mensagem: id ? 'editar ' + id : (par[0].indexOf('Outro') > -1 || par[0].indexOf('Corrigir') > -1 ? '' : 'novo'), detalhes: { ruleset: rulesetAberto() } });
    });
  });

  /*---------------- AJUDA, TEMA E NAVEGAÇÃO ----------------*/

  document.addEventListener('click', function (e) {
    var alvo = e.target && e.target.closest ? e.target : null;
    if (!alvo) return;
    var abrir = alvo.closest('[data-gradip-help-open]');
    if (abrir) { registrar('AJUDA.ABRIR', { alvo_tipo: 'ajuda', alvo_id: abrir.getAttribute('data-gradip-help-open') || '(início)' }); return; }
    var faq = alvo.closest('[data-gradip-help-faq-toggle]');
    if (faq) {
      registrar('AJUDA.FAQ', { alvo_tipo: 'faq', alvo_id: faq.getAttribute('aria-controls') || '', mensagem: faq.textContent.trim().slice(0, 150),
        detalhes: { aberta: faq.getAttribute('aria-expanded') === 'true' } });
      return;
    }
    var modo = alvo.closest('[data-painel-modo]');
    if (modo) registrar('NAVEGACAO.MODO', { alvo_tipo: 'modo', alvo_id: modo.getAttribute('data-painel-modo') });
  });

  var esperaAjuda = null;
  document.addEventListener('input', function (e) {
    if (!e.target || e.target.id !== 'gradip-help-search') return;
    clearTimeout(esperaAjuda);
    esperaAjuda = setTimeout(function () {
      var termo = e.target.value.trim();
      if (!termo) return;
      var status = document.querySelector('[data-gradip-help-search-status]');
      registrar('AJUDA.BUSCAR', { alvo_tipo: 'ajuda', mensagem: termo, detalhes: { resultado: status ? status.textContent.trim().slice(0, 120) : '' } });
    }, ESPERA_BUSCA_MS);
  });

  var preferencia = document.documentElement.getAttribute('data-theme-preference');
  new MutationObserver(function () {
    var nova = document.documentElement.getAttribute('data-theme-preference');
    if (nova === preferencia) return;
    registrar('TEMA.TROCAR', { alvo_tipo: 'tema', alvo_id: nova, detalhes: { antes: preferencia, tema_resolvido: document.documentElement.getAttribute('data-theme') } });
    preferencia = nova;
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme-preference'] });

  /*---------------- ERROS DE JAVASCRIPT ----------------*/

  function erroNavegador(mensagem, origem) {
    if (++erros > MAX_ERROS) return;
    registrar('ERRO.NAVEGADOR', { mensagem: String(mensagem || '').slice(0, 300), detalhes: origem });
  }
  window.addEventListener('error', function (e) {
    erroNavegador(e.message, { arquivo: String(e.filename || '').split('/').pop().slice(0, 60), linha: e.lineno, coluna: e.colno });
  });
  window.addEventListener('unhandledrejection', function (e) {
    erroNavegador(e.reason && e.reason.message ? e.reason.message : e.reason, { tipo: 'promessa' });
  });

  /*---------------- ABERTURA ----------------*/

  function abriu() {
    ultimaTela = telaAtual();
    registrar('ACESSO.ABRIR', {
      alvo_tipo: 'pagina', alvo_id: 'Painel',
      duracao_ms: window.performance && performance.now ? Math.round(performance.now()) : undefined,
      detalhes: { papel: typeof PAPEL_USUARIO !== 'undefined' ? PAPEL_USUARIO : '', preferencia_tema: preferencia }
    }, true);
  }
  if (document.readyState === 'complete') abriu(); else window.addEventListener('load', abriu);

  window.PainelAuditoria = Object.freeze({
    sessao: SESSAO,
    registrar: registrar,
    enviar: enviar,
    fila: function () { return fila.slice(); },
    enviando: function () { return enviando; }
  });
})();
</script>
