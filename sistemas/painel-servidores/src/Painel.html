function iniciar() {
    renderizarSistemas(SISTEMAS);
    // Contagem de pendências busca as planilhas no servidor — roda em
    // paralelo, sem travar o carregamento inicial da lista. Se algo
    // falhar (planilha fora do ar etc.), os badges simplesmente
    // continuam ocultos em vez de quebrar a página.
    google.script.run
        .withSuccessHandler(aplicarContadoresPendencia)
        .withFailureHandler(err => console.log("Falha ao buscar pendências:", err))
        .obterContadoresPendencias();
}

// Monta, a partir do array SISTEMAS, um mapa chave -> {rotuloSingular,
// rotuloPlural} pra badges que definiram texto customizado — os que
// não definiram (chaveContador simples) caem no fallback genérico.
function montarMapaRotulosBadges_() {
    const mapa = {};
    SISTEMAS.forEach(sistema => {
        if (sistema.chavesContador) {
            sistema.chavesContador.forEach(def => {
                if (def.rotuloSingular || def.rotuloPlural) mapa[def.chave] = def;
            });
        }
    });
    return mapa;
}

// Só mexe nos badges que existem na tela (sistema.chaveContador ou
// alguma entrada de sistema.chavesContador correspondente) — chaves
// desconhecidas ou sem card são ignoradas.
function aplicarContadoresPendencia(contadores) {

    if (!contadores) return;

    const mapaRotulos = montarMapaRotulosBadges_();

    Object.keys(contadores).forEach(chave => {

        const badge = document.getElementById("badge-" + chave);
        if (!badge) return;

        const qtd = Number(contadores[chave]) || 0;
        if (qtd === 0) return;

        const def = mapaRotulos[chave];

        if (def) {
            badge.textContent = qtd === 1
                ? def.rotuloSingular
                : def.rotuloPlural.replace("{n}", qtd);
        } else {
            badge.textContent = qtd === 1
                ? "1 solicitação pendente"
                : `${qtd} solicitações pendentes`;
        }

        badge.style.display = "inline-block";

    });

}

function abrirSistema(url) {
    window.open(url, "_blank", "noopener,noreferrer");
}

function filtrarSistemas() {

    const termo = document.getElementById("caixaBusca").value.trim().toLowerCase();

    if (!termo) {
        renderizarSistemas(SISTEMAS);
        return;
    }

    const filtrados = SISTEMAS.filter(s =>
        s.nome.toLowerCase().includes(termo) ||
        s.descricao.toLowerCase().includes(termo) ||
        s.categoria.toLowerCase().includes(termo)
    );

    renderizarSistemas(filtrados);

}

// Monta tudo via createElement/textContent — nome, descrição e
// categoria de cada sistema nunca viram HTML bruto, mesmo vindo de
// um array editado à mão por qualquer pessoa da equipe no futuro.
function renderizarSistemas(sistemas) {

    const container = document.getElementById("listaCategorias");
    container.innerHTML = "";

    if (sistemas.length === 0) {
        const vazio = document.createElement("div");
        vazio.className = "vazio";
        vazio.textContent = "Nenhum sistema encontrado.";
        container.appendChild(vazio);
        return;
    }

    const categorias = [];
    sistemas.forEach(s => {
        if (categorias.indexOf(s.categoria) === -1) categorias.push(s.categoria);
    });

    categorias.forEach(categoria => {

        const grupo = document.createElement("div");
        grupo.className = "grupoCategoria";

        const tituloCategoria = document.createElement("div");
        tituloCategoria.className = "tituloCategoria";
        tituloCategoria.textContent = categoria;
        grupo.appendChild(tituloCategoria);

        const lista = document.createElement("div");
        lista.className = "listaSistemas";

        sistemas.filter(s => s.categoria === categoria).forEach(sistema => {

            const card = document.createElement("div");
            card.className = "cardSistema" + (sistema.ativo ? "" : " desabilitado");

            const icone = document.createElement("div");
            icone.className = "iconeSistema";
            icone.textContent = sistema.icone || "🔗";

            const info = document.createElement("div");
            info.className = "infoSistema";

            const nomeEl = document.createElement("strong");
            nomeEl.textContent = sistema.nome;
            info.appendChild(nomeEl);

            const descEl = document.createElement("div");
            descEl.textContent = sistema.descricao || "";
            info.appendChild(descEl);

            card.appendChild(icone);
            card.appendChild(info);

            if (sistema.chavesContador) {
                const grupoBadges = document.createElement("div");
                grupoBadges.className = "gruposBadges";
                sistema.chavesContador.forEach(def => {
                    const badgePendencia = document.createElement("div");
                    badgePendencia.className = "badgePendencia" + (def.estilo ? " " + def.estilo : "");
                    badgePendencia.id = "badge-" + def.chave;
                    grupoBadges.appendChild(badgePendencia);
                });
                card.appendChild(grupoBadges);
            } else if (sistema.chaveContador) {
                const badgePendencia = document.createElement("div");
                badgePendencia.className = "badgePendencia";
                badgePendencia.id = "badge-" + sistema.chaveContador;
                card.appendChild(badgePendencia);
            }

            if (sistema.ativo && sistema.url) {
                const seta = document.createElement("div");
                seta.className = "setaSistema";
                seta.textContent = "→";
                card.appendChild(seta);
                card.onclick = () => abrirSistema(sistema.url);
            } else {
                const badge = document.createElement("div");
                badge.className = "badgeEmBreve";
                badge.textContent = "Em breve";
                card.appendChild(badge);
            }

            lista.appendChild(card);

        });

        grupo.appendChild(lista);
        container.appendChild(grupo);

    });

}

iniciar();

/*=====================================================
  NAVEGAÇÃO ⚙️ CONFIGURAÇÕES
  (landing com 2 cards -> Formulários / Regras Curriculares
  — cada sub-tela mora no seu próprio partial e usa
  .subTelaConfig pra entrar/sair dentro do mesmo container,
  então "Voltar" de qualquer sub-tela sempre devolve pro
  landing de Configurações, não direto pro dashboard)
=====================================================*/

function abrirTelaConfiguracoes() {
    document.getElementById("telaListaSistemas").style.display = "none";
    document.getElementById("telaConfiguracoes").style.display = "block";
    abrirSubTelaConfig("configHome");
}

function fecharTelaConfiguracoes() {
    document.getElementById("telaConfiguracoes").style.display = "none";
    document.getElementById("telaListaSistemas").style.display = "block";
}

// idSubTela: "configHome" | "configFormularios" | "configRegrasCurriculares"
function abrirSubTelaConfig(idSubTela) {
    document.querySelectorAll(".subTelaConfig").forEach(el => {
        el.style.display = (el.id === idSubTela) ? "block" : "none";
    });
}

/*=====================================================
  CAMPOS DE DATA/HORA — digitação com máscara + ícone que
  abre o seletor nativo do navegador (input date/time
  escondido, só usado como picker). Compartilhado por
  Formulários e Regras Curriculares.
=====================================================*/

function aplicarMascaraData(input) {
    let digitos = input.value.replace(/\D/g, "").slice(0, 8);
    let formatado = digitos;
    if (digitos.length > 4) formatado = `${digitos.slice(0,2)}/${digitos.slice(2,4)}/${digitos.slice(4)}`;
    else if (digitos.length > 2) formatado = `${digitos.slice(0,2)}/${digitos.slice(2)}`;
    input.value = formatado;
}

function aplicarMascaraHora(input) {
    let digitos = input.value.replace(/\D/g, "").slice(0, 4);
    let formatado = digitos;
    if (digitos.length > 2) formatado = `${digitos.slice(0,2)}:${digitos.slice(2)}`;
    input.value = formatado;
}

function abrirSeletor(idInputOculto) {
    const input = document.getElementById(idInputOculto);
    if (!input) return;
    if (typeof input.showPicker === "function") {
        try { input.showPicker(); return; } catch (e) { /* cai no fallback abaixo */ }
    }
    input.focus();
    input.click();
}

// input[type=date] devolve sempre aaaa-mm-dd — convertemos pro
// formato dd/mm/aaaa que o campo de texto usa.
function aplicarDataDoPicker(idCampoTexto, valorIso) {
    if (!valorIso) return;
    const [ano, mes, dia] = valorIso.split("-");
    document.getElementById(idCampoTexto).value = `${dia}/${mes}/${ano}`;
}

// input[type=time] já devolve hh:mm — só repassa pro campo de texto.
function aplicarHoraDoPicker(idCampoTexto, valorHora) {
    if (!valorHora) return;
    document.getElementById(idCampoTexto).value = valorHora;
}

/*=====================================================
  HELPERS GENÉRICOS DE MODAL — aviso de erro e estado de
  botão "Salvando..." — reaproveitados por Formulários e
  por Regras Curriculares pra manter o mesmo padrão de UX
  (Instruções.txt item 27).
=====================================================*/

function mostrarAvisoModal_(idElementoAviso, texto) {
    const el = document.getElementById(idElementoAviso);
    if (!el) return;
    el.textContent = texto;
    el.style.display = "block";
}

function esconderAvisoModal_(idElementoAviso) {
    const el = document.getElementById(idElementoAviso);
    if (el) el.style.display = "none";
}

function extrairMensagemErro_(erro) {
    return (erro && erro.message) || String(erro);
}

// Desabilita um botão e troca seu texto (ex: "Salvando..."); devolve
// uma função "restaurar" que volta o botão ao estado original —
// chame-a tanto no sucesso quanto no erro.
function travarBotao_(botao, textoEnquantoTrava) {
    const textoOriginal = botao.textContent;
    botao.disabled = true;
    botao.textContent = textoEnquantoTrava;
    return () => {
        botao.disabled = false;
        botao.textContent = textoOriginal;
    };
}
