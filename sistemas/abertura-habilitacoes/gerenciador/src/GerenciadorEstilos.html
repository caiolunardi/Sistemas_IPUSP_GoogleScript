<!-- Gerenciador de Abertura de Habilitações — estilos.
     Só tokens de GradipTema.html (nenhuma cor fixa nova). Cabeçalho, menu
     lateral/abas, cards e hover seguem o Painel dos servidores e a Estrutura
     Curricular: brilho/elevação discretos só na navegação e nos cards
     clicáveis (mesma exceção visual aprovada lá), desligados com
     prefers-reduced-motion. -->
<style>
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:1.45; background:var(--gradip-bg); color:var(--gradip-text); }
button,input,textarea,select{ font:inherit; }
[hidden]{ display:none !important; }

.somenteLeitor{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
.pularParaConteudo{ position:absolute; left:12px; top:-60px; z-index:20000; padding:10px 14px; border-radius:8px; background:var(--gradip-primary); color:var(--gradip-on-primary); font-weight:bold; }
.pularParaConteudo:focus{ top:12px; outline:3px solid var(--gradip-focus); outline-offset:2px; }

/*---------------- CABEÇALHO ----------------*/
#headerSistema{ background:var(--gradip-header-bg); min-height:72px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 22px; border-bottom:1px solid var(--gradip-border); }
.logoEsquerda{ display:flex; align-items:center; gap:15px; min-width:0; }
.logoEsquerda .marcaIpuspSvg{ height:52px; flex:0 0 auto; }
.tituloBloco{ min-width:0; }
.tituloSistema{ font-size:17px; font-weight:bold; color:var(--gradip-text); overflow-wrap:anywhere; }
.subtituloSistema{ font-size:13px; color:var(--gradip-text-muted); margin-top:2px; }
.grupoDireitaHeader{ display:flex; align-items:center; gap:14px; flex:0 0 auto; }
/* Quem está usando: nome e observação da aba de acesso (Acesso.gs). */
.identificacaoUsuario{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; align-items:center; text-align:center; line-height:1.3; }
.identificacaoUsuario[hidden]{ display:none; }
.identificacaoUsuario__nome{ max-width:100%; font-size:15px; font-weight:bold; color:var(--gradip-text); overflow-wrap:anywhere; }
.identificacaoUsuario__descricao{ max-width:100%; font-size:13px; color:var(--gradip-text-muted); overflow-wrap:anywhere; }
.identificacaoUsuario__descricao:empty{ display:none; }
.logoUSP{ height:44px; width:auto; flex:0 0 auto; }
.logoUSPWrap{ display:flex; align-items:center; flex:0 0 auto; }
.barraAzul{ height:6px; background:var(--gradip-header-accent); }
.botaoAjuda{ display:flex; align-items:center; justify-content:center; gap:6px; min-width:44px; min-height:44px; padding:8px 14px; border:1px solid var(--gradip-info-border); border-radius:22px; background:var(--gradip-info-bg); color:var(--gradip-link); font-size:13px; font-weight:bold; cursor:pointer; white-space:nowrap; }
.botaoAjuda:hover{ border-color:var(--gradip-link); color:var(--gradip-link-hover); }
.botaoAjuda:focus-visible{ outline:3px solid var(--gradip-focus); outline-offset:2px; }

.iconeBotao, .navIcone, .campoBusca__icone{ display:inline-flex; align-items:center; justify-content:center; pointer-events:none; }
.iconeBotao svg{ width:18px; height:18px; display:block; }

/*---------------- FAIXAS DE AVISO ----------------*/
.faixaAviso{ max-width:1240px; margin:16px auto 0; padding:12px 16px; border:1px solid var(--gradip-info-border); border-left-width:4px; border-radius:8px; background:var(--gradip-info-bg); color:var(--gradip-text); font-size:14px; }
.faixaAviso--homologacao{ border-color:var(--gradip-warning-border); background:var(--gradip-warning-bg); }
.faixaAviso .linkAjudaContextual{ margin-left:6px; }

/*---------------- MODOS DE NAVEGAÇÃO ----------------*/
.navegacaoModos{ max-width:1240px; margin:16px auto 0; padding:0 20px; display:flex; align-items:center; justify-content:flex-end; gap:12px; }
.navegacaoModos__rotulo{ margin:0; font-size:13px; color:var(--gradip-text-muted); }
.navegacaoModos__grupo{ display:inline-flex; gap:4px; padding:4px; background:var(--gradip-surface); border:1px solid var(--gradip-border); border-radius:12px; }
.botaoModo, .menuMovel{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:8px 14px; border:1px solid transparent; border-radius:9px; background:transparent; color:var(--gradip-text-muted); font-size:13px; font-weight:bold; cursor:pointer; }
.botaoModo[aria-pressed="true"]{ background:var(--gradip-info-bg); border-color:var(--gradip-link); color:var(--gradip-link); }

/*---------------- LAYOUT ----------------*/
.layout{ max-width:1240px; margin:0 auto; padding:0 20px; }
.layout[data-navegacao="sidebar"]{ display:grid; grid-template-columns:250px minmax(0,1fr); gap:28px; align-items:start; }
#conteudo{ min-width:0; margin:16px 0 60px; outline:none; }

.sidebar{ position:sticky; top:16px; margin-top:16px; max-height:calc(100vh - 32px); overflow-y:auto; padding:16px 12px; background:var(--gradip-surface); border:1px solid var(--gradip-border); border-radius:14px; box-shadow:var(--gradip-shadow); }
.sidebar__topo{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 6px 10px; }
.sidebar__titulo{ margin:0; font-size:12px; font-weight:bold; text-transform:uppercase; letter-spacing:.05em; color:var(--gradip-text-muted); }
.menuMovel{ display:none; border-color:var(--gradip-border-strong); color:var(--gradip-text); }
.menuAreas{ display:flex; flex-direction:column; gap:6px; padding:2px; }
.sidebar__apoio{ margin-top:14px; padding:14px 2px 2px; border-top:1px solid var(--gradip-border); }

.navItem{ position:relative; display:flex; align-items:center; gap:10px; width:100%; min-height:46px; padding:6px 10px; border:1px solid transparent; border-radius:10px; background:transparent; color:var(--gradip-text); font-size:14px; line-height:1.3; text-align:left; cursor:pointer; transition:transform 180ms ease, box-shadow 180ms ease, background-color 180ms ease, border-color 180ms ease, color 180ms ease; }
.navIcone{ flex:0 0 30px; width:30px; height:30px; border:1px solid var(--gradip-info-border); border-radius:8px; background:var(--gradip-info-bg); color:var(--gradip-link); }
.navIcone svg{ width:18px; height:18px; display:block; }
.navTexto{ min-width:0; overflow-wrap:anywhere; flex:1 1 auto; }
.navContagem{ flex:0 0 auto; min-width:28px; padding:2px 8px; border-radius:12px; background:var(--gradip-surface-2); border:1px solid var(--gradip-border); color:var(--gradip-text); font-size:12px; font-weight:bold; text-align:center; }
.navContagem:empty{ display:none; }
.navItem[aria-current="page"]{ background:var(--gradip-info-bg); border-color:var(--gradip-link); color:var(--gradip-link); font-weight:bold; }
.navItem[aria-current="page"]::before{ content:""; position:absolute; left:-1px; top:10px; bottom:10px; width:3px; border-radius:3px; background:var(--gradip-link); }

.layout[data-navegacao="abas"] .sidebar{ position:static; max-height:none; overflow:visible; padding:6px; }
.layout[data-navegacao="abas"] .sidebar__topo,
.layout[data-navegacao="abas"] .sidebar__apoio{ display:none; }
.layout[data-navegacao="abas"] .menuAreas{ flex-direction:row; gap:6px; padding:6px 4px 8px; overflow-x:auto; }
.layout[data-navegacao="abas"] .navItem{ flex:0 0 auto; width:auto; white-space:nowrap; border-bottom-width:3px; }
.layout[data-navegacao="abas"] .navItem::before{ display:none; }
.layout[data-navegacao="abas"] .navItem[aria-selected="true"]{ background:var(--gradip-info-bg); border-color:var(--gradip-info-border); border-bottom-color:var(--gradip-link); color:var(--gradip-link); font-weight:bold; }

.navItem:focus-visible, .botaoModo:focus-visible, .menuMovel:focus-visible{ outline:3px solid var(--gradip-focus); outline-offset:2px; z-index:1; }

.conteudo--transicao{ animation:entradaArea 180ms ease-out; }
@keyframes entradaArea{ from{ opacity:.65; transform:translateY(4px); } to{ opacity:1; transform:none; } }

/*---------------- ÁREAS ----------------*/
.cardResumo{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 20px; margin-bottom:16px; background:var(--gradip-surface); border:1px solid var(--gradip-border); border-radius:12px; box-shadow:var(--gradip-shadow); }
.cardResumo h1{ margin:0; font-size:19px; color:var(--gradip-text); }
.cardResumo p{ margin:4px 0 0; font-size:14px; color:var(--gradip-text-muted); }
.contador{ flex:0 0 auto; min-width:56px; padding:8px 16px; border-radius:22px; background:var(--gradip-primary); color:var(--gradip-on-primary); font-size:20px; font-weight:bold; text-align:center; }

.barraFerramentas{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px; margin:0 0 8px; }
.barraFerramentas__acoes{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.campoBusca{ flex:1 1 320px; min-width:0; }
.campoBusca label{ display:block; margin-bottom:6px; font-size:13px; font-weight:bold; color:var(--gradip-text); }
.campoBusca__linha{ position:relative; }
.campoBusca__icone{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--gradip-text-muted); }
.campoBusca__icone svg{ width:18px; height:18px; display:block; }
.campoBusca input{ width:100%; min-height:44px; padding:10px 12px 10px 40px; border:1px solid var(--gradip-border-strong); border-radius:8px; background:var(--gradip-input-bg); color:var(--gradip-input-text); }
input::placeholder, textarea::placeholder{ color:var(--gradip-input-placeholder); }
input:focus-visible, textarea:focus-visible{ outline:3px solid var(--gradip-focus); outline-offset:1px; }
.statusLista{ min-height:20px; margin:0 0 10px; font-size:13px; color:var(--gradip-text-muted); }

/*---------------- BOTÕES ----------------*/
.botaoPrimario, .botaoSecundario{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 16px; border-radius:8px; font-weight:bold; cursor:pointer; }
.botaoPrimario{ border:1px solid transparent; background:var(--gradip-primary); color:var(--gradip-on-primary); }
.botaoPrimario:hover:not(:disabled){ background:var(--gradip-primary-hover); }
.botaoSecundario{ border:1px solid var(--gradip-border-strong); background:var(--gradip-surface); color:var(--gradip-text); }
.botaoSecundario:hover:not(:disabled){ background:var(--gradip-surface-2); border-color:var(--gradip-link); }
.botaoPrimario:disabled, .botaoSecundario:disabled{ background:var(--gradip-disabled-bg); color:var(--gradip-disabled-text); border-color:var(--gradip-border); cursor:not-allowed; }
.botaoPrimario:focus-visible, .botaoSecundario:focus-visible, .linkAjudaContextual:focus-visible, .botaoDica:focus-visible, .botaoFechar:focus-visible{ outline:3px solid var(--gradip-focus); outline-offset:2px; }
.linkAjudaContextual{ min-height:44px; padding:0 6px; border:0; background:transparent; color:var(--gradip-link); font-size:13px; font-weight:bold; text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
.linkAjudaContextual:hover{ color:var(--gradip-link-hover); }
.botaoDica{ flex:0 0 auto; width:32px; height:32px; margin:-6px 0; border:1px solid var(--gradip-info-border); border-radius:50%; background:var(--gradip-info-bg); color:var(--gradip-link); font-weight:bold; cursor:pointer; position:relative; }
/* Alvo de toque de ~44 px sem aumentar o círculo. */
.botaoDica::after{ content:""; position:absolute; inset:-6px; }

/*---------------- LISTAS DE PEDIDOS ----------------*/
.listaPedidos{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.cartaoPedido{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 18px; background:var(--gradip-surface); color:var(--gradip-text); border:1px solid var(--gradip-border); border-radius:10px; box-shadow:var(--gradip-shadow); text-align:left; }
button.cartaoPedido{ cursor:pointer; transition:transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease; }
button.cartaoPedido:focus-visible{ outline:3px solid var(--gradip-focus); outline-offset:2px; }
.cartaoPedido__info{ flex:1 1 auto; min-width:0; }
.cartaoPedido__nome{ display:block; font-size:15px; font-weight:bold; overflow-wrap:anywhere; }
.cartaoPedido__meta{ display:block; margin-top:3px; font-size:13px; color:var(--gradip-text-muted); overflow-wrap:anywhere; }
.cartaoPedido__email{ display:block; margin-top:4px; font-size:13px; font-weight:bold; color:var(--gradip-success); }
.cartaoPedido__lado{ display:flex; flex-wrap:wrap; justify-content:flex-end; align-items:center; gap:8px; flex:0 0 auto; max-width:50%; }
.cartaoPedido--inerte{ border-style:dashed; }

.selo{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border:1px solid; border-radius:14px; font-size:12px; font-weight:bold; line-height:1.3; }
.selo::before{ content:""; width:8px; height:8px; border-radius:50%; background:currentColor; flex:0 0 auto; }
.selo--pendente{ background:var(--gradip-warning-bg); border-color:var(--gradip-warning-border); color:var(--gradip-warning); }
.selo--concluido{ background:var(--gradip-success-bg); border-color:var(--gradip-success-border); color:var(--gradip-success); }
.selo--problema{ background:var(--gradip-danger-bg); border-color:var(--gradip-danger-border); color:var(--gradip-danger); }
.selo--origem{ background:var(--gradip-info-bg); border-color:var(--gradip-info-border); color:var(--gradip-link); }
.selo--origem::before{ display:none; }

@media (hover:hover) and (pointer:fine){
  .navItem:hover, .botaoModo:hover{ transform:translateY(-3px); z-index:1; color:var(--gradip-link); background:var(--gradip-info-bg); border-color:var(--gradip-info-border); box-shadow:0 8px 18px rgba(0, 80, 157, .12), 0 0 18px rgba(0, 90, 169, .13); }
  button.cartaoPedido:hover{ transform:translateY(-2px); border-color:var(--gradip-link); box-shadow:0 8px 18px rgba(0, 80, 157, .12), 0 0 16px rgba(0, 90, 169, .12); }
  :root[data-theme="dark"] .navItem:hover, :root[data-theme="dark"] .botaoModo:hover, :root[data-theme="dark"] button.cartaoPedido:hover{ box-shadow:0 8px 18px rgba(0, 0, 0, .32), 0 0 20px rgba(102, 181, 242, .18); }
  .navItem:active, .botaoModo:active, button.cartaoPedido:active{ transform:translateY(-1px); }
}

/*---------------- ESTADOS (carregando, vazio, erro) ----------------*/
.estadoArea:empty{ display:none; }
.estadoArea{ margin:0 0 12px; }
.carregando{ display:flex; align-items:center; gap:12px; padding:22px; background:var(--gradip-surface); border:1px solid var(--gradip-border); border-radius:10px; color:var(--gradip-text-muted); }
.carregando::before{ content:""; width:20px; height:20px; border-radius:50%; border:3px solid var(--gradip-border); border-top-color:var(--gradip-link); animation:girar 0.9s linear infinite; flex:0 0 auto; }
@keyframes girar{ to{ transform:rotate(360deg); } }
.vazio{ padding:40px 20px; text-align:center; color:var(--gradip-text-muted); background:var(--gradip-surface); border:1px dashed var(--gradip-border-strong); border-radius:10px; }
.alerta{ padding:12px 14px; border:1px solid; border-left-width:4px; border-radius:8px; color:var(--gradip-text); }
.alerta strong{ display:block; margin-bottom:4px; }
.alerta p{ margin:0 0 8px; }
.alerta p:last-child{ margin-bottom:0; }
.alerta .botaoSecundario, .alerta .linkAjudaContextual{ margin-top:6px; margin-right:8px; }
.alerta--erro{ background:var(--gradip-danger-bg); border-color:var(--gradip-danger-border); }
.alerta--erro strong{ color:var(--gradip-danger); }
.alerta--aviso{ background:var(--gradip-warning-bg); border-color:var(--gradip-warning-border); }
.alerta--aviso strong{ color:var(--gradip-warning); }
.alerta--sucesso{ background:var(--gradip-success-bg); border-color:var(--gradip-success-border); }
.alerta--sucesso strong{ color:var(--gradip-success); }
.alerta--info{ background:var(--gradip-info-bg); border-color:var(--gradip-info-border); }

/*---------------- RELATÓRIOS ----------------*/
.gradeRelatorios{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:16px; }
.blocoRelatorio{ padding:18px 20px; background:var(--gradip-surface); border:1px solid var(--gradip-border); border-radius:12px; min-width:0; }
.blocoRelatorio--largo{ grid-column:1 / -1; }
.blocoRelatorio h2{ margin:0 0 14px; padding-bottom:6px; border-bottom:2px solid var(--gradip-info-border); font-size:14px; text-transform:uppercase; letter-spacing:.03em; color:var(--gradip-link); }
.blocoRelatorio p.totalGrande{ margin:4px 0 8px; font-size:36px; line-height:1.1; font-weight:bold; color:var(--gradip-link); }
.blocoRelatorio p{ margin:4px 0 0; font-size:13px; color:var(--gradip-text-muted); }
.listaBarras{ list-style:none; margin:0; padding:0; }
.linhaBarra{ margin-bottom:10px; }
.linhaBarra__rotulo{ display:flex; justify-content:space-between; gap:12px; font-size:14px; margin-bottom:4px; }
.linhaBarra__rotulo span:last-child{ font-weight:bold; }
.linhaBarra__trilha{ height:8px; border-radius:4px; background:var(--gradip-surface-2); border:1px solid var(--gradip-border); overflow:hidden; }
.linhaBarra__preenchido{ height:100%; background:var(--gradip-primary); }

/*---------------- MODAIS ----------------*/
.modalFundo{ position:fixed; inset:0; z-index:9000; display:flex; align-items:flex-start; justify-content:center; padding:32px 16px; overflow-y:auto; background:var(--gradip-overlay); }
.modalFundo--confirmacao{ z-index:9500; align-items:center; }
.modalPainel{ width:min(640px, 100%); max-height:calc(100vh - 64px); max-height:calc(100dvh - 64px); display:flex; flex-direction:column; background:var(--gradip-surface-elevated); color:var(--gradip-text); border:1px solid var(--gradip-border); border-radius:12px; box-shadow:0 18px 50px rgba(0,0,0,.22); outline:none; }
.modalPainel--pequeno{ width:min(460px, 100%); }
.modalCabecalho{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:16px 20px; border-bottom:1px solid var(--gradip-border); }
.modalCabecalho h2{ margin:2px 0 0; font-size:19px; overflow-wrap:anywhere; }
.modalEyebrow{ margin:0; font-size:12px; font-weight:bold; text-transform:uppercase; letter-spacing:.04em; color:var(--gradip-text-muted); }
.botaoFechar{ flex:0 0 44px; width:44px; height:44px; border:1px solid var(--gradip-border); border-radius:9px; background:var(--gradip-surface); color:var(--gradip-text); font-size:26px; line-height:1; cursor:pointer; }
.modalCorpo{ padding:18px 20px; overflow-y:auto; flex:1 1 auto; }
.modalRodape{ display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:10px; padding:14px 20px; border-top:1px solid var(--gradip-border); }
.statusSalvamento{ margin-right:auto; font-size:13px; color:var(--gradip-text-muted); }
.secaoDetalhe{ margin-bottom:20px; }
.secaoDetalhe h3{ margin:0 0 10px; padding-bottom:6px; border-bottom:2px solid var(--gradip-info-border); font-size:13px; text-transform:uppercase; letter-spacing:.03em; color:var(--gradip-link); }
.listaDados{ margin:0; }
.listaDados div{ display:flex; justify-content:space-between; gap:16px; padding:7px 0; border-bottom:1px solid var(--gradip-border); font-size:14px; }
.listaDados dt{ color:var(--gradip-text-muted); }
.listaDados dd{ margin:0; font-weight:bold; text-align:right; overflow-wrap:anywhere; }
#campoObservacoes{ width:100%; min-height:110px; padding:10px; border:1px solid var(--gradip-border-strong); border-radius:8px; background:var(--gradip-input-bg); color:var(--gradip-input-text); resize:vertical; }
#campoObservacoes:disabled{ background:var(--gradip-disabled-bg); color:var(--gradip-disabled-text); }
#observacoesAtuais{ margin-bottom:8px; white-space:pre-wrap; font-size:14px; }
.ajudaCampo{ margin:6px 0 0; font-size:13px; color:var(--gradip-text-muted); }
.opcao{ display:flex; align-items:center; gap:10px; min-height:44px; padding:4px 0; }
.opcao input{ width:20px; height:20px; flex:0 0 auto; margin:0; accent-color:var(--gradip-primary); }
.opcao label{ flex:1 1 auto; cursor:pointer; }
.opcao__dica{ display:block; font-size:12px; color:var(--gradip-text-muted); }
.opcao input:focus-visible{ outline:3px solid var(--gradip-focus); outline-offset:2px; }
.avisoLeitor{ margin:8px 0 0; font-size:13px; color:var(--gradip-text-muted); }
#mensagemDetalhe{ margin-top:4px; }

.aviso{ position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:9800; max-width:calc(100vw - 32px); padding:12px 18px; border:1px solid var(--gradip-success-border); border-left-width:4px; border-radius:8px; background:var(--gradip-success-bg); color:var(--gradip-text); box-shadow:var(--gradip-shadow); font-weight:bold; }

/* Conteúdo próprio da Central de Ajuda (o restante vem de
   GerenciadorAjudaEstilos, cópia sem alteração de shared/ajuda). */
.ajudaAtalhos{ display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:8px; margin:0; padding:0; list-style:none; }
.ajudaAtalhos .ajudaLink{ width:100%; min-height:44px; padding:8px 12px; border:1px solid var(--gradip-info-border); border-radius:8px; background:var(--gradip-info-bg); text-align:left; text-decoration:none; }
.ajudaLink{ padding:0; background:none; border:0; color:var(--gradip-link); font:inherit; font-weight:bold; text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
.ajudaLink:hover{ color:var(--gradip-link-hover); }
.ajudaLink:focus-visible{ outline:3px solid var(--gradip-focus); outline-offset:2px; }

.rodape{ margin:28px 0 0; text-align:center; font-size:12px; color:var(--gradip-text-muted); }

/*---------------- TELAS ESTREITAS ----------------*/
@media (max-width:1100px){
