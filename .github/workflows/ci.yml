# Verificação automática a cada push no main e em cada pull request.
# Documentação: docs/CI.md
# Actions fixadas por SHA do commit (comentário = versão); o Dependabot
# propõe as atualizações por PR (.github/dependabot.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Num PR, um push novo cancela a rodada anterior. No main, nunca: cada
# commit integrado precisa do próprio veredito (o Release confere).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PLAYWRIGHT_VERSAO: "1.56.0"

jobs:
  varredura:
    name: Dados sensíveis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node ferramentas/verificar_publicacao.js

  copias:
    name: Cópias de shared/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node ferramentas/verificar_copias_shared.js

  servidor:
    name: Servidor — ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite:
          - ferramentas/testes/testar_publicar_release.js
          - sistemas/busca-alunos/testes/testar_backend.js
          - sistemas/grade-horaria-visual/testes/testar_backend.js
          - sistemas/exclusao-disciplinas/formulario/testes/testar_backend.js
          - sistemas/trancamento-parcial/formulario/testes/testar_backend.js
          - sistemas/trancamento-total/formulario/testes/testar_backend.js
          - sistemas/trancamento-total/gerenciador/testes/testar_backend.js
          - sistemas/abertura-habilitacoes/gerenciador/testes/testar_backend.js
          - sistemas/abertura-habilitacoes/gerenciador/testes/testar_equivalencia.js
          - sistemas/painel-solicitacoes/testes/testar_contagem.js
          - sistemas/painel-servidores/testes/testar_acesso.js
          - sistemas/painel-servidores/testes/testar_saudacao.js
          - sistemas/painel-servidores/testes/testar_auditoria.js
          - ferramentas/testes/testar_conferir_implantacao.js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Rodar
        run: cd "$(dirname "${{ matrix.suite }}")" && node "$(basename "${{ matrix.suite }}")"

  tela:
    name: Tela — ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - sistemas/busca-alunos/testes/testar_navegador.js
          - sistemas/grade-horaria-visual/testes/testar_navegador.js
          - sistemas/exclusao-disciplinas/formulario/testes/testar_navegador.js
          - sistemas/trancamento-parcial/formulario/testes/testar_navegador.js
          - sistemas/trancamento-total/formulario/testes/testar_navegador.js
          - sistemas/painel-solicitacoes/testes/testar_navegador.js
          - sistemas/painel-servidores/testes/testar_navegador.js
          - sistemas/abertura-habilitacoes/gerenciador/testes/testar_navegador.js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Instalar Playwright e Chromium
        run: |
          npm install -g "playwright@${PLAYWRIGHT_VERSAO}"
          playwright install --with-deps chromium
      - name: Rodar
        run: cd "$(dirname "${{ matrix.suite }}")" && node "$(basename "${{ matrix.suite }}")"

  estrutura:
    name: Estrutura Curricular (suítes sintéticas)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sistemas/estrutura-curricular/testes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sistemas/estrutura-curricular/testes/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Só as suítes que não pedem exportações do Júpiter (ver testes/README.md).
      # Leitura de PDF no Chromium com o PDF.js 6.4.299 (legacy) e o worker reais,
      # só com PDFs sintéticos gerados pelo próprio teste (pdf_sintetico.js).
      - name: PDF sintético no Chromium (PDF.js e worker)
        run: node testar_pdf_sintetico.js
      - run: node testar_recomeco_google.js
      - run: node testar_etapa7_trava_auditoria.js
      - run: node testar_etapa8_previa_envio.js
      - run: node testar_etapa9_auditoria_envio.js
      - run: node testar_base_disciplinas.js
      - run: node testar_validacoes_planilha.js
      - run: node testar_protecao_grade.js
      - run: node testar_ajuda.js
      - run: node testar_navegacao_visual.js
      - run: node testar_navegador_etapa6.js
      - run: node testar_navegador_etapa8.js
      - run: node testar_navegador_etapa9.js

  # Verificação única para o ruleset do main exigir (docs/governanca/PROTECAO_DO_MAIN.md):
  # verde só se todas as etapas acima passaram. Etapa pulada ou cancelada conta como falha.
  concluida:
    name: CI concluída
    if: always()
    needs: [varredura, copias, servidor, tela, estrutura]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir as etapas
        env:
          RESULTADOS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Resultados: $RESULTADOS"
          if ! echo "$RESULTADOS" | jq -e 'length > 0 and all(. == "success")' >/dev/null; then
            echo "::error::Alguma etapa não passou (falha, cancelada ou pulada)."; exit 1
          fi
