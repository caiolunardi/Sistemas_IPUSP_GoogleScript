# Cria a Release no GitHub de uma versão de sistema.
# Formato da tag: <sistema>-v<versão>, por exemplo exclusao-disciplinas-v1.2.
# Uso: Actions → Release → Run workflow (no main), informando a(s) tag(s) e o
# commit de merge do PR. Documentação: docs/VERSOES.md.
#
# A conferência e a criação ficam em ferramentas/release/publicar_release.sh
# (testado em ferramentas/testes/testar_publicar_release.js): o commit precisa
# ser um estado do main criado pelo merge de um PR aceito, com a CI verde no
# push do main. Tudo é conferido antes de qualquer escrita; a tag nasce junto
# com a Release; nada é apagado nem movido.
#
# Não há gatilho por push de tag: uma tag enviada pelo git não gera Release.
name: Release

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Tag(s) a criar, separadas por espaço (ex.: exclusao-disciplinas-v1.3)"
        required: true
      commit:
        description: "SHA completo (40 caracteres) do commit de merge do PR, no main"
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Só a cópia do workflow que está no main. Uma cópia alterada noutro ramo
    # pularia esta linha, por isso o environment "release" também restringe o
    # ramo a main (docs/governanca/PROTECAO_DO_MAIN.md).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Com revisor obrigatório configurado no environment, a rodada espera a
    # aprovação no GitHub antes de começar. Sem o environment configurado, o
    # GitHub o cria vazio e a rodada não espera ninguém.
    environment: release
    permissions:
      contents: write       # criar a Release (e a tag junto)
      actions: read         # conferir a CI do commit
      pull-requests: read   # conferir o PR do commit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false   # nada é enviado pelo git; a escrita é pela API
      - name: Conferir o commit e criar a(s) Release(s)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAGS: ${{ inputs.tags }}
          COMMIT_PEDIDO: ${{ inputs.commit }}
        run: bash ferramentas/release/publicar_release.sh
