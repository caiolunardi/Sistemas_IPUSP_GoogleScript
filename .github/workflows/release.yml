# Cria a Release no GitHub de uma versão de sistema.
# Formato da tag: <sistema>-v<versão>, por exemplo exclusao-disciplinas-v1.2.
# Dois jeitos de usar (docs/VERSOES.md):
#   - enviar a tag pelo git (git push origin <tag>);
#   - Actions → Release → Run workflow, informando a(s) tag(s): o workflow
#     cria a tag no último commit do main e a Release.
name: Release

on:
  push:
    tags: ["*-v*"]
  workflow_dispatch:
    inputs:
      tags:
        description: "Tag(s) a criar no último commit do main, separadas por espaço (ex.: exclusao-disciplinas-v1.3)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Criar tag(s) e Release(s)
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ github.event_name == 'push' && github.ref_name || inputs.tags }}
          EVENTO: ${{ github.event_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for TAG in $TAGS; do
            if ! [[ "$TAG" =~ ^[a-z0-9-]+-v[0-9]+(\.[0-9]+)*$ ]]; then
              echo "::error::Tag fora do formato <sistema>-v<versão>: $TAG"; exit 1
            fi
            sistema="${TAG%-v*}"
            pasta="sistemas/${sistema}"; docs="docs/sistemas/${sistema%-gerenciador}"
            case "$sistema" in
              *-gerenciador) pasta="sistemas/${sistema%-gerenciador}/gerenciador" ;;
              planilha-secretarias) pasta="sistemas/estrutura-curricular/planilha-grade"; docs="docs/sistemas/planilha-grade-secretarias" ;;
            esac
            if [ ! -d "$pasta" ]; then echo "::error::Pasta $pasta não existe para a tag $TAG"; exit 1; fi

            if [ "$EVENTO" = "workflow_dispatch" ]; then
              if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
                echo "A tag $TAG já existe; usando a existente."
              else
                git tag -a "$TAG" -m "Versão $TAG (notas em notas-de-versao/$TAG.md)"
                git push origin "refs/tags/$TAG"
              fi
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG já existe."; continue; fi

            notas="notas-de-versao/${TAG}.md"
            if [ ! -f "$notas" ]; then
              # Sem notas escritas: lista os commits desde a versão anterior do mesmo sistema.
              anterior=$(git tag --list "${sistema}-v*" --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
              {
                echo "Versão sem notas escritas em notas-de-versao/. Commits incluídos:"
                echo
                git log --format='- %s (%h)' ${anterior:+$anterior..}"$TAG" -- "$pasta" "$docs"
              } > "$RUNNER_TEMP/notas.md"
              notas="$RUNNER_TEMP/notas.md"
            fi
            gh release create "$TAG" --title "$TAG" --notes-file "$notas" --verify-tag
          done
